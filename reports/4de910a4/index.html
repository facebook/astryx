size=\"small\" onPress={() => setCoverUrl('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200')}>Change cover</Button>\n        </div>\n      </div>\n      <div {...stylex.props(styles.header)}>\n        <Popover\n          content={\n            <div style={{display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, padding: 8}}>\n              {ICONS.map((e) => (\n                <Button key={e} variant=\"ghost\" onPress={() => setIcon(e)}><span style={{fontSize: 24}}>{e}</span></Button>\n              ))}\n            </div>\n          }\n          placement=\"below\"\n          label=\"Pick an icon\"\n        >\n          <button style={{fontSize: 48, background: 'none', border: 'none', cursor: 'pointer'}}>{icon}</button>\n        </Popover>\n        <div>\n          <Heading level={1}>Untitled</Heading>\n          <Text type=\"supporting\" color=\"secondary\">Start writing or press / for commands</Text>\n        </div>\n      </div>\n    </div>\n  );\n}\n","dd-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState, useMemo} from 'react';\nimport {Table, proportional} from '@astryxdesign/core/Table';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {Badge} from '@astryxdesign/core/Badge';\nimport {Avatar} from '@astryxdesign/core/Avatar';\nimport stylex from '@stylexjs/stylex';\n\nconst styles = stylex.create({\n  container: { display: 'flex', flexDirection: 'column', gap: 16 },\n  search: { maxWidth: 320 },\n});\n\ninterface User extends Record<string, unknown> {\n  id: number;\n  name: string;\n  email: string;\n  role: string;\n  status: 'active' | 'inactive';\n}\n\nconst USERS: User[] = [\n  {id: 1, name: 'Alice Johnson', email: 'alice@example.com', role: 'Admin', status: 'active'},\n  {id: 2, name: 'Bob Smith', email: 'bob@example.com', role: 'Editor', status: 'active'},\n  {id: 3, name: 'Carol White', email: 'carol@example.com', role: 'Viewer', status: 'inactive'},\n  {id: 4, name: 'Dave Brown', email: 'dave@example.com', role: 'Editor', status: 'active'},\n  {id: 5, name: 'Eve Davis', email: 'eve@example.com', role: 'Admin', status: 'active'},\n];\n\nexport default function UsersTable() {\n  const [search, setSearch] = useState('');\n  const [sortKey, setSortKey] = useState<keyof User>('name');\n  const [sortDir, setSortDir] = useState<'asc' | 'desc'>('asc');\n\n  const filtered = useMemo(() => {\n    const q = search.toLowerCase();\n    return USERS\n      .filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q))\n      .sort((a, b) => {\n        const av = String(a[sortKey]);\n        const bv = String(b[sortKey]);\n        return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);\n      });\n  }, [search, sortKey, sortDir]);\n\n  const columns = [\n    {key: 'name' as const, header: 'Name', width: proportional(2), renderCell: (row: User) => (\n      <div style={{display: 'flex', alignItems: 'center', gap: 8}}>\n        <Avatar name={row.name} size=\"small\" />\n        <span>{row.name}</span>\n      </div>\n    )},\n    {key: 'email' as const, header: 'Email', width: proportional(2)},\n    {key: 'role' as const, header: 'Role', width: proportional(1)},\n    {key: 'status' as const, header: 'Status', width: proportional(1), renderCell: (row: User) => (\n      <Badge variant={row.status === 'active' ? 'positive' : 'neutral'}>{row.status}</Badge>\n    )},\n  ];\n\n  return (\n    <div {...stylex.props(styles.container)}>\n      <div {...stylex.props(styles.search)}>\n        <TextInput label=\"Search users\" value={search} onChange={setSearch} placeholder=\"Search by name or email...\" hasClearButton />\n      </div>\n      <Table data={filtered} columns={columns} idKey=\"id\" hasHover density=\"balanced\" />\n    </div>\n  );\n}\n","fwc-4":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\nimport {AlertDialog} from '@astryxdesign/core/AlertDialog';\nimport {Button} from '@astryxdesign/core/Button';\n\nexport default function DeleteConfirmation() {\n  const [isOpen, setIsOpen] = useState(false);\n\n  const handleDelete = () => {\n    console.log('Item deleted');\n    setIsOpen(false);\n  };\n\n  return (\n    <div>\n      <Button variant=\"destructive\" onPress={() => setIsOpen(true)}>\n        Delete item\n      </Button>\n      <AlertDialog\n        isOpen={isOpen}\n        onOpenChange={setIsOpen}\n        title=\"Delete item\"\n        description=\"Are you sure you want to delete this item? This action cannot be undone.\"\n        actionLabel=\"Delete\"\n        onAction={handleDelete}\n        cancelLabel=\"Cancel\"\n        actionVariant=\"destructive\"\n      />\n    </div>\n  );\n}\n","io-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {Button} from '@astryxdesign/core/Button';\nimport {Banner} from '@astryxdesign/core/Banner';\nimport stylex from '@stylexjs/stylex';\n\nconst styles = stylex.create({\n  form: { display: 'flex', flexDirection: 'column', gap: 16, maxWidth: 400 },\n});\n\nexport default function SubscribeForm() {\n  const [email, setEmail] = useState('');\n  const [status, setStatus] = useState<{type: 'error' | 'success'; message: string} | null>(null);\n  const [isLoading, setIsLoading] = useState(false);\n\n  const validate = (v: string) => {\n    if (!v) {return 'Email is required';}\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(v)) {return 'Invalid email';}\n    return null;\n  };\n\n  const handleSubmit = async (e: React.FormEvent) => {\n    e.preventDefault();\n    const err = validate(email);\n    if (err) { setStatus({type: 'error', message: err}); return; }\n    setIsLoading(true);\n    try {\n      const res = await fetch('/api/subscribe', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email})});\n      if (!res.ok) {throw new Error('Failed');}\n      setStatus({type: 'success', message: 'Subscribed successfully!'});\n      setEmail('');\n    } catch { setStatus({type: 'error', message: 'Something went wrong.'}); }\n    finally { setIsLoading(false); }\n  };\n\n  return (\n    <form onSubmit={handleSubmit} {...stylex.props(styles.form)}>\n      {status && <Banner type={status.type}>{status.message}</Banner>}\n      <TextInput label=\"Email\" type=\"email\" value={email} onChange={setEmail} placeholder=\"you@example.com\" isRequired />\n      <Button type=\"submit\" variant=\"filled\" isLoading={isLoading}>Subscribe</Button>\n    </form>\n  );\n}\n","ps-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\nimport {AppShell} from '@astryxdesign/core/AppShell';\nimport {SideNav} from '@astryxdesign/core/SideNav';\nimport {SideNavHeading} from '@astryxdesign/core/SideNav';\nimport {SideNavSection} from '@astryxdesign/core/SideNav';\nimport {SideNavItem} from '@astryxdesign/core/SideNav';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\nimport {Card} from '@astryxdesign/core/Card';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {Switch} from '@astryxdesign/core/Switch';\nimport {Button} from '@astryxdesign/core/Button';\nimport stylex from '@stylexjs/stylex';\n\nconst styles = stylex.create({\n  content: { padding: 32, display: 'flex', flexDirection: 'column', gap: 24, maxWidth: 720 },\n  row: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBlock: 12 },\n});\n\nexport default function SettingsDashboard() {\n  const [section, setSection] = useState('general');\n  const [name, setName] = useState('John Doe');\n  const [email, setEmail] = useState('john@example.com');\n  const [emailNotifs, setEmailNotifs] = useState(true);\n\n  return (\n    <AppShell sideNav={\n      <SideNav header={<SideNavHeading heading=\"Settings\" />}>\n        <SideNavSection title=\"Account\">\n          <SideNavItem label=\"General\" isSelected={section === 'general'} onClick={() => setSection('general')} />\n          <SideNavItem label=\"Notifications\" isSelected={section === 'notifications'} onClick={() => setSection('notifications')} />\n          <SideNavItem label=\"Security\" isSelected={section === 'security'} onClick={() => setSection('security')} />\n        </SideNavSection>\n      </SideNav>\n    }>\n      <div {...stylex.props(styles.content)}>\n        <Heading level={2}>{section.charAt(0).toUpperCase() + section.slice(1)}</Heading>\n        {section === 'general' && (\n          <Card><div style={{padding: 24, display: 'flex', flexDirection: 'column', gap: 16}}>\n            <TextInput label=\"Name\" value={name} onChange={setName} />\n            <TextInput label=\"Email\" value={email} onChange={setEmail} />\n            <Button variant=\"filled\">Save</Button>\n          </div></Card>\n        )}\n        {section === 'notifications' && (\n          <Card><div style={{padding: 24}}>\n            <div {...stylex.props(styles.row)}><Text>Email notifications</Text><Switch isSelected={emailNotifs} onChange={setEmailNotifs} label=\"Email notifications\" /></div>\n          </div></Card>\n        )}\n      </div>\n    </AppShell>\n  );\n}\n","rc-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React from 'react';\nimport {AppShell} from '@astryxdesign/core/AppShell';\nimport {TopNav} from '@astryxdesign/core/TopNav';\nimport {SideNav} from '@astryxdesign/core/SideNav';\nimport {SideNavHeading} from '@astryxdesign/core/SideNav';\nimport {SideNavSection} from '@astryxdesign/core/SideNav';\nimport {SideNavItem} from '@astryxdesign/core/SideNav';\nimport {MobileNav} from '@astryxdesign/core/MobileNav';\nimport {MobileNavToggle} from '@astryxdesign/core/MobileNav';\nimport {Heading} from '@astryxdesign/core/Heading';\n\nconst navItems = (\n  <SideNavSection title=\"Main\">\n    <SideNavItem label=\"Home\" isSelected href=\"/\" />\n    <SideNavItem label=\"Products\" href=\"/products\" />\n    <SideNavItem label=\"About\" href=\"/about\" />\n    <SideNavItem label=\"Contact\" href=\"/contact\" />\n  </SideNavSection>\n);\n\nexport default function ResponsiveNav() {\n  return (\n    <AppShell\n      sideNav={<SideNav header={<SideNavHeading heading=\"MyApp\" />}>{navItems}</SideNav>}\n      mobileNav={<MobileNav header=\"MyApp\">{navItems}</MobileNav>}\n      topNav={<TopNav heading={<Heading level={4}>MyApp</Heading>} startContent={<MobileNavToggle />} />}\n    >\n      <div style={{padding: 32}}>\n        <Heading level={1}>Welcome</Heading>\n      </div>\n    </AppShell>\n  );\n}\n","sd-3":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState, useMemo} from 'react';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {Button} from '@astryxdesign/core/Button';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport stylex from '@stylexjs/stylex';\n\nconst styles = stylex.create({\n  form: { display: 'flex', flexDirection: 'column', gap: 16, maxWidth: 400, padding: 24 },\n});\n\nexport default function ValidatedForm() {\n  const [name, setName] = useState('');\n  const [email, setEmail] = useState('');\n  const [password, setPassword] = useState('');\n  const [touched, setTouched] = useState<Record<string, boolean>>({});\n\n  const errors = useMemo(() => ({\n    name: !name.trim() ? 'Name is required' : null,\n    email: !email ? 'Email is required' : !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email) ? 'Invalid email' : null,\n    password: !password ? 'Password is required' : password.length < 8 ? 'Min 8 characters' : null,\n  }), [name, email, password]);\n\n  const isValid = !errors.name && !errors.email && !errors.password;\n  const mark = (f: string) => setTouched(p => ({...p, [f]: true}));\n\n  return (\n    <form onSubmit={e => { e.preventDefault(); if (isValid) {console.log('submitted');} }} {...stylex.props(styles.form)}>\n      <Heading level={3}>Create account</Heading>\n      <TextInput label=\"Full name\" value={name} onChange={setName} onBlur={() => mark('name')} status={touched.name && errors.name ? {type: 'error', message: errors.name} : undefined} isRequired />\n      <TextInput label=\"Email\" type=\"email\" value={email} onChange={setEmail} onBlur={() => mark('email')} status={touched.email && errors.email ? {type: 'error', message: errors.email} : undefined} isRequired />\n      <TextInput label=\"Password\" type=\"password\" value={password} onChange={setPassword} onBlur={() => mark('password')} status={touched.password && errors.password ? {type: 'error', message: errors.password} : undefined} isRequired />\n      <Button type=\"submit\" variant=\"filled\" isDisabled={!isValid}>Create account</Button>\n    </form>\n  );\n}\n","tc-7":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React from 'react';\nimport {Card} from '@astryxdesign/core/Card';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\nimport {Button} from '@astryxdesign/core/Button';\nimport {MediaTheme} from '@astryxdesign/core/theme';\nimport stylex from '@stylexjs/stylex';\n\nconst styles = stylex.create({\n  page: { padding: 32, display: 'flex', flexDirection: 'column', gap: 32 },\n  dark: { backgroundColor: '#1a1a2e', borderRadius: 'var(--radius-lg)', padding: 32 },\n  grid: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 16, marginTop: 16 },\n});\n\nexport default function ThemedSection() {\n  return (\n    <div {...stylex.props(styles.page)}>\n      <section>\n        <Heading level={2}>Regular section</Heading>\n        <Text>Default theme content.</Text>\n      </section>\n      <section {...stylex.props(styles.dark)}>\n        <MediaTheme mode=\"dark\">\n          <Heading level={2}>Featured</Heading>\n          <Text color=\"secondary\">Dark themed section.</Text>\n          <div {...stylex.props(styles.grid)}>\n            <Card><div style={{padding: 16}}><Heading level={4}>Premium</Heading><Text type=\"supporting\">Best for teams</Text><Button variant=\"filled\" onPress={() => {}}>Upgrade</Button></div></Card>\n            <Card><div style={{padding: 16}}><Heading level={4}>Enterprise</Heading><Text type=\"supporting\">Custom solutions</Text><Button variant=\"outlined\" onPress={() => {}}>Contact</Button></div></Card>\n          </div>\n        </MediaTheme>\n      </section>\n    </div>\n  );\n}\n","ty-2":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React from 'react';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\nimport {Avatar} from '@astryxdesign/core/Avatar';\nimport {Badge} from '@astryxdesign/core/Badge';\nimport stylex from '@stylexjs/stylex';\n\nconst styles = stylex.create({\n  header: { maxWidth: 720, marginInline: 'auto', paddingBlock: 48, display: 'flex', flexDirection: 'column', gap: 16 },\n  meta: { display: 'flex', alignItems: 'center', gap: 12, paddingTop: 8 },\n});\n\nexport default function BlogPostHeader() {\n  return (\n    <header {...stylex.props(styles.header)}>\n      <Badge variant=\"accent\">Design Systems</Badge>\n      <Heading level={1} type=\"display-1\">The Future of Component Architecture</Heading>\n      <Text type=\"large\" color=\"secondary\">How compositional patterns and design tokens reshape UI development at scale.</Text>\n      <div {...stylex.props(styles.meta)}>\n        <Avatar name=\"Sarah Chen\" size=\"medium\" />\n        <div style={{display: 'flex', flexDirection: 'column'}}>\n          <Text>Sarah Chen</Text>\n          <Text type=\"supporting\" color=\"secondary\">July 26, 2026</Text>\n        </div>\n      </div>\n    </header>\n  );\n}\n","wd-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\nimport {Stepper} from '@astryxdesign/core/Stepper';\nimport {Button} from '@astryxdesign/core/Button';\nimport {Card} from '@astryxdesign/core/Card';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {Divider} from '@astryxdesign/core/Divider';\nimport stylex from '@stylexjs/stylex';\n\nconst styles = stylex.create({\n  container: { maxWidth: 640, marginInline: 'auto', padding: 32, display: 'flex', flexDirection: 'column', gap: 24 },\n  actions: { display: 'flex', justifyContent: 'space-between' },\n  item: { display: 'flex', justifyContent: 'space-between', paddingBlock: 8 },\n});\n\nconst STEPS = ['Cart', 'Shipping', 'Payment', 'Confirmation'];\n\nexport default function CheckoutFlow() {\n  const [step, setStep] = useState(0);\n  const [address, setAddress] = useState('');\n  const [city, setCity] = useState('');\n  const [card, setCard] = useState('');\n\n  return (\n    <div {...stylex.props(styles.container)}>\n      <Stepper steps={STEPS} activeStep={step} />\n      <Card>\n        <div style={{padding: 24}}>\n          {step === 0 && (<>\n            <Heading level={3}>Cart summary</Heading>\n            <div {...stylex.props(styles.item)}><Text>Widget Pro x2</Text><Text>$49.98</Text></div>\n            <div {...stylex.props(styles.item)}><Text>Gadget Mini</Text><Text>$19.99</Text></div>\n            <Divider />\n            <div {...stylex.props(styles.item)}><Text type=\"label\">Total</Text><Text type=\"label\">$69.97</Text></div>\n          </>)}\n          {step === 1 && (<div style={{display: 'flex', flexDirection: 'column', gap: 16}}>\n            <Heading level={3}>Shipping</Heading>\n            <TextInput label=\"Address\" value={address} onChange={setAddress} isRequired />\n            <TextInput label=\"City\" value={city} onChange={setCity} isRequired />\n          </div>)}\n          {step === 2 && (<div style={{display: 'flex', flexDirection: 'column', gap: 16}}>\n            <Heading level={3}>Payment</Heading>\n            <TextInput label=\"Card number\" value={card} onChange={setCard} isRequired />\n          </div>)}\n          {step === 3 && (<div style={{textAlign: 'center', padding: 32}}>\n            <Heading level={3}>Order confirmed!</Heading>\n            <Text color=\"secondary\">Thank you for your purchase.</Text>\n          </div>)}\n        </div>\n      </Card>\n      <div {...stylex.props(styles.actions)}>\n        <Button variant=\"ghost\" onPress={() => setStep(s => s - 1)} isDisabled={step === 0}>Back</Button>\n        {step < 3 && <Button variant=\"filled\" onPress={() => setStep(s => s + 1)}>{step === 2 ? 'Place order' : 'Continue'}</Button>}\n      </div>\n    </div>\n  );\n}\n"},"baselineSourceCode":{"cwm-3":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\nimport {Card} from '@/components/ui/card';\nimport {Button} from '@/components/ui/button';\nimport {Popover, PopoverContent, PopoverTrigger} from '@/components/ui/popover';\n\nconst ICONS = ['\\u{1F4C4}', '\\u{1F3AF}', '\\u{1F4CA}', '\\u{1F680}', '\\u{1F4A1}', '\\u{1F527}', '\\u{1F4DD}', '\\u{1F3A8}'];\n\nexport default function NotionPageHeader() {\n  const [icon, setIcon] = useState('\\u{1F4C4}');\n  const [coverUrl, setCoverUrl] = useState<string | null>(null);\n\n  return (\n    <div>\n      <div className=\"h-48 bg-muted rounded-lg relative overflow-hidden\">\n        {coverUrl && <img src={coverUrl} alt=\"Cover\" className=\"w-full h-full object-cover\" />}\n        <div className=\"absolute top-3 right-3\">\n          <Button variant=\"secondary\" size=\"sm\" onClick={() => setCoverUrl('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200')}>Change cover</Button>\n        </div>\n      </div>\n      <div className=\"flex items-start gap-4 p-6\">\n        <Popover>\n          <PopoverTrigger asChild>\n            <button className=\"text-5xl bg-transparent border-none cursor-pointer\">{icon}</button>\n          </PopoverTrigger>\n ncludes(q))\n      .sort((a, b) => sortDir === 'asc' ? String(a[sortKey]).localeCompare(String(b[sortKey])) : String(b[sortKey]).localeCompare(String(a[sortKey])));\n  }, [search, sortKey, sortDir]);\n\n  const toggleSort = (key: keyof User) => {\n    if (sortKey === key) {setSortDir(d => d === 'asc' ? 'desc' : 'asc');}\n    else { setSortKey(key); setSortDir('asc'); }\n  };\n\n  return (\n    <div className=\"space-y-4\">\n      <Input placeholder=\"Search by name or email...\" value={search} onChange={e => setSearch(e.target.value)} className=\"max-w-xs\" />\n      <Table>\n        <TableHeader>\n          <TableRow>\n            <TableHead><Button variant=\"ghost\" onClick={() => toggleSort('name')}>Name <ArrowUpDown className=\"ml-2 h-4 w-4\" /></Button></TableHead>\n            <TableHead><Button variant=\"ghost\" onClick={() => toggleSort('email')}>Email <ArrowUpDown className=\"ml-2 h-4 w-4\" /></Button></TableHead>\n            <TableHead>Role</TableHead>\n            <TableHead>Status</TableHead>\n          </TableRow>\n        </TableHeader>\n        <TableBody>\n          {filtered.map(user => (\n            <TableRow key={user.id}>\n              <TableCell className=\"flex items-center gap-2\">\n                <Avatar className=\"h-8 w-8\"><AvatarFallback>{user.name.split(' ').map(n => n[0]).join('')}</AvatarFallback></Avatar>\n                {user.name}\n              </TableCell>\n              <TableCell>{user.email}</TableCell>\n              <TableCell>{user.role}</TableCell>\n              <TableCell><Badge variant={user.status === 'active' ? 'default' : 'secondary'}>{user.status}</Badge></TableCell>\n            </TableRow>\n          ))}\n        </TableBody>\n      </Table>\n    </div>\n  );\n}\n","fwc-4":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\nimport {AlertDialog, AlertDialogAction, AlertDialogCancel, AlertDialogContent, AlertDialogDescription, AlertDialogFooter, AlertDialogHeader, Al setStatus({type: 'success', message: 'Subscribed!'});\n      setEmail('');\n    } catch { setStatus({type: 'error', message: 'Something went wrong.'}); }\n    finally { setIsLoading(false); }\n  };\n\n  return (\n    <form onSubmit={handleSubmit} className=\"flex flex-col gap-4 max-w-sm\">\n      {status && <Alert variant={status.type === 'error' ? 'destructive' : 'default'}><AlertDescription>{status.message}</AlertDescription></Alert>}\n      <div className=\"space-y-2\">\n        <Label htmlFor=\"email\">Email address</Label>\n        <Input id=\"email\" type=\"email\" value={email} onChange={e => setEmail(e.target.value)} placeholder=\"you@example.com\" required />\n      </div>\n      <Button type=\"submit\" disabled={isLoading}>{isLoading ? 'Subscribing...' : 'Subscribe'}</Button>\n    </form>\n  );\n}\n","ps-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\nimport {Card, CardContent, CardHeader, CardTitle} from '@/components/ui/card';\nimport {Input} from '@/components/ui/input';\nimport {Label} from '@/components/ui/label';\nimport {Button} from '@/components/ui/button';\nimport {Switch} from '@/components/ui/switch';\n\ntype Section = 'general' | 'notifications' | 'security';\n\nexport default function SettingsDashboard() {\n  const [section, setSection] = useState<Section>('general');\n\n  return (\n    <div className=\"flex min-h-screen\">\n      <nav className=\"w-64 border-r p-4\">\n        <h2 className=\"text-lg font-semibold mb-4\">Settings</h2>\n        <ul className=\"space-y-1\">\n          {(['general', 'notifications', 'security'] as Section[]).map(s => (\n            <li key={s}><button onClick={() => setSection(s)} className={`w-full text-left px-3 py-2 rounded-md ${section === s ? 'bg-accent' : 'hover:bg-muted'}`}>{s.charAt(0).toUpperCase() + s.slice(1)}</button></li>\n          ))}\n        </ul>\n      </nav>\n      <main className=\"flex-1 p-8 max-w-2xl\">\n        <h1 className=\"text-2xl font-bold mb-6\">{section.charAt(0).toUpperCase() + section.slice(1)}</h1>\n        {section === 'general' && (\n          <Card><CardHeader><CardTitle>Profile</CardTitle></CardHeader><CardContent className=\"space-y-4\">\n            <div className=\"space-y-2\"><Label>Name</Label><Input defaultValue=\"John Doe\" /></div>\n            <div className=\"space-y-2\"><Label>Email</Label><Input defaultValue=\"john@example.com\" type=\"email\" /></div>\n            <Button>Save</Button>\n          </CardContent></Card>\n        )}\n        {section === 'notifications' && (\n          <Card><CardHeader><CardTitle>Notifications</CardTitle></CardHeader><CardContent className=\"space-y-4\">\n            <div className=\"flex items-center justify-between\"><Label>Email notifications</Label><Switch defaultChecked /></div>\n            <div className=\"flex items-center justify-between\"><Label>Push notifications</Label><Switch /></div>\n          </CardContent></Card>\n        )}\n      </main>\n    </div>\n  );\n}\n","rc-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\nimport {Button} from '@/components/ui/button';\nimport {Sheet, SheetContent, SheetTrigger} from '@/components/ui/sheet';\nimport {Menu} from 'lucide-react';\n\nconst NAV_ITEMS = [{label: 'Home', href: '/'}, {label: 'Products', href: '/products'}, {label: 'About', href: '/about'}, {label: 'Contact', href: '/contact'}];\n\nexport default function ResponsiveNav() {\n  const [isOpen, setIsOpen] = useState(false);\n\n  return (\n    <div>\n      <header className=\"border-b\">\n        <div className=\"flex items-center justify-between p-4 max-w-6xl mx-auto\">\n          <span className=\"text-xl font-bold\">MyApp</span>\n          <nav className=\"hidden md:flex gap-4\">\n            {NAV_ITEMS.map(item => <a key={item.href} href={item.href} className=\"text-sm text-muted-foreground hover:text-foreground\">{item.label}</a>)}\n          </nav>\n          <Sheet ope yright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState, useMemo} from 'react';\n\ninterface User { id: number; name: string; email: string; role: string; status: string; }\n\nconst USERS: User[] = [\n  {id: 1, name: 'Alice Johnson', email: 'alice@example.com', role: 'Admin', status: 'active'},\n  {id: 2, name: 'Bob Smith', email: 'bob@example.com', role: 'Editor', status: 'active'},\n  {id: 3, name: 'Carol White', email: 'carol@example.com', role: 'Viewer', status: 'inactive'},\n  {id: 4, name: 'Dave Brown', email: 'dave@example.com', role: 'Editor', status: 'active'},\n  {id: 5, name: 'Eve Davis', email: 'eve@example.com', role: 'Admin', status: 'active'},\n];\n\nexport default function UsersTable() {\n  const [search, setSearch] = useState('');\n  const [sortKey, setSortKey] = useState<keyof User>('name');\n  const [sortDir, setSortDir] = useState<'asc' | 'desc'>('asc');\n\n  const filtered = useMemo(() => {\n    const q = search.toLowerCase();\n    return USERS.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q))\n      .sort((a, b) => sortDir === 'asc' ? String(a[sortKey]).localeCompare(String(b[sortKey])) : String(b[sortKey]).localeCompare(String(a[sortKey])));\n  }, [search, sortKey, sortDir]);\n\n  const toggleSort = (key: keyof User) => { setSortKey(key); setSortDir(d => sortKey === key ? (d === 'asc' ? 'desc' : 'asc') : 'asc'); };\n\n  return (\n    <div style={{padding: 16}}>\n      <input value={search} onChange={e => setSearch(e.target.value)} placeholder=\"Search...\" style={{padding: '8px 12px', border: '1px solid #ddd', borderRadius: 6, marginBottom: 16, width: 300}} />\n      <table style={{width: '100%', borderCollapse: 'collapse'}}>\n        <thead>\n          <tr style={{borderBottom: '2px solid #eee'}}>\n            <th style={{textAlign: 'left', padding: 12, cursor: 'pointer'}} onClick={() => toggleSort('name')}>Name {sortKey === 'name' ? (sortDir === 'asc' ? '↑' : '↓') : ''}</th>\n            <th style={{textAlign: 'left', padding: 12, cursor: 'pointer'}} onClick={() => toggleSort('email')}>Email</th>\n            <th style={{textAlign: 'left', padding: 12}}>Role</th>\n            <th style={{textAlign: 'left', padding: 12}}>Status</th>\n          </tr>\n        </thead>\n        <tbody>\n          {filtered.map(u => (\n            <tr key={u.id} style={{borderBottom: '1px solid #eee'}}>\n              <td style={{padding: 12}}>{u.name}</td>\n              <td style={{padding: 12}}>{u.email}</td>\n              <td style={{padding: 12}}>{u.role}</td>\n              <td style={{padding: 12}}><span style={{padding: '2px 8px', borderRadius: 12, fontSize: 12, backgroundColor: u.status === 'active' ? '#dcfce7' : '#f3f4f6'}}>{u.status}</span></td>\n            </tr>\n          ))}\n        </tbody>\n      </table>\n    </div>\n  );\n}\n","fwc-4":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\n\nexport default function DeleteConfirmation() {\n  const [isOpen, setIsOpen] = useState(false);\n\n  return (\n    <div>\n      <button onClick={() => setIsOpen(true)} style={{backgroundColor: '#dc2626', color: 'white', padding: '8px 16px', border: 'none', borderRadius: 6, cursor: 'pointer'}}>Delete item</button>\n      {isOpen && (\n        <div style={{position: 'fixed', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', backgroundColor: 'rgba(0,0,0,0.5)', zIndex: 1000}}>\n          <div style={{backgroundColor: 'white', borderRadius: 8, padding: 24, maxWidth: 400, width: '90%', boxShadow: '0 4px 12px rgba(0,0,0,0.15)'}}>\n            <h2 style={{margin: '0 0 8px', fontSize: 18, fontWeight: 600}}>Delete item</h2>\n            <p style={{margin: '0 0 24px', color: '#666'}}>Are you sure you want to delete this item? This action cannot be undone.</p>\n            <div style={{display: 'flex', justifyContent: 'flex-end', gap: 8}}>\n              <button onClick={() => setIsOpen(false)} style={{padding: '8px 16px', border: '1px solid #ddd', borderRadius: 6, cursor: 'pointer', backgroundColor: 'white'}}>Cancel</button>\n              <button onClick={() => { console.log('deleted'); setIsOpen(false); }} style={{padding: '8px 16px', backgroundColor: '#dc2626', color: 'white', border: 'none', borderRadius: 6, cursor: 'pointer'}}>Delete</button>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n}\n","io-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\n\nexport default function SubscribeForm() {\n  const [email, setEmail] = useState('');\n  const [status, setStatus] = useState<{type: string; message: string} | null>(null);\n  const [isLoading, setIsLoading] = useState(false);\n\n  const handleSubmit = async (e: React.FormEvent) => {\n    e.preventDefault();\n    if (!email || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) { setStatus({type: 'error', message: 'Valid email required'}); return; }\n    setIsLoading(true);\n    try {\n      const res = await fetch('/api/subscribe', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email})});\n      if (!res.ok) {throw new Error('Failed');}\n      setStatus({type: 'success', message: 'Subscribed!'});\n      setEmail('');\n    } catch { setStatus({type: 'error', message: 'Something went wrong.'}); }\n    finally { setIsLoading(false); }\n  };\n\n  return (\n    <form onSubmit={handleSubmit} style={{display: 'flex', flexDirection: 'column', gap: 16, maxWidth: 400}}>\n      {status && <div style={{padding: '12px 16px', borderRadius: 6, backgroundColor: status.type === 'error' ? '#fef2f2' : '#f0fdf4', color: status.type === 'error' ? '#dc2626' : '#16a34a', border: `1px solid ${status.type === 'error' ? '#fecaca' : '#bbf7d0'}`}}>{status.message}</div>}\n      <label style={{display: 'flex', flexDirection: 'column', gap: 4}}>\n        <span style={{fontSize: 14, fontWeight: 500}}>Email address</span>\n        <input type=\"email\" value={email} onChange={e => setEmail(e.target.value)} placeholder=\"you@example.com\" required style={{padding: '8px 12px', border: '1px solid #ddd', borderRadius: 6}} />\n      </label>\n      <button type=\"submit\" disabled={isLoading} style={{padding: '10px 16px', backgroundColor: '#2563eb', color: 'white', border: 'none', borderRadius: 6, cursor: 'pointer', opacity: isLoading ? 0.7 : 1}}>{isLoading ? 'Subscribing...' : 'Subscribe'}</button>\n    </form>\n  );\n}\n","ps-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\n\ntype Section = 'general' | 'notifications' | 'security';\n\nexport default function SettingsDashboard() {\n  const [section, setSection] = useState<Section>('general');\n  const [name, setName] = useState('John Doe');\n  const [notifs, setNotifs] = useState(true);\n\n  return (\n    <div style={{display: 'flex', minHeight: '100vh'}}>\n      <nav style={{width: 240, borderRight: '1px solid #eee', padding: 16}}>\n        <h2 style={{fontSize: 18, fontWeight: 600, marginBottom: 16}}>Settings</h2>\n        {(['general', 'notifications', 'security'] as Section[]).map(s => (\n          <button key={s} onClick={() => setSection(s)} style={{display: 'block', width: '100%', textAlign: 'left', padding: '8px 12px', border: 'none', borderRadius: 6, cursor: 'pointer', backgroundColor: section === s ? '#f3f4f6' : 'transparent', marginBottom: 4}}>{s.charAt(0).toUpperCase() + s.slice(1)}</button>\n        ))}\n      </nav>\n      <main style={{flex: 1, padding: 32, maxWidth: 640}}>\n        <h1 style={{fontSize: 24, fontWeight: 700, marginBottom: 24}}>{section.charAt(0).toUpperCase() + section.slice(1)}</h1>\n        {section === 'general' && (\n          <div style={{border: '1px solid #eee', borderRadius: 8, padding: 24}}>\n            <label style={{display: 'block', marginBottom: 16}}><span style={{display: 'block', fontSize: 14, fontWeight: 500, marginBottom: 4}}>Name</span><input value , backgroundColor: 'rgba(0,0,0,0.3)'}} />\n          <nav style={{position: 'absolute', top: 0, left: 0, bottom: 0, width: 280, backgroundColor: 'white', padding: 24, display: 'flex', flexDirection: 'column', gap: 16}}>\n            <button onClick={() => setIsOpen(false)} style={{alignSelf: 'flex-end', background: 'none', border: 'none', fontSize: 24, cursor: 'pointer'}}>&times;</button>\n            {NAV_ITEMS.map(item => <a key={item.href} href={item.href} style={{fontSize: 18, textDecoration: 'none', color: '#333'}}>{item.label}</a>)}\n          </nav>\n        </div>\n      )}\n      <main style={{padding: 32}}><h1 style={{fontSize: 32, fontWeight: 700}}>Welcome</h1></main>\n    </div>\n  );\n}\n","sd-3":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState, useMemo} from 'react';\n\nexport default function ValidatedForm() {\n  const [name, setName] = useState('');\n  const [email, setEmail] = useState('');\n  const [password, setPassword] = useState('');\n  const [touched, setTouched] = useState<Record<string, boolean>>({});\n\n  const errors = useMemo(() => ({\n    name: !name.trim() ? 'Name is required' : null,\n    email: !email ? 'Email is required' : !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email) ? 'Invalid email' : null,\n    password: !password ? 'Required' : password.length < 8 ? 'Min 8 characters' : null,\n  }), [name, email, password]);\n\n  const isValid = !errors.name && !errors.email && !errors.password;\n\n  const fieldStyle = {width: '100%', padding: '8px 12px', border: '1px solid #ddd', borderRadius: 6};\n  const errorStyle = {color: '#dc2626', fontSize: 12, marginTop: 4};\n\n  return (\n    <form onSubmit={e => { e.preventDefault(); }} style={{display: 'flex', flexDirection: 'column', gap: 16, maxWidth: 400, padding: 24}}>\n      <h2 style={{fontSize: 20, fontWeight: 600, margin: 0}}>Create account</h2>\n      <div>\n        <label style={{fontSize: 14, fontWeight: 500}}>Full name *</label>\n        <input value={name} onChange={e => setName(e.target.value)} onBlur={() => setTouched(p => ({...p, name: true}))} style={fieldStyle} />\n        {touched.name && errors.name && <p style={errorStyle}>{errors.name}</p>}\n      </div>\n      <div>\n        <label style={{fontSize: 14, fontWeight: 500}}>Email *</label>\n        <input type=\"email\" value={email} onChange={e => setEmail(e.target.value)} onBlur={() => setTouched(p => ({...p, email: true}))} style={fieldStyle} />\n        {touched.email && errors.email && <p style={errorStyle}>{errors.email}</p>}\n      </div>\n      <div>\n        <label style={{fontSize: 14, fontWeight: 500}}>Password *</label>\n        <input type=\"password\" value={password} onChange={e => setPassword(e.target.value)} onBlur={() => setTouched(p => ({...p, password: true}))} style={fieldStyle} />\n        {touched.password && errors.password && <p style={errorStyle}>{errors.password}</p>}\n      </div>\n      <button type=\"submit\" disabled={!isValid} style={{padding: '10px 16px', backgroundColor: isValid ? '#2563eb' : '#94a3b8', color: 'white', border: 'none', borderRadius: 6, cursor: isValid ? 'pointer' : 'not-allowed'}}>Create account</button>\n    </form>\n  );\n}\n","tc-7":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React from 'react';\n\nexport default function ThemedSection() {\n  return (\n    <div style={{padding: 32, display: 'flex', flexDirection: 'column', gap: 32}}>\n      <section>\n        <h2 style={{fontSize: 24, fontWeight: 700}}>Regular section</h2>\n        <p style={{color: '#666'}}>Default light theme content.</p>\n      </section>\n      <section style={{backgroundColor: '#1a1a2e', borderRadius: 12, padding: 32, color: 'white'}}>\n        <h2 style={{fontSize: 24, fontWeight: 700}}>Featured content</h2>\n        <p style={{color: '#aaa'}}>Dark section for visual emphasis.</p>\n        <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: 16, marginTop: 16}}>\n  500}}>Sarah Chen</div>\n          <div style={{fontSize: 12, color: '#999'}}>July 26, 2026</div>\n        </div>\n      </div>\n    </header>\n  );\n}\n","wd-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\n\nconst STEPS = ['Cart', 'Shipping', 'Payment', 'Confirmation'];\n\nexport default function CheckoutFlow() {\n  const [step, setStep] = useState(0);\n\n  return (\n    <div style={{maxWidth: 600, margin: '0 auto', padding: 32}}>\n      <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 24}}>\n        {STEPS.map((s, i) => (\n          <div key={s} style={{display: 'flex', alignItems: 'center', gap: 8}}>\n            <div style={{width: 32, height: 32, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, backgroundColor: i <= step ? '#2563eb' : '#e5e7eb', color: i <= step ? 'white' : '#666'}}>{i + 1}</div>\n            <span style={{fontSize: 14, color: i <= step ? '#111' : '#999'}}>{s}</span>\n          </div>\n        ))}\n      </div>\n      <div style={{border: '1px solid #eee', borderRadius: 8, padding: 24, marginBottom: 24}}>\n        {step === 0 && (<div>\n          <h3 style={{margin: '0 0 16px'}}>Cart summary</h3>\n          <div style={{display: 'flex', justifyContent: 'space-between', padding: '8px 0'}}><span>Widget Pro x2</span><span>$49.98</span></div>\n          <div style={{display: 'flex', justifyContent: 'space-between', padding: '8px 0'}}><span>Gadget Mini</span><span>$19.99</span></div>\n          <hr style={{border: 'none', borderTop: '1px solid #eee', margin: '12px 0'}} />\n          <div style={{display: 'flex', justifyContent: 'space-between', fontWeight: 600}}><span>Total</span><span>$69.97</span></div>\n        </div>)}\n        {step === 1 && (<div><h3 style={{margin: '0 0 16px'}}>Shipping</h3><input placeholder=\"Address\" style={{width: '100%', padding: 8, marginBottom: 12, border: '1px solid #ddd', borderRadius: nt=\"ghost\" size=\"small\" onPress={() => setCoverUrl('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200')}>Change cover</Button>\n        </div>\n      </div>\n      <div className=\"flex items-start gap-4 p-6\">\n        <Popover content={<div className=\"grid grid-cols-3 gap-2 p-2\">{ICONS.map(e => <Button key={e} variant=\"ghost\" onPress={() => setIcon(e)}><span className=\"text-2xl\">{e}</span></Button>)}</div>} placement=\"below\" label=\"Pick icon\">\n          <button className=\"text-5xl bg-transparent border-none cursor-pointer\">{icon}</button>\n        </Popover>\n        <div><Heading level={1}>Untitled</Heading><Text type=\"supporting\" color=\"secondary\">Start writing...</Text></div>\n      </div>\n    </div>\n  );\n}\n","dd-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState, useMemo} from 'react';\nimport {Table, proportional} from '@astryxdesign/core/Table';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {Badge} from '@astryxdesign/core/Badge';\nimport {Avatar} from '@astryxdesign/core/Avatar';\n\ninterface User extends Record<string, unknown> {\n  id: number; name: string; email: string; role: string; status: 'active' | 'inactive';\n}\n\nconst USERS: User[] = [\n  {id: 1, name: 'Alice Johnson', email: 'alice@example.com', role: 'Admin', status: 'active'},\n  {id: 2, name: 'Bob Smith', email: 'bob@example.com', role: 'Editor', status: 'active'},\n  {id: 3, name: 'Carol White', email: 'carol@example.com', role: 'Viewer', status: 'inactive'},\n  {id: 4, name: 'Dave Brown', email: 'dave@example.com', role: 'Editor', status: 'active'},\n  {id: 5, name: 'Eve Davis', email: 'eve@example.com', role: 'Admin', status: 'active'},\n];\n\nexport default function UsersTable() {\n  const [search, setSearch] = useState('');\n  const filtered = useMemo(() => {\n    const q = search.toLowerCase();\n    return USERS.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));\n  }, [search]);\n\n  return (\n    <div className=\"flex flex-col gap-4\">\n      <div className=\"max-w-xs\">\n        <TextInput label=\"Search\" value={search} onChange={setSearch} placeholder=\"Search...\" hasClearButton />\n      </div>\n      <Table data={filtered} columns={[\n        {key: 'name', header: 'Name', width: proportional(2), renderCell: (r: User) => <div className=\"flex items-center gap-2\"><Avatar name={r.name} size=\"small\" /><span>{r.name}</span></div>},\n        {key: 'email', header: 'Email', width: proportional(2)},\n        {key: 'role', header: 'Role', width: proportional(1)},\n        {key: 'status', header: 'Status', width: proportional(1), renderCell: (r: User) => <Badge variant={r.status === 'active' ? 'positive' : 'neutral'}>{r.status}</Badge>},\n      ]} idKey=\"id\" hasHover />\n    </div>\n  );\n}\n","fwc-4":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\nimport {AlertDialog} from '@astryxdesign/core/AlertDialog';\nimport {Button} from '@astryxdesign/core/Button';\n\nexport default function DeleteConfirmation() {\n  const [isOpen, setIsOpen] = useState(false);\n  return (\n    <div className=\"p-4\">\n      <Button variant=\"destructive\" onPress={() => setIsOpen(true)}>Delete item</Button>\n      <AlertDialog isOpen={isOpen} onOpenChange={setIsOpen} title=\"Delete item\" description=\"Are you sure you want to delete this item? This action cannot be undone.\" actionLabel=\"Delete\" onAction={() => { console.log('deleted'); setIsOpen(false); }} actionVariant=\"destructive\" />\n    </div>\n  );\n}\n","io-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {Button} from '@astryxdesign/core/Button';\nimport {Banner} from '@astryxdesign/core/Banner';\n\nexport default function SubscribeForm() {\n  const [email, setEmail] = useState('');\n  const [status, setStatus] = useState<{type: 'error' | 'success'; message: string} | null>(null);\n  const [isLoading, setIsLoading] = useState(false);\n\n  const handleSubmit = async (e: React.FormEvent) => {\n    e.preventDefault();\n    if (!email || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) { setStatus({type: 'error', message: 'Valid email required'}); return; }\n    setIsLoading(true);\n    try {\n      const res = await fetch('/api/subscribe', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email})});\n      if (!res.ok) {throw new Error('Failed');}\n      setStatus({type: 'success', message: 'Subscribed!'});\n      setEmail('');\n    } catch { setStatus({type: 'error', message: 'Something went wrong.'}); }\n    finally { setIsLoading(false); }\n  };\n\n  return (\n    <form onSubmit={handleSubmit} className=\"flex flex-col gap-4 max-w-sm\">\n      {status && <Banner type={status.type}>{status.message}</Banner>}\n      <TextInput label=\"Email\" type=\"email\" value={email} onChange={setEmail} placeholder=\"you@example.com\" isRequired />\n      <Button type=\"submit\" variant=\"filled\" isLoading={isLoading}>Subscribe</Button>\n    </form>\n  );\n}\n","ps-1":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState} from 'react';\nimport {AppShell} from '@astryxdesign/core/AppShell';\nimport {SideNav} from '@astryxdesign/core/SideNav';\nimport {SideNavHeading} from '@astryxdesign/core/SideNav';\nimport {SideNavSection} from '@astryxdesign/core/SideNav';\nimport {SideNavItem} from '@astryxdesign/core/SideNav';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Card} from '@astryxdesign/core/Card';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {Button} from '@astryxdesign/core/Button';\n\nexport default function SettingsDashboard() {\n  const [section, setSection] = useState('general');\n  return (\n    <AppShell sideNav={\n      <SideNav header={<SideNavHeading heading=\"Settings\" />}>\n ={1}>Welcome</Heading></div>\n    </AppShell>\n  );\n}\n","sd-3":"// Copyright (c) Meta Platforms, Inc. and affiliates.\n\nimport React, {useState, useMemo} from 'react';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {Button} from '@astryxdesign/core/Button';\nimport {Heading} from '@astryxdesign/core/Heading';\n\nexport default function ValidatedForm() {\n  const [name, setName] = useState('');\n  const [email, setEmail] = useState('');\n  const [password, setPassword] = useState('');\n  const [touched, setTouched] = useState<Record<string, boolean>>({});\n\n  const errors = useMemo(() => ({\n    name: !name.trim() ? 'Required' : null,\n    email: !email ? 'Required' : !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email) ? 'Invalid' : null,\n    password: !password ? 'Required' : password.length < 8 ? 'Min 8 chars' : null,\n  }), [name, email, password]);\n\n  const isValid = !errors.name && !errors.email && !errors.password;\n  const mark = (f: string) => setTouched(p => ({...p, [f]: true}));\n\n  return (\n    <form onSubmit={e => { e.preventDefault(); }} className=\"flex flex-col gap-4 max-w-sm p-6\">\n      <Heading level={3}>Create account</Heading>\n      <TextInput label=\"Name\" value={name} onChange={setName} onBlur={() => mark('name')} status={touched.name && errors.name ? {type: 'error', message: errors.name} : undefined} isRequired />\n      <TextInput label=\"Email\" type=\"email\" value={email} onChange={setEmail} onBlur={() => mark('email')} status={touched.email && errors.email ? {type: 'error', message: errors.email} : undefined} isRequired />\n      <TextInput label=\"Password\" type=\"password\" value={password} onChange={setPassword} onBlur={() => mark('password')} status={touched.password && errors.password ? {type: 'error', message: errors.password} : undefined} isRequired />\n      <Button type=\"submit\" variant=\"filled\" isDisabled={!isValid}>Create account</Button>\n    </form>\n  );\n}\n","tc-7":"// Copyright (c) Meta Platfor   :where(*) {
    box-sizing: border-box;
    border: 0 solid;
  }

  :where(html) {
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
    color-scheme: light dark;
    line-height: 1.5;
  }

    font-size: inherit;
    font-weight: inherit;
  }

  :where(h1, h2, h3, h4, h5, h6, p, blockquote, figure, pre, dl, dd) {
    margin: 0;
  }

  :where(a) {
    color: inherit;
    -webkit-text-decoration: inherit;
    text-decoration: inherit;
  }

  :where(b, strong) {
    font-weight: bolder;
  }

  :where(code, kbd, samp, pre) {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace;
    font-size: 1em;
  }

  :where(small) {
    font-size: 80%;
  }

  :where(sub, sup) {
    vertical-align: baseline;
    font-size: 75%;
    line-height: 0;
    position: relative;
  }

  :where(sub) {
    bottom: -.25em;
  }

  :where(sup) {
    top: -.5em;
  }

  :where(ol, ul, menu) {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  :where(img, svg, video, canvas, audio, iframe, embed, object) {
    vertical-align: middle;
    display: block;
  }

  :where(img, video) {
    max-width: 100%;
    height: auto;
  }

  :where([data-astryx-aspect-ratio-override="cover"], [data-astryx-aspect-ratio-override="contain"]) > :where(*) {
    width: 100%;
    height: 100%;
  }

  :where([data-astryx-aspect-ratio-override="cover"]) > :where(img, video) {
    object-fit: cover;
  }

  :where([data-astryx-aspect-ratio-override="contain"]) > :where(img, video) {
    object-fit: contain;
  }

  :where(button, input, optgroup, select, textarea) {
    font: inherit;
    color: inherit;
    margin: 0;
    padding: 0;
  }

  :where(button, [type="button"], [type="reset"], [type="submit"]) {
    appearance: button;
    background-color: #0000;
    background-image: none;
  }

  :where(button, [role="button"]) {
    cursor: pointer;
  }

  :where(:disabled) {
    cursor: default;
  }

  :where(textarea) {
    resize: vertical;
  }

  :where() {
    opacity: 1;
    color: var(--color-text-secondary, #9ca3af);
    -webkit-appearance: none;
  }

  :where(fieldset) {
    margin: 0;
    padding: 0;
  }

  :where(legend) {
    padding: 0;
  }

  :where(table) {
    text-indent: 0;
    border-color: inherit;
    border-collapse: collapse;
  }

  :where(hr) {
    height: 0;
    color: inherit;
    border-top-width: 1px;
  }

  :where(summary) {
    display: list-item;
  }

  :where(dialog) {
    outline: none;
    padding: 0;
  }

  :where([hidden]) {
    display: none;
  }

  :where(html) {
    -webkit-tap-highlight-color: transparent;
  }

  @media (hover: none) and (pointer: coarse) {
    :where(:focus-visible) {
      outline: none;
    }
  }

  :where(html[data-theme="light"]) {
    color-scheme: light;
  }

  :where(html[data-theme="dark"]) {
    color-scheme: dark;
  }

  :where(html:not([data-theme])) {
    color-scheme: light dark;
  }

  :where([data-astryx-media="dark"]) {
    color-scheme: dark;
  }

  :where([data-astryx-media="light"]) {
    color-scheme: light;
  }
}

@layer reset {
  @scope ([data-astryx-theme="neutral"]) to ([data-astryx-theme]) {
    :where(h1, h2, h3, h4, h5, h6) {
      font-family: var(--font-family-heading);
      color: var(--color-text-primary);
    }

    :where(h1) {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-semibold);
      line-height: 1.3333;
    }

    :where(h2) {

      line-height: 1.4;
    }

    :where(h3) {

    :where(h6) {

      line-height: 1.6;
    }

    :where(p) {
      font-family: var(--font-family-body);

      font-weight: var(--font-weight-normal);
      color: var(--color-text-primary);
      line-height: 1.4286;
    }

    :where(small) {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-normal);
      color: var(--color-text-secondary);
      line-height: 1.6667;
    }

    :where(code, pre) {
      font-family: var(--font-family-code);
      font-size: var(--font-size-base);
      line-height: 1.4286;
    }

    :where(hr) {
      border: none;
      border-top: 1px solid var(--color-border);
    }
  }
}
