nual', label: 'Annual (save 20%)'},\n          ]}\n        />\n        <HStack gap={4}>\n          {plans.map((plan) => (\n            <Card key={plan.name} padding={4} width={280}>\n              <VStack gap={3}>\n                <Heading level={3}>{plan.name}</Heading>\n                <HStack gap={0.5} vAlign=\"end\">\n                  <Heading level={2}>\n                    ${billing === 'monthly' ? plan.monthly : plan.annual}\n                  </Heading>\n                  <Text color=\"secondary\">/mo</Text>\n                </HStack>\n                <VStack gap={1}>\n                  {plan.features.map((f) => (\n                    <Text key={f}>{f}</Text>\n                  ))}\n                </VStack>\n                <Button label={`Choose ${plan.name}`} variant=\"primary\" width=\"100%\" />\n              </VStack>\n            </Card>\n          ))}\n        </HStack>\n      </VStack>\n    </div>\n  );\n}\n","dd-1":"import {useState, useMemo} from 'react';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {VStack} from '@astryxdesign/core/VStack';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport * as stylex from '@stylexjs/stylex';\n\nconst styles = stylex.create({\n  table: {\n    width: '100%',\n    borderCollapse: 'collapse',\n  },\n  th: {\n    textAlign: 'start',\n    padding: '12px 16px',\n    borderBottom: '2px solid var(--color-border-default)',\n    cursor: 'pointer',\n    userSelect: 'none',\n  },\n  td: {\n    padding: '12px 16px',\n    borderBottom: '1px solid var(--color-border-default)',\n  },\n});\n\ninterface User {\n  id: number;\n  name: string;\n  email: string;\n  role: string;\n  joined: string;\n}\n\nconst users: User[] = [\n  {id: 1, name: 'Alice Johnson', email: 'alice@example.com', role: 'Admin', joined: '2024-01-15'},\n  {id: 2, name: 'Bob Smith', email: 'bob@example.com', role: 'Editor', joined: '2024-02-20'},\n  {id: 3, name: 'Carol Davis', email: 'carol@example.com', role: 'Viewer', joined: '2024-03-10'},\n  {id: 4, name: 'Dan Wilson', email: 'dan@example.com', role: 'Editor', joined: '2024-04-05'},\n  {id: 5, name: 'Eve Martinez', email: 'eve@example.com', role: 'Admin', joined: '2024-05-12'},\n];\n\ntype SortKey = keyof User;\n\nexport default function UserTable() {\n  const [search, setSearch] = useState('');\n  const [sortKey, setSortKey] = useState<SortKey>('name');\n  const [sortAsc, setSortAsc] = useState(true);\n\n  const handleSort = (key: SortKey) => {\n    if (key === sortKey) {\n      setSortAsc(!sortAsc);\n    } else {\n      setSortKey(key);\n      setSortAsc(true);\n    }\n  };\n\n  const filtered = useMemo(() => {\n    const q = search.toLowerCase();\n    return users\n      .filter((u) => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q))\n      .sort((a, b) => {\n        const aVal = a[sortKey];\n        const bVal = b[sortKey];\n        const cmp = String(aVal).localeCompare(String(bVal));\n        return sortAsc ? cmp : -cmp;\n      });\n  }, [search, sortKey, sortAsc]);\n\n  const arrow = (key: SortKey) => (sortKey === key ? (sortAsc ? ' \\u2191' : ' \\u2193') : '');\n\n  return (\n    <VStack gap={3} padding={4}>\n      <Heading level={2}>Users</Heading>\n      <TextInput\n        label=\"Search users\"\n        isLabelHidden\n        value={search}\n        onChange={setSearch}\n        placeholder=\"Search by name or email...\"\n        size=\"md\"\n      />\n      <table {...stylex.props(styles.table)}>\n        <thead>\n          <tr>\n            <th {...stylex.props(styles.th)} onClick={() => handleSort('name')}>Name{arrow('name')}</th>\n            <th {...stylex.props(styles.th)} onClick={() => handleSort('email')}>Email{arrow('email')}</th>\n            <th {...stylex.props(styles.th)} onClick={() => handleSort('role')}>Role{arrow('role')}</th>\n            <th {...stylex.props(styles.th)} onClick={() => handleSort('joined')}>Joined{arrow('joined')}</th>\n          </tr>\n        </thead>\n        <tbody>\n          {filtered.map((user) => (\n            <tr key={user.id}>\n              <td {...stylex.props(styles.td)}>{user.name}</td>\n              <td {...stylex.props(styles.td)}>{user.email}</td>\n              <td {...stylex.props(styles.td)}>{user.role}</td>\n              <td {...stylex.props(styles.td)}>{user.joined}</td>\n            </tr>\n          ))}\n        </tbody>\n      </table>\n    </VStack>\n  );\n}\n","fwc-12":"import {useState} from 'react';\nimport {Lightbox} from '@astryxdesign/core/Lightbox';\nimport * as stylex from '@stylexjs/stylex';\n\nconst styles = stylex.create({\n  grid: {\n    display: 'grid',\n    gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))',\n    gap: '12px',\n    padding: '16px',\n  },\n  thumbnail: {\n    cursor: 'pointer',\n    borderRadius: '8px',\n    overflow: 'hidden',\n    aspectRatio: '1 / 1',\n  },\n  img: {\n    width: '100%',\n    height: '100%',\n    objectFit: 'cover',\n  },\n});\n\nconst images = [\n  {src: 'https://picsum.photos/800/600?1', alt: 'Mountain landscape', caption: 'Mountain landscape at sunset'},\n  {src: 'https://picsum.photos/800/600?2', alt: 'Ocean waves', caption: 'Ocean waves crashing on shore'},\n  {src: 'https://picsum.photos/800/600?3', alt: 'Forest path', caption: 'A winding path through the forest'},\n  {src: 'https://picsum.photos/800/600?4', alt: 'City skyline', caption: 'City skyline at dusk'},\n  {src: 'https://picsum.photos/800/600?5', alt: 'Desert dunes', caption: 'Rolling sand dunes'},\n  {src: 'https://picsum.photos/800/600?6', alt: 'Snowy peaks', caption: 'Snow-covered mountain peaks'},\n];\n\nexport default function ImageGallery() {\n  const [isOpen, setIsOpen] = useState(false);\n  const [index, setIndex] = useState(0);\n\n  const media = images.map((img) => ({\n    src: img.src,\n    alt: img.alt,\n    caption: img.caption,\n  }));\n\n  return (\n    <>\n      <div {...stylex.props(styles.grid)}>\n        {images.map((img, i) => (\n          <div\n            key={i}\n            {...stylex.props(styles.thumbnail)}\n            onClick={() => {\n              setIndex(i);\n              setIsOpen(true);\n            }}\n            role=\"button\"\n            tabIndex={0}\n            aria-label={`View ${img.alt}`}\n            onKeyDown={(e) => {\n              if (e.key === 'Enter' || e.key === ' ') {\n                setIndex(i);\n                setIsOpen(true);\n              }\n            }}\n          >\n            <img {...stylex.props(styles.img)} src={img.src} alt={img.alt} />\n          </div>\n        ))}\n      </div>\n      <Lightbox\n        isOpen={isOpen}\n        onOpenChange={setIsOpen}\n        media={media}\n        index={index}\n        onIndexChange={setIndex}\n      />\n    </>\n  );\n}\n","io-5":"import {useState} from 'react';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {TextArea} from '@astryxdesign/core/TextArea';\nimport {Selector} from '@astryxdesign/core/Selector';\nimport {Button} from '@astryxdesign/core/Button';\nimport {VStack} from '@astryxdesign/core/VStack';\nimport {HStack} from '@astryxdesign/core/HStack';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\n\nexport default function SupportTicketForm() {\n  const [subject, setSubject] = useState('');\n  const [description, setDescription] = useState('');\n  const [priority, setPriority] = useState('');\n  const [submitted, setSubmitted] = useState(false);\n\n  const handleSubmit = () => {\n    setSubmitted(true);\n  };\n\n  if (submitted) {\n    return (\n      <VStack gap={3} padding={4}>\n        <Heading level={2}>Ticket Submitted</Heading>\n        <Text>Your support ticket has been received. We will get back to you shortly.</Text>\n        <Button label=\"Submit Another\" variant=\"secondary\" onClick={() => {\n          setSubmitted(false);\n          setSubject('');\n          setDescription('');\n          setPriority('');\n        }} />\n      </VStack>\n    );\n  }\n\n  return (\n    <VStack gap={4} padding={4} maxWidth={600}>\n      <Heading level={2}>Submit a Support Ticket</Heading>\n      <TextInput\n        label=\"Subject\"\n        value={subject}\n        onChange={setSubject}\n        placeholder=\"Brief description of your issue\"\n        isRequired\n      />\n      <TextArea\n        label=\"Description\"\n        value={description}\n        onChange={setDescription}\n        placeholder=\"Provide as much detail as possible...\"\n        rows={6}\n        maxLength={2000}\n        isRequired\n      />\n      <Selector\n        label=\"Priority\"\n        value={priority}\n        onChange={setPriority}\n        options={[\n          {value: 'low', label: 'Low'},\n          {value: 'medium', label: 'Medium'},\n          {value: 'high', label: 'High'},\n          {value: 'critical', label: 'Critical'},\n        ]}\n        placeholder=\"Select priority level\"\n        isRequired\n      />\n      <HStack hAlign=\"end\">\n        <Button\n          label=\"Submit Ticket\"\n          variant=\"primary\"\n          onClick={handleSubmit}\n          isDisabled={!subject || !description || !priority}\n        />\n      </HStack>\n    </VStack>\n  );\n}\n","ps-4":"import {Breadcrumbs, BreadcrumbItem} from '@astryxdesign/core/Breadcrumbs';\nimport {Card} from '@astryxdesign/core/Card';\nimport {Button} from '@astryxdesign/core/Button';\nimport {VStack} from '@astryxdesign/core/VStack';\nimport {HStack} from '@astryxdesign/core/HStack';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\nimport * as stylex from '@stylexjs/stylex';\n\nconst styles = stylex.create({\n  container: {\n    padding: '24px',\n    maxWidth: '1000px',\n    margin: '0 auto',\n  },\n  image: {\n    width: '100%',\n    height: '400px',\n    objectFit: 'cover',\n    borderRadius: '8px',\n  },\n});\n\nexport default function ProductDetailPage() {\n  return (\n    <div {...stylex.props(styles x',\n    gap: '16px',\n    '@media (max-width: 768px)': {\n      display: 'none',\n    },\n  },\n  hamburger: {\n    display: 'none',\n    '@media (max-width: 768px)': {\n      display: 'block',\n    },\n  },\n  mobileMenu: {\n    padding: '16px',\n    borderBottom: '1px solid var(--color-border-default)',\n  },\n  link: {\n    cursor: 'pointer',\n    padding: '8px 12px',\n  },\n});\n\nconst navItems = ['Home', 'Products', 'About', 'Contact'];\n\nexport default function ResponsiveNav() {\n  const [isMenuOpen, setIsMenuOpen] = useState(false);\n\n  return (\n    <VStack>\n      <div {...stylex.props(styles.nav)}>\n        <HStack hAlign=\"between\" vAlign=\"center\">\n          <Heading level={4}>MyBrand</Heading>\n          <div {...stylex.props(styles.links)}>\n            {navItems.map((item) => (\n              <Text key={item}><a href={`#${item.toLowerCase()}`}>{item}</a></Text>\n            ))}\n          </div>\n          <div {...stylex.props(styles.hamburger)}>\n            <Button\n              label={isMenuOpen ? 'Close menu' : 'Open menu'}\n              variant=\"ghost\"\n              isIconOnly\n              onClick={() => setIsMenuOpen(!isMenuOpen)}\n              icon={<span>{isMenuOpen ? '\\u2715' : '\\u2630'}</span>}\n            />\n          </div>\n        </HStack>\n      </div>\n      {isMenuOpen && (\n        <div {...stylex.props(styles.mobileMenu)}>\n          <VStack gap={1}>\n            {navItems.map((item) => (\n              <div key={item} {...stylex.props(styles.link)}>\n                <Text><a href={`#${item.toLowerCase()}`}>{item}</a></Text>\n              </div>\n            ))}\n          </VStack>\n        </div>\n      )}\n    </VStack>\n  );\n}\n","sd-4":"import {useState} from 'react';\nimport {CheckboxInput} from '@astryxdesign/core/CheckboxInput';\nimport {Button} from '@astryxdesign/core/Button';\nimport {TextArea} from '@astryxdesign/core/TextArea';\nimport {VStack} from '@astryxdesign/core/VStack';\nimport {Heading} f @astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\nimport {Button} from '@astryxdesign/core/Button';\nimport {defineTheme} from '@astryxdesign/core/theme';\n\nconst darkSidebarTheme = defineTheme({\n  mode: 'dark',\n  tokens: {\n    '--color-accent': '#6366f1',\n  },\n});\n\nconst lightContentTheme = defineTheme({\n  mode: 'light',\n  tokens: {\n    '--color-accent': '#6366f1',\n  },\n});\n\nexport default function DualThemeLayout() {\n  return (\n    <Layout height=\"fill\">\n      <Theme theme={darkSidebarTheme} mode=\"dark\">\n        <LayoutPanel width={260} hasDivider>\n          <VStack gap={3} padding={4}>\n            <Heading level={4}>Navigation</Heading>\n            <VStack gap={1}>\n              <Button label=\"Dashboard\" variant=\"ghost\" width=\"100%\" />\n              <Button label=\"Projects\" variant=\"ghost\" width=\"100%\" />\n              <Button label=\"Settings\" variant=\"ghost\" width=\"100%\" />\n              <Button label=\"Help\" variant=\"ghost\" width=\"100%\" />\n            </VStack>\n          </VStack>\n        </LayoutPanel>\n      </Theme>\n      <Theme theme={lightContentTheme} mode=\"light\">\n        <LayoutContent padding={6}>\n          <VStack gap={4}>\n            <Heading level={1}>Dashboard</Heading>\n            <Text>This content area uses a light theme while the sidebar uses a dark theme.</Text>\n            <Text color=\"secondary\">\n              Each section of the app can have its own theme without affecting the rest.\n            </Text>\n          </VStack>\n        </LayoutContent>\n      </Theme>\n    </Layout>\n  );\n}\n","ty-1":"import {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\nimport {VStack} from '@astryxdesign/core/VStack';\n\nexport default function PageHeader() {\n  return (\n    <VStack gap={2} padding={4}>\n      <Heading level={1}>Welcome to Our Platform</Heading>\n      <Text type=\"large\" color=\"secondary\">\n        Build beautiful, accessible interfaces with a comprehensive design system\n        that scales from small projects to enterprise applications.\n      </Text>\n    </VStack>\n  );\n}\n","wd-5":"import {useState} from 'react';\nimport {Dialog} from '@astryxdesign/core/Dialog';\nimport {DialogHeader} from '@astryxdesign/core/DialogHeader';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {TextArea} from '@astryxdesign/core/TextArea';\nimport {Button} from '@astryxdesign/core/Button';\nimport {VStack} from '@astryxdesign/core/VStack';\nimport {HStack} from '@astryxdesign/core/HStack';\n\nexport default function FeedbackForm() {\n  const [isOpen, setIsOpen] = useState(false);\n  const [title, setTitle] = useState('');\n  const [description, setDescription] = useState('');\n\n  const handleSubmit = () => {\n    setIsOpen(false);\n    setTitle('');\n    setDescription('');\n  };\n\n  return (\n    <>\n      <Button label=\"Give Feedback\" variant=\"primary\" onClick={() => setIsOpen(true)} />\n      <Dialog isOpen={isOpen} onOpenChange={setIsOpen} purpose=\"form\">\n        <DialogHeader title=\"Send Feedback\" />\n        <VStack gap={3} padding={4}>\n          <TextInput\n            label=\"Title\"\n            value={title}\n            onChange={setTitle}\n            placeholder=\"Brief summary\"\n            isRequired\n          />\n          <TextArea\n            label=\"Description\"\n            value={description}\n            onChange={setDescription}\n            placeholder=\"Tell us more about your experience...\"\n            rows={5}\n          />\n          <HStack gap={2} hAlign=\"end\">\n            <Button label=\"Cancel\" variant=\"ghost\" onClick={() => setIsOpen(false)} />\n            <Button label=\"Submit\" variant=\"primary\" onClick={handleSubmit} />\n          </HStack>\n        </VStack>\n      </Dialog>\n    </>\n  );\n}\n"},"baselineSourceCode":{"cwm-1":"import {useState} from 'react';\nimport {Button} from '@/components/ "text-muted-foreground\">/mo</span>\n                </div>\n                <ul className=\"flex flex-col gap-2\">\n                  {plan.features.map((f) => <li key={f}>{f}</li>)}\n                </ul>\n                <Button className=\"w-full\">Choose {plan.name}</Button>\n              </CardContent>\n            </Card>\n          ))}\n        </div>\n      </div>\n    </div>\n  );\n}\n","dd-1":"import {useState, useMemo} from 'react';\nimport {Input} from '@/components/ui/input';\n\ninterface User { id: number; name: string; email: string; role: string; joined: string; }\n\nconst users: User[] = [\n  {id: 1, name: 'Alice Johnson', email: 'alice@example.com', role: 'Admin', joined: '2024-01-15'},\n  {id: 2, name: 'Bob Smith', email: 'bob@example.com', role: 'Editor', joined: '2024-02-20'},\n  {id: 3, name: 'Carol Davis', email: 'carol@example.com', role: 'Viewer', joined: '2024-03-10'},\n  {id: 4, name: 'Dan Wilson', email: 'dan@example.com', role: 'Editor', joined: '2024-04-05'},\n  {id: 5, name: 'Eve Martinez', email: 'eve@example.com', role: 'Admin', joined: '2024-05-12'},\n];\n\ntype SortKey = keyof User;\n\nexport default function UserTable() {\n  const [search, setSearch] = useState('');\n  const [sortKey, setSortKey] = useState<SortKey>('name');\n  const [sortAsc, setSortAsc] = useState(true);\n\n  const handleSort = (key: SortKey) => {\n    if (key === sortKey) setSortAsc(!sortAsc);\n    else { setSortKey(key); setSortAsc(true); }\n  };\n\n  const filtered = useMemo(() => {\n    const q = search.toLowerCase();\n    return users\n      .filter((u) => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q))\n      .sort((a, b) => { const cmp = String(a[sortKey]).localeCompare(String(b[sortKey])); return sortAsc ? cmp : -cmp; });\n  }, [search, sortKey, sortAsc]);\n\n  const arrow = (key: SortKey) => (sortKey === key ? (sortAsc ? ' \\u2191' : ' \\u2193') : '');\n\n  return (\n    <div className=\"flex flex-col gap-4 p-6\">\n      <h2 className=\"text-2xl font-bold\">Users</h2>\n      <Input value={search} onChange={(e) => setSearch(e.target.value)} placeholder=\"Search by name or email...\" />\n      <table className=\"w-full border-collapse\">\n        <thead>\n          <tr>\n            <th className=\"text-left p-3 border-b-2 cursor-pointer select-none\" onClick={() => handleSort('name')}>Name{arrow('name')}</th>\n            <th className=\"text-left p-3 border-b-2 cursor-pointer select-none\" onClick={() => handleSort('email')}>Email{arrow('email')}</th>\n            <th className=\"text-left p-3 border-b-2 cursor-pointer select-none\" onClick={() => handleSort('role')}>Role{arrow('role')}</th>\n            <th className=\"text-left p-3 border-b-2 cursor-pointer select-none\" onClick={() => handleSort('joined')}>Joined{arrow('joined')}</th>\n          </tr>\n        </thead>\n        <tbody>\n          {filtered.map((user) => (\n            <tr key={user.id}>\n              <td className=\"p-3 border-b\">{user.name}</td>\n              <td className=\"p-3 border-b\">{user.email}</td>\n              <td className=\"p-3 border-b\">{user.role}</td>\n              <td className=\"p-3 border-b\">{user.joined}</td>\n            </tr>\n          ))}\n        </tbody>\n      </table>\n    </div>\n  );\n}\n","fwc-12":"import {useState} from 'react';\nimport {Dialog, DialogContent} from '@/components/ui/dialog';\nimport {Button} from '@/components/ui/button';\n\nconst images = [\n  {src: 'https://picsum.photos/800/600?1', alt: 'Mountain landscape', caption: 'Mountain landscape at sunset'},\n  {src: 'https://picsum.photos/800/600?2', alt: 'Ocean waves', caption: 'Ocean waves crashing on shore'},\n  {src: 'https://picsum.photos/800/600?3', alt: 'Forest path', caption: 'A winding path through the forest'},\n  {src: 'https://picsum.photos/800/600?4', alt: 'City skyline', caption: 'City skyline at dusk'},\n  {src: 'https://picsum.photos/800/600?5', alt: 'Desert dunes', caption: 'Rolling sand dunes'},\n  {sr e('');\n  const [priority, setPriority] = useState('');\n  const [submitted, setSubmitted] = useState(false);\n\n  if (submitted) {\n    return (\n      <div className=\"flex flex-col gap-4 p-6\">\n        <h2 className=\"text-2xl font-bold\">Ticket Submitted</h2>\n        <p>Your support ticket has been received.</p>\n        <Button variant=\"secondary\" onClick={() => { setSubmitted(false); setSubject(''); setDescription(''); setPriority(''); }}>Submit Another</Button>\n      </div>\n    );\n  }\n\n  return (\n    <div className=\"flex flex-col gap-4 p-6 max-w-xl\">\n      <h2 className=\"text-2xl font-bold\">Submit a Support Ticket</h2>\n      <div className=\"flex flex-col gap-2\">\n        <Label htmlFor=\"subject\">Subject *</Label>\n        <Input id=\"subject\" value={subject} onChange={(e) => setSubject(e.target.value)} placeholder=\"Brief description of your issue\" />\n      </div>\n      <div className=\"flex flex-col gap-2\">\n        <Label htmlFor=\"desc\">Description *</Label>\n        <Textarea id=\"desc\" value={description} onChange={(e) => setDescription(e.target.value)} placeholder=\"Provide as much detail as possible...\" rows={6} maxLength={2000} />\n        <span className=\"text-xs text-muted-foreground text-right\">{description.length}/2000</span>\n      </div>\n      <div className=\"flex flex-col gap-2\">\n        <Label>Priority *</Label>\n        <Select value={priority} onValueChange={setPriority}>\n          <SelectTrigger><SelectValue placeholder=\"Select priority level\" /></SelectTrigger>\n          <SelectContent>\n            <SelectItem value=\"low\">Low</SelectItem>\n            <SelectItem value=\"medium\">Medium</SelectItem>\n            <SelectItem value=\"high\">High</SelectItem>\n            <SelectItem value=\"critical\">Critical</SelectItem>\n          </SelectContent>\n        </Select>\n      </div>\n      <div className=\"flex justify-end\">\n        <Button onClick={() => setSubmitted(true)} disabled={!subject || !description || !priority}>Submit Ticket</Button>\n      </div>\n    </div>\n  );\n}\n","ps-4":"import {Button} from '@/components/ui/button';\nimport {Card, CardContent} from '@/components/ui/card';\n\nexport default function ProductDetailPage() {\n  return (\n    <div className=\"p-6 max-w-4xl mx-auto flex flex-col gap-4\">\n      <nav className=\"flex items-center gap-1 text-sm text-muted-foreground\">\n        <a href=\"/\" className=\"hover:underline\">Home</a><span>/</span>\n        <a href=\"/electronics\" className=\"hover:underline\">Electronics</a><span>/</span>\n        <a href=\"/electronics/headphones\" className=\"hover:underline\">Headphones</a><span>/</span>\n        <span className=\"text-foreground\">Studio Pro Max</span>\n      </nav>\n      <div className=\"flex gap-6\">\n        <img className=\"w-1/2 h-96 object-cover rounded-lg\" src=\"https://picsum.photos/600/400\" alt=\"Studio Pro Max Headphones\" />\n        <div className=\"flex flex-col gap-3\">\n          <h1 className=\"text-3xl font-bold\">Studio Pro Max</h1>\n          <p className=\"text-muted-foreground\">Premium wireless headphones with active noise cancellation</p>\n          <span className=\"text-2xl font-bold\">$349.99</span>\n          <Card>\n            <CardContent className=\"flex flex-col gap-2 p-4\">\n              <span className=\"font-semibold\">Key Features</span>\n              <span>Active Noise Cancellation</span>\n              <span>40-hour battery life</span>\n              <span>Spatial Audio support</span>\n              <span>Premium memory foam cushions</span>\n            </CardContent>\n          </Card>\n          <div className=\"flex gap-2\">\n            <Button>Add to Cart</Button>\n            <Button variant=\"secondary\">Save for Later</Button>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}\n","rc-1":"import {useState} from 'react';\nimport {Button} from '@/components/ui/button';\n\nconst navItems = ['Home', 'Products', 'About kedChange={(v) => setAccepted(!!v)} />\n        <Label htmlFor=\"terms\">I have read and agree to the Terms and Conditions</Label>\n      </div>\n      <Button disabled={!accepted} onClick={() => alert('Accepted!')}>Continue</Button>\n    </div>\n  );\n}\n","tc-7":"export default function DualThemeLayout() {\n  return (\n    <div className=\"flex h-screen\">\n      <aside className=\"w-64 bg-gray-900 text-white p-4 flex flex-col gap-4\">\n        <h4 className=\"font-semibold text-lg\">Navigation</h4>\n        <nav className=\"flex flex-col gap-1\">\n          <a href=\"#\" className=\"px-3 py-2 rounded hover:bg-gray-800\">Dashboard</a>\n          <a href=\"#\" className=\"px-3 py-2 rounded hover:bg-gray-800\">Projects</a>\n          <a href=\"#\" className=\"px-3 py-2 rounded hover:bg-gray-800\">Settings</a>\n          <a href=\"#\" className=\"px-3 py-2 rounded hover:bg-gray-800\">Help</a>\n        </nav>\n      </aside>\n      <main className=\"flex-1 p-8 bg-white\">\n        <div className=\"flex flex-col gap-4\">\n          <h1 className=\"text-3xl font-bold\">Dashboard</h1>\n          <p>This content area uses a light theme while the sidebar uses a dark theme.</p>\n          <p className=\"text-muted-foreground\">Each section can have its own theme without affecting the rest.</p>\n        </div>\n      </main>\n    </div>\n  );\n}\n","ty-1":"export default function PageHeader() {\n  return (\n    <div className=\"flex flex-col gap-2 p-6\">\n      <h1 className=\"text-4xl font-bold tracking-tight\">Welcome to Our Platform</h1>\n      <p className=\"text-lg text-muted-foreground\">\n        Build beautiful, accessible interfaces with a comprehensive design system\n        that scales from small projects to enterprise applications.\n      </p>\n    </div>\n  );\n}\n","wd-5":"import {useState} from 'react';\nimport {Dialog, DialogContent, DialogHeader, DialogTitle, DialogFooter} from '@/components/ui/dialog';\nimport {Button} from '@/components/ui/button';\nimport ng', '1TB storage', '24/7 support', 'Custom integrations', 'SLA']},\n];\n\nexport default function PricingTable() {\n  const [billing, setBilling] = useState<'monthly' | 'annual'>('monthly');\n\n  return (\n    <div style={{padding: 32, maxWidth: 900, margin: '0 auto'}}>\n      <div style={{display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24}}>\n        <div style={{textAlign: 'center'}}>\n          <h2 style={{fontSize: 28, fontWeight: 'bold', margin: 0}}>Choose your plan</h2>\n          <p style={{color: '#666'}}>Start free, upgrade when you need more.</p>\n        </div>\n        <div style={{display: 'inline-flex', border: '1px solid #ddd', borderRadius: 8, padding: 4}}>\n          <button onClick={() => setBilling('monthly')} style={{padding: '8px 16px', borderRadius: 6, border: 'none', cursor: 'pointer', background: billing === 'monthly' ? '#0066cc' : 'transparent', color: billing === 'monthly' ? 'white' : '#333'}}>Monthly</button>\n          <button onClick={() => setBilling('annual')} style={{padding: '8px 16px', borderRadius: 6, border: 'none', cursor: 'pointer', background: billing === 'annual' ? '#0066cc' : 'transparent', color: billing === 'annual' ? 'white' : '#333'}}>Annual (save 20%)</button>\n        </div>\n        <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16}}>\n          {plans.map((plan) => (\n            <div key={plan.name} style={{border: '1px solid #ddd', borderRadius: 12, padding: 24}}>\n              <h3 style={{margin: '0 0 8px'}}>{plan.name}</h3>\n              <div style={{display: 'flex', alignItems: 'baseline', gap: 4, marginBottom: 16}}>\n                <span style={{fontSize: 32, fontWeight: 'bold'}}>${billing === 'monthly' ? plan.monthly : plan.annual}</span>\n                <span style={{color: '#666'}}>/mo</span>\n              </div>\n              <ul style={{listStyle: 'none', padding: 0, margin: '0 0 16px', display: 'flex', flexDirection: 'column', gap: 8}}>\n arch(e.target.value)} placeholder=\"Search by name or email...\" style={{padding: 10, border: '1px solid #ccc', borderRadius: 6, width: '100%'}} />\n      <table style={{width: '100%', borderCollapse: 'collapse'}}>\n        <thead>\n          <tr>\n            <th style={{textAlign: 'left', padding: 12, borderBottom: '2px solid #ddd', cursor: 'pointer'}} onClick={() => handleSort('name')}>Name{arrow('name')}</th>\n            <th style={{textAlign: 'left', padding: 12, borderBottom: '2px solid #ddd', cursor: 'pointer'}} onClick={() => handleSort('email')}>Email{arrow('email')}</th>\n            <th style={{textAlign: 'left', padding: 12, borderBottom: '2px solid #ddd', cursor: 'pointer'}} onClick={() => handleSort('role')}>Role{arrow('role')}</th>\n            <th style={{textAlign: 'left', padding: 12, borderBottom: '2px solid #ddd', cursor: 'pointer'}} onClick={() => handleSort('joined')}>Joined{arrow('joined')}</th>\n          </tr>\n        </thead>\n        <tbody>\n          {filtered.map((user) => (\n            <tr key={user.id}>\n              <td style={{padding: 12, borderBottom: '1px solid #eee'}}>{user.name}</td>\n              <td style={{padding: 12, borderBottom: '1px solid #eee'}}>{user.email}</td>\n              <td style={{padding: 12, borderBottom: '1px solid #eee'}}>{user.role}</td>\n              <td style={{padding: 12, borderBottom: '1px solid #eee'}}>{user.joined}</td>\n            </tr>\n          ))}\n        </tbody>\n      </table>\n    </div>\n  );\n}\n","fwc-12":"import {useState} from 'react';\n\nconst images = [\n  {src: 'https://picsum.photos/800/600?1', alt: 'Mountain landscape', caption: 'Mountain landscape at sunset'},\n  {src: 'https://picsum.photos/800/600?2', alt: 'Ocean waves', caption: 'Ocean waves crashing on shore'},\n  {src: 'https://picsum.photos/800/600?3', alt: 'Forest path', caption: 'A winding path through the forest'},\n  {src: 'https://picsum.photos/800/600?4', alt: 'City skyline', caption: 'City skyline at dusk'}, );\n\n  if (submitted) {\n    return (\n      <div style={{display: 'flex', flexDirection: 'column', gap: 16, padding: 24}}>\n        <h2 style={{margin: 0}}>Ticket Submitted</h2>\n        <p>Your support ticket has been received.</p>\n        <button onClick={() => { setSubmitted(false); setSubject(''); setDescription(''); setPriority(''); }} style={{padding: '8px 16px', border: '1px solid #ccc', borderRadius: 6, cursor: 'pointer', background: 'white'}}>Submit Another</button>\n      </div>\n    );\n  }\n\n  return (\n    <div style={{display: 'flex', flexDirection: 'column', gap: 16, padding: 24, maxWidth: 560}}>\n      <h2 style={{margin: 0}}>Submit a Support Ticket</h2>\n      <label style={{display: 'flex', flexDirection: 'column', gap: 4}}>\n        Subject *\n        <input value={subject} onChange={(e) => setSubject(e.target.value)} placeholder=\"Brief description of your issue\" style={{padding: 10, border: '1px solid #ccc', borderRadius: 6}} />\n      </label>\n      <label style={{display: 'flex', flexDirection: 'column', gap: 4}}>\n        Description *\n        <textarea value={description} onChange={(e) => setDescription(e.target.value)} placeholder=\"Provide as much detail as possible...\" rows={6} maxLength={2000} style={{padding: 10, border: '1px solid #ccc', borderRadius: 6, resize: 'vertical'}} />\n        <span style={{fontSize: 12, color: '#666', alignSelf: 'flex-end'}}>{description.length}/2000</span>\n      </label>\n      <label style={{display: 'flex', flexDirection: 'column', gap: 4}}>\n        Priority *\n        <select value={priority} onChange={(e) => setPriority(e.target.value)} style={{padding: 10, border: '1px solid #ccc', borderRadius: 6}}>\n          <option value=\"\">Select priority level</option>\n          <option value=\"low\">Low</option>\n          <option value=\"medium\">Medium</option>\n          <option value=\"high\">High</option>\n          <option value=\"critical\">Critical</option>\n        </select>\n      </label>\n      <div style={{display: 'flex', justifyContent: 'flex-end'}}>\n        <button onClick={() => setSubmitted(true)} disabled={!subject || !description || !priority} style={{padding: '10px 20px', background: (!subject || !description || !priority) ? '#ccc' : '#0066cc', color: 'white', border: 'none', borderRadius: 6, cursor: (!subject || !description || !priority) ? 'not-allowed' : 'pointer'}}>Submit Ticket</button>\n      </div>\n    </div>\n  );\n}\n","ps-4":"export default function ProductDetailPage() {\n  return (\n    <div style={{padding: 24, maxWidth: 900, margin: '0 auto'}}>\n      <nav style={{display: 'flex', gap: 4, fontSize: 14, color: '#666', marginBottom: 16}}>\n        <a href=\"/\">Home</a><span>/</span>\n        <a href=\"/electronics\">Electronics</a><span>/</span>\n        <a href=\"/electronics/headphones\">Headphones</a><span>/</span>\n        <span style={{color: '#333'}}>Studio Pro Max</span>\n      </nav>\n      <div style={{display: 'flex', gap: 24}}>\n        <img src=\"https://picsum.photos/600/400\" alt=\"Studio Pro Max Headphones\" style={{width: '50%', height: 400, objectFit: 'cover', borderRadius: 8}} />\n        <div style={{display: 'flex', flexDirection: 'column', gap: 12}}>\n          <h1 style={{margin: 0}}>Studio Pro Max</h1>\n          <p style={{color: '#666', margin: 0}}>Premium wireless headphones with active noise cancellation</p>\n          <span style={{fontSize: 28, fontWeight: 'bold'}}>$349.99</span>\n          <div style={{background: '#f5f5f5', borderRadius: 8, padding: 16, display: 'flex', flexDirection: 'column', gap: 8}}>\n            <span style={{fontWeight: 600}}>Key Features</span>\n            <span>Active Noise Cancellation</span>\n            <span>40-hour battery life</span>\n            <span>Spatial Audio support</span>\n            <span>Premium memory foam cushions</span>\n          </div>\n          <div style={{display: 'flex', gap: 8}}>\n            <button style={{padding: '10px 20px', background:        <a href=\"#\" style={{padding: '8px 12px', borderRadius: 6, color: '#fff', textDecoration: 'none'}}>Help</a>\n        </nav>\n      </aside>\n      <main style={{flex: 1, padding: 32, background: '#fff'}}>\n        <div style={{display: 'flex', flexDirection: 'column', gap: 16}}>\n          <h1 style={{margin: 0}}>Dashboard</h1>\n          <p>This content area uses a light theme while the sidebar uses a dark theme.</p>\n          <p style={{color: '#666'}}>Each section can have its own theme without affecting the rest.</p>\n        </div>\n      </main>\n    </div>\n  );\n}\n","ty-1":"export default function PageHeader() {\n  return (\n    <div style={{display: 'flex', flexDirection: 'column', gap: 8, padding: 24}}>\n      <h1 style={{margin: 0, fontSize: 36, fontWeight: 'bold'}}>Welcome to Our Platform</h1>\n      <p style={{margin: 0, fontSize: 18, color: '#666'}}>\n        Build beautiful, accessible interfaces with a comprehensive design system\n        that scales from small projects to enterprise applications.\n      </p>\n    </div>\n  );\n}\n","wd-5":"import {useState} from 'react';\n\nexport default function FeedbackForm() {\n  const [isOpen, setIsOpen] = useState(false);\n  const [title, setTitle] = useState('');\n  const [description, setDescription] = useState('');\n\n  return (\n    <>\n      <button onClick={() => setIsOpen(true)} style={{padding: '8px 16px', background: '#0066cc', color: 'white', border: 'none', borderRadius: 6, cursor: 'pointer'}}>Give Feedback</button>\n      {isOpen && (\n        <div style={{position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000}} role=\"dialog\" aria-label=\"Feedback form\">\n          <div style={{background: 'white', borderRadius: 12, padding: 24, width: 400, maxWidth: '90vw'}}>\n            <h2 style={{margin: '0 0 16px'}}>Send Feedback</h2>\n            <div style={{display: 'flex', flexDirection: 'column', gap: 12}}>\n              <label>\n                Title\n                <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder=\"Brief summary\" style={{display: 'block', width: '100%', padding: 8, border: '1px solid #ccc', borderRadius: 4, marginTop: 4}} />\n              </label>\n              <label>\n                Description\n                <textarea value={description} onChange={(e) => setDescription(e.target.value)} placeholder=\"Tell us more...\" rows={5} style={{display: 'block', width: '100%', padding: 8, border: '1px solid #ccc', borderRadius: 4, marginTop: 4, resize: 'vertical'}} />\n              </label>\n              <div style={{display: 'flex', gap: 8, justifyContent: 'flex-end'}}>\n                <button onClick={() => setIsOpen(false)} style={{padding: '8px 16px', background: 'transparent', border: '1px solid #ccc', borderRadius: 6, cursor: 'pointer'}}>Cancel</button>\n                <button onClick={() => { setIsOpen(false); setTitle(''); setDescription(''); }} style={{padding: '8px 16px', background: '#0066cc', color: 'white', border: 'none', borderRadius: 6, cursor: 'pointer'}}>Submit</button>\n              </div>\n            </div>\n          </div>\n        </div>\n      )}\n    </>\n  );\n}\n"},"astryxTailwindSourceCode":{"cwm-1":"import {useState} from 'react';\nimport {Card} from '@astryxdesign/core/Card';\nimport {Button} from '@astryxdesign/core/Button';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\nimport {SegmentedControl} from '@astryxdesign/core/SegmentedControl';\n\nconst plans = [\n  {name: 'Starter', monthly: 12, annual: 10, features: ['5 projects', '10GB storage', 'Email support']},\n  {name: 'Pro', monthly: 29, annual: 24, features: ['Unlimited projects', '100GB storage', 'Priority support', 'API access']},\n  {name: 'Enterprise', monthly: 79, annual: 66, features: ['Unlimited everything', '1TB storage', '24/7 support', 'Custom integrations', 'SLA']},\n];\n\nexport default function PricingTable() {\n  const [billing, setBilling] = useState('monthly');\n\n  return (\n    <div className=\"p-8 max-w-4xl mx-auto\">\n      <div className=\"flex flex-col items-center gap-6\">\n        <div className=\"text-center\">\n          <Heading level={2}>Choose your plan</Heading>\n          <Text color=\"secondary\">Start free, upgrade when you need more.</Text>\n        </div>\n        <SegmentedControl\n          value={billing}\n          onChange={setBilling}\n          options={[\n            {value: 'monthly', label: 'Monthly'},\n            {value: 'annual', label: 'Annual (save 20%)'},\n          ]}\n        />\n        <div className=\"flex gap-4\">\n          {plans.map((plan) => (\n            <Card key={plan.name} padding={4} width={280}>\n              <div className=\"flex flex-col gap-3\">\n                <Heading level={3}>{plan.name}</Heading>\n                <div className=\"flex items-end gap-1\">\n                  <Heading level={2}>\n                    ${billing === 'monthly' ? plan.monthly : plan.annual}\n                  </Heading>\n                  <Text color=\"secondary\">/mo</Text>\n                </div>\n                <div className=\"flex flex-col gap-1\">\n                  {plan.features.map((f) => (\n                    <Text key={f}>{f}</Text>\n                  ))}\n                </div>\n                <Button label={`Choose ${plan.name}`} variant=\"primary\" width=\"100%\" />\n              </div>\n            </Card>\n          ))}\n        </div>\n      </div>\n    </div>\n  );\n}\n","dd-1":"import {useState, useMemo} from 'react';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {Heading} from '@astryxdesign/core/Heading';\n\ninterface User {\n  id: number;\n  name: string;\n  email: string;\n  role: string;\n  joined: string;\n}\n\nconst users: User[] = [\n  {id: 1, name: 'Alice Johnson', email: 'alice@example.com', role: 'Admin', joined: '2024-01-15'},\n  {id: 2, name: 'Bob Smith', email: 'bob@example.com', role: 'Editor', joined: '2024-02-20'},\n  {id: 3, name: 'Carol Davis', email: 'carol@example.com', role: 'Viewer', joined: '2024-03-10'},\n  {id: 4, name: 'Dan Wilson', email: 'dan@example.com', role: 'Editor', joined: '2024-04-05'},\n  {id: 5, name: 'Eve Martinez', email: 'eve@example.com', role: 'Admin', joined: '2024-05-12'},\n];\n\ntype SortKey = keyof User;\n\nexport default function UserTable() {\n  const [search, setSearch] = useState('');\n  const [sortKey, setSortKey] = useState<SortKey>('name');\n  const [sortAsc, setSortAsc] = useState(true);\n\n  const handleSort = (key: SortKey) => {\n    if (key === sortKey) setSortAsc(!sortAsc);\n    else { setSortKey(key); setSortAsc(true); }\n  };\n\n  const filtered = useMemo(() => {\n    const q = search.toLowerCase();\n    return users\n      .filter((u) => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q))\n      .sort((a, b) => {\n        const cmp = String(a[sortKey]).localeCompare(String(b[sortKey]));\n        return sortAsc ? cmp : -cmp;\n      });\n  }, [search, sortKey, sortAsc]);\n\n  const arrow = (key: SortKey) => (sortKey === key ? (sortAsc ? ' \\u2191' : ' \\u2193') : '');\n\n  return (\n    <div className=\"flex flex-col gap-4 p-6\">\n      <Heading level={2}>Users</Heading>\n      <TextInput\n        label=\"Search users\"\n        isLabelHidden\n        value={search}\n        onChange={setSearch}\n        placeholder=\"Search by name or email...\"\n      />\n      <table className=\"w-full border-collapse\">\n        <thead>\n          <tr>\n            <th className=\"text-left p-3 border-b-2 cursor-pointer select-none\" onClick={() => handleSort('name')}>Name{arrow('name')}</th>\n            <th className=\"text-left p-3 border-b-2 cursor-pointer select-none\" onClick={() => handleSort('email')}>Email{arrow('email')}</th>\n            <th className=\"text-left p-3 border-b-2 cursor-pointer select-none\" onClick={() => handleSort('role')}>Role{arrow('role')}</th>\n            <th className=\"text-left p-3 border-b-2 cursor-pointer select-none\" onClick={() => handleSort('joined')}>Joined{arrow('joined')}</th>\n          </tr>\n        </thead>\n        <tbody>\n          {filtered.map((user) => (\n            <tr key={user.id}>\n              <td className=\"p-3 border-b\">{user.name}</td>\n              <td className=\"p-3 border-b\">{user.email}</td>\n              <td className=\"p-3 border-b\">{user.role}</td>\n              <td className=\"p-3 border-b\">{user.joined}</td>\n            </tr>\n          ))}\n        </tbody>\n      </table>\n    </div>\n  );\n}\n","fwc-12":"import {useState} from 'react';\nimport {Lightbox} from '@astryxdesign/core/Lightbox';\n\nconst images = [\n  {src: 'https://picsum.photos/800/600?1', alt: 'Mountain landscape', caption: 'Mountain landscape at sunset'},\n  {src: 'https://picsum.photos/800/600?2', alt: 'Ocean waves', caption: 'Ocean waves crashing on shore'},\n  {src: 'https://picsum.photos/800/600?3', alt: 'Forest path', caption: 'A winding path through the forest'},\n  {src: 'https://picsum.photos/800/600?4', alt: 'City skyline', caption: 'City skyline at dusk'},\n  {src: 'https://picsum.photos/800/600?5', alt: 'Desert dunes', caption: 'Rolling sand dunes'},\n  {src: 'https://picsum.photos/800/600?6', alt: 'Snowy peaks', caption: 'Snow-covered mountain peaks'},\n];\n\nexport default function ImageGallery() {\n  const [isOpen, setIsOpen] = useState(false);\n  const [index, setIndex] = useState(0);\n\n  const media = images.map((img) => ({\n    src: img.src,\n    alt: img.alt,\n    caption: img.caption,\n  }));\n\n  return (\n    <>\n      <div className=\"grid grid-cols-[repeat(auto-fill,minmax(150px,1fr))] gap-3 p-4\">\n        {images.map((img, i) => (\n          <div\n            key={i}\n            className=\"cursor-pointer rounded-lg overflow-hidden aspect-square\"\n            onClick={() => { setIndex(i); setIsOpen(true); }}\n            role=\"button\"\n            tabIndex={0}\n            aria-label={`View ${img.alt}`}\n            onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { setIndex(i); setIsOpen(true); }}}\n          >\n            <img className=\"w-full h-full object-cover\" src={img.src} alt={img.alt} />\n          </div>\n        ))}\n      </div>\n      <Lightbox\n        isOpen={isOpen}\n        onOpenChange={setIsOpen}\n        media={media}\n        index={index}\n        onIndexChange={setIndex}\n      />\n    </>\n  );\n}\n","io-5":"import {useState} from 'react';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {TextArea} from '@astryxdesign/core/TextArea';\nimport {Selector} from '@astryxdesign/core/Selector';\nimport {Button} from '@astryxdesign/core/Button';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\n\nexport default function SupportTicketForm() {\n  const [subject, setSubject] = useState('');\n  const [description, setDescription] = useState('');\n  const [priority, setPriority] = useState('');\n  const [submitted, setSubmitted] = useState(false);\n\n  if (submitted) {\n    return (\n      <div className=\"flex flex-col gap-4 p-6\">\n        <Heading level={2}>Ticket Submitted</Heading>\n        <Text>Your support ticket has been received. We will get back to you shortly.</Text>\n        <Button label=\"Submit Another\" variant=\"secondary\" onClick={() => {\n          setSubmitted(false); setSubject(''); setDescription(''); setPriority('');\n        }} />\n      </div>\n    );\n  }\n\n  return (\n    <div className=\"flex flex-col gap-4 p-6 max-w-xl\">\n      <Heading level={2}>Submit a Support Ticket</Heading>\n      <TextInput label=\"Subject\" value={subject} onChange={setSubject} placeholder=\"Brief description of your issue\" isRequired />\n      <TextArea label=\"Description\" value={description} onChange={setDescription} placeholder=\"Provide as much detail as possible...\" rows={6} maxLength={2000} isRequired />\n      <Selector\n        label=\"Priority\"\n        value={priority}\n        onChange={setPriority}\n        options={[\n          {value: 'low', label: 'Low'},\n          {value: 'medium', label: 'Medium'},\n          {value: 'high', label: 'High'},\n          {value: 'critical', label: 'Critical'},\n        ]}\n        placeholder=\"Select priority level\"\n        isRequired\n      />\n      <div className=\"flex justify-end\">\n        <Button label=\"Submit Ticket\" variant=\"primary\" onClick={() => setSubmitted(true)} isDisabled={!subject || !description || !priority} />\n      </div>\n    </div>\n  );\n}\n","ps-4":"import {Breadcrumbs, BreadcrumbItem} from '@astryxdesign/core/Breadcrumbs';\nimport {Card} from '@astryxdesign/core/Card';\nimport {Button} from '@astryxdesign/core/Button';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\n\nexport default function ProductDetailPage() {\n  return (\n    <div className=\"p-6 max-w-4xl mx-auto flex flex-col gap-4\">\n      <Breadcrumbs>\n        <BreadcrumbItem href=\"/\">Home</BreadcrumbItem>\n        <BreadcrumbItem href=\"/electronics\">Electronics</BreadcrumbItem>\n        <BreadcrumbItem href=\"/electronics/headphones\">Headphones</BreadcrumbItem>\n        <BreadcrumbItem>Studio Pro Max</BreadcrumbItem>\n      </Breadcrumbs>\n      <div className=\"flex gap-6\">\n        <img className=\"w-1/2 h-96 object-cover rounded-lg\" src=\"https://picsum.photos/600/400\" alt=\"Studio Pro Max Headphones\" />\n        <div className=\"flex flex-col gap-3\">\n          <Heading level={1}>Studio Pro Max</Heading>\n          <Text color=\"secondary\">Premium wireless headphones with active noise cancellation</Text>\n          <Heading level={2}>$349.99</Heading>\n          <Card padding={3} variant=\"muted\">\n            <div className=\"flex flex-col gap-2\">\n              <Text weight=\"semibold\">Key Features</Text>\n              <Text>Active Noise Cancellation</Text>\n              <Text>40-hour battery life</Text>\n              <Text>Spatial Audio support</Text>\n              <Text>Premium memory foam cushions</Text>\n            </div>\n          </Card>\n          <div className=\"flex gap-2\">\n            <Button label=\"Add to Cart\" variant=\"primary\" />\n            <Button label=\"Save for Later\" variant=\"secondary\" />\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}\n","rc-1":"import {useState} from 'react';\nimport {Button} from '@astryxdesign/core/Button';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\n\nconst navItems = ['Home', 'Products', 'About', 'Contact'];\n\nexport default function ResponsiveNav() {\n  const [isMenuOpen, setIsMenuOpen] = useState(false);\n\n  return (\n    <div className=\"flex flex-col\">\n      <nav className=\"flex items-center justify-between px-6 py-3 border-b\">\n        <Heading level={4}>MyBrand</Heading>\n        <div className=\"hidden md:flex gap-4\">\n          {navItems.map((item) => (\n            <a key={item} href={`#${item.toLowerCase()}`} className=\"px-3 py-2 hover:underline\">\n              <Text>{item}</Text>\n            </a>\n          ))}\n        </div>\n        <div className=\"md:hidden\">\n          <Button\n            label={isMenuOpen ? 'Close menu' : 'Open menu'}\n            variant=\"ghost\"\n            isIconOnly\n            onClick={() => setIsMenuOpen(!isMenuOpen)}\n            icon={<span>{isMenuOpen ? '\\u2715' : '\\u2630'}</span>}\n          />\n        </div>\n      </nav>\n      {isMenuOpen && (\n        <div className=\"md:hidden flex flex-col gap-1 p-4 border-b\">\n          {navItems.map((item) => (\n            <a key={item} href={`#${item.toLowerCase()}`} className=\"px-3 py-2\">\n              <Text>{item}</Text>\n            </a>\n          ))}\n        </div>\n      )}\n    </div>\n  );\n}\n","sd-4":"import {useState} from 'react';\nimport {CheckboxInput} from '@astryxdesign/core/CheckboxInput';\nimport {Button} from '@astryxdesign/core/Button';\nimport {TextArea} from '@astryxdesign/core/TextArea';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\n\nconst TERMS = `Terms and Conditions\\n\\n1. Acceptance of Terms\\nBy accessing and using this service, you accept and agree to be bound by the terms and provision of this agreement.\\n\\n2. Use License\\nPermission is granted to temporarily use this service for personal, non-commercial transitory viewing only.\\n\\n3. Disclaimer\\nThe materials on this service are provided on an \"as is\" basis.\\n\\n4. Limitations\\nIn no event shall we be liable for any damages arising out of the use or inability to use the materials.\\n\\n5. Revisions\\nWe may revise these terms at any time without notice.\\n\\n6. Governing Law\\nThese terms are governed by applicable laws.`;\n\nexport default function TermsAcceptance() {\n  const [accepted, setAccepted] = useState(false);\n\n  return (\n    <div className=\"flex flex-col gap-4 p-6 max-w-xl\">\n      <Heading level={2}>Terms and Conditions</Heading>\n      <Text color=\"secondary\">Please read and accept the terms below to continue.</Text>\n      <TextArea\n        label=\"Terms and Conditions\"\n        isLabelHidden\n        value={TERMS}\n        onChange={() => {}}\n        rows={12}\n        isDisabled\n      />\n      <CheckboxInput\n        label=\"I have read and agree to the Terms and Conditions\"\n        value={accepted}\n        onChange={setAccepted}\n      />\n      <Button\n        label=\"Continue\"\n        variant=\"primary\"\n        isDisabled={!accepted}\n        onClick={() => alert('Accepted!')}\n      />\n    </div>\n  );\n}\n","tc-7":"import {Theme} from '@astryxdesign/core/theme';\nimport {Layout} from '@astryxdesign/core/Layout';\nimport {LayoutPanel} from '@astryxdesign/core/LayoutPanel';\nimport {LayoutContent} from '@astryxdesign/core/LayoutContent';\nimport {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\nimport {Button} from '@astryxdesign/core/Button';\nimport {defineTheme} from '@astryxdesign/core/theme';\n\nconst darkSidebarTheme = defineTheme({\n  mode: 'dark',\n  tokens: { '--color-accent': '#6366f1' },\n});\n\nconst lightContentTheme = defineTheme({\n  mode: 'light',\n  tokens: { '--color-accent': '#6366f1' },\n});\n\nexport default function DualThemeLayout() {\n  return (\n    <Layout height=\"fill\">\n      <Theme theme={darkSidebarTheme} mode=\"dark\">\n        <LayoutPanel width={260} hasDivider>\n          <div className=\"flex flex-col gap-3 p-4\">\n            <Heading level={4}>Navigation</Heading>\n            <div className=\"flex flex-col gap-1\">\n              <Button label=\"Dashboard\" variant=\"ghost\" width=\"100%\" />\n              <Button label=\"Projects\" variant=\"ghost\" width=\"100%\" />\n              <Button label=\"Settings\" variant=\"ghost\" width=\"100%\" />\n              <Button label=\"Help\" variant=\"ghost\" width=\"100%\" />\n            </div>\n          </div>\n        </LayoutPanel>\n      </Theme>\n      <Theme theme={lightContentTheme} mode=\"light\">\n        <LayoutContent padding={6}>\n          <div className=\"flex flex-col gap-4\">\n            <Heading level={1}>Dashboard</Heading>\n            <Text>This content area uses a light theme while the sidebar uses a dark theme.</Text>\n            <Text color=\"secondary\">Each section can have its own theme without affecting the rest.</Text>\n          </div>\n        </LayoutContent>\n      </Theme>\n    </Layout>\n  );\n}\n","ty-1":"import {Heading} from '@astryxdesign/core/Heading';\nimport {Text} from '@astryxdesign/core/Text';\n\nexport default function PageHeader() {\n  return (\n    <div className=\"flex flex-col gap-2 p-6\">\n      <Heading level={1}>Welcome to Our Platform</Heading>\n      <Text type=\"large\" color=\"secondary\">\n        Build beautiful, accessible interfaces with a comprehensive design system\n        that scales from small projects to enterprise applications.\n      </Text>\n    </div>\n  );\n}\n","wd-5":"import {useState} from 'react';\nimport {Dialog} from '@astryxdesign/core/Dialog';\nimport {DialogHeader} from '@astryxdesign/core/DialogHeader';\nimport {TextInput} from '@astryxdesign/core/TextInput';\nimport {TextArea} from '@astryxdesign/core/TextArea';\nimport {Button} from '@astryxdesign/core/Button';\n\nexport default function FeedbackForm() {\n  const [isOpen, setIsOpen] = useState(false);\n  const [title, setTitle] = useState('');\n  const [description, setDescription] = useState('');\n\n  const handleSubmit = () => {\n    setIsOpen(false);\n    setTitle('');\n    setDescription('');\n  };\n\n  return (\n    <>\n      <Button label=\"Give Feedback\" variant=\"primary\" onClick={() => setIsOpen(true)} />\n      <Dialog isOpen={isOpen} onOpenChange={setIsOpen} purpose=\"form\">\n        <DialogHeader title=\"Send Feedback\" />\n        <div className=\"flex flex-col gap-4 p-6\">\n          <TextInput\n            label=\"Title\"\n            value={title}\n            onChange={setTitle}\n            placeholder=\"Brief summary\"\n            isRequired\n          />\n          <TextArea\n            label=\"Description\"\n            value={description}\n            onChange={setDescription}\n            placeholder=\"Tell us more about your experience...\"\n            rows={5}\n          />\n          <div className=\"flex gap-2 justify-end\">\n            <Button label=\"Cancel\" variant=\"ghost\" onClick={() => setIsOpen(false)} />\n            <Button label=\"Submit\" variant=\"primary\" onClick={handleSubmit} />\n          </div>\n        </div>\n      </Dialog>\n    </>\n  );\n}\n"},"previews":{"cwm-1":{"astryx":"previews/cwm-1/astryx.html","baseline":"previews/cwm-1/baseline.html","html":"previews/cwm-1/html.html","astryx-tailwind":"previews/cwm-1/astryx-tailwind.html"},"dd-1":{"astryx":"previews/dd-1/astryx.html","baseline":"previews/dd-1/baseline.html","html":"previews/dd-1/html.html","astryx-tailwind":"previews/dd-1/astryx-tailwind.html"},"fwc-12":{"astryx":"previews/fwc-12/astryx.html","baseline":"previews/fwc-12/baseline.html","html":"previews/fwc-12/html.html","astryx-tailwind":"previews/fwc-12/astryx-tailwind.html"},"io-5":{"astryx":"previews/io-5/astryx.html","baseline":"previews/io-5/baseline.html","html":"previews/io-5/html.html","astryx-tailwind":"previews/io-5/astryx-tailwind.html"},"ps-4":{"astryx":"previews/ps-4/astryx.html","baseline":"previews/ps-4/baseline.html","html":"previews/ps-4/html.html","astryx-tailwind":"previews/ps-4/astryx-tailwind.html"},"rc-1":{"astryx":"previews/rc-1/astryx.html","baseline":"previews/rc-1/baseline.html","html":"previews/rc-1/html.html","astryx-tailwind":"previews/rc-1/astryx-tailwind.html"},"sd-4":{"astryx":"previews/sd-4/astryx.html","baseline":"previews/sd-4/baseline.html","html":"previews/sd-4/html.html","astryx-tailwind":"previews/sd-4/astryx-tailwind.html"},"ty-1":{"astryx":"previews/ty-1/astryx.html","baseline":"previews/ty-1/baseline.html","html":"previews/ty-1/html.html","astryx-tailwind":"previews/ty-1/astryx-tailwind.html"},"tc-7":{"baseline":"previews/tc-7/baseline.html","html":"previews/tc-7/html.html"},"wd-5":{"baseline":"previews/wd-5/baseline.html","html":"previews/wd-5/html.html"}},"prompts":{"fwc-12":"Build an image thumbnail grid. When a user clicks a thumbnail, open a fullscreen lightbox showing the image with a caption and a close button.","wd-5":"Build a feedback form that opens in a dialog. It should have a title field, a long-form text area for comments, and a submit button. Show a success state after submission.","cwm-1":"Something like Stripe's pricing table but with monthly/annual toggle","sd-4":"Build a terms and conditions acceptance form. Show a scrollable text area with the terms, then checkboxes for \"I agree to the Terms of Service\" and \"I agree to the Privacy Policy\". The continue button should only enable when both are checked.","dd-1":"A table of users with sortable columns and search","rc-1":"Navigation that collapses to hamburger on mobile","io-5":"Build a support ticket form with a subject line input, a description text area with character count, and a priority selector. Submit should post to /api/tickets.","ps-4":"Create a product detail page with breadcrumb navigation showing Home > Category > Subcategory > Product Name. The page should have a header, product info section, and a back button.","ty-1":"Show a page title with a short description underneath","tc-7":"I have a section of my app that needs a different theme than the rest — like a dark sidebar next to a light content area. How do I nest themes in Astryx?"}};</script>

  :where(*) {
    box-sizing: border-box;
    border: 0 solid;
  }

    tab-size: 4;

  }

    margin: 0;
  }

    color: inherit;
    -webkit-text-decoration: inherit;
    text-decoration: inherit;
  }

  :where(b, strong) {

  }

    vertical-align: baseline;
    font-size: 75%;
    line-height: 0;
    position: relative;
  }

  :where(sub) {
    bottom: -.25em;
  }

  :where(sup) {
    top: -.5em;
  }

  :where(ol, ul, menu) {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  :where(img, svg, video, canvas, audio, iframe, embed, object) {

  }

  :where(img, video) {
    max-width: 100%;
    height: auto;
  }

  :where([data-astryx-aspect-ratio-override="cover"], [data-astryx-aspect-ratio-override="contain"]) > :where(*) {
    width: 100%;

    object-fit: contain;
  }

    font: inherit;
    color: inherit;
    margin: 0;
    padding: 0;
  }

  :where(button, [type="button"], [type="reset"], [type="submit"]) {
    appearance: button;
    background-color: #0000;
    background-image: none;
  }

  :where(button, [role="button"]) {
    cursor: pointer;
  }

  :where(:disabled) {
    cursor: default;
  }

  :where(textarea) {
    resize: vertical;
  }

  :where() {
    opacity: 1;
    color: var(--color-text-secondary, #9ca3af);
    -webkit-appearance: none;
  }

  :where(fieldset) {
    margin: 0;
    padding: 0;
  }

  :where(legend) {
    padding: 0;
  }

  :where(table) {
    text-indent: 0;
    border-color: inherit;
    border-collapse: collapse;
  }

  :where(hr) {
    height: 0;
    color: inherit;
    border-top-width: 1px;
  }

  :where(summary) {
    display: list-item;
  }

  :where(dialog) {
    outline: none;
    padding: 0;
  }

  :where([hidden]) {
    display: none;
  }

  :where(html) {
    -webkit-tap-highlight-color: transparent;
  }

  :where(html[data-theme="light"]) {
    color-scheme: light;
  }

  :where(html[data-theme="dark"]) {
    color-scheme: dark;
  }

  :where(html:not([data-theme])) {
    color-scheme: light dark;
  }

  :where([data-astryx-media="dark"]) {
