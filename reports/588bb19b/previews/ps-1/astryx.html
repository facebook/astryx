h `ends with`."},"@astryx.powersearch.operator.is":{defaultMessage:`is`,description:"PowerSearch equality operator for strings/enums. Example: `Status is Active`. Separate from `operator.equals` (numbers) — translations may diverge."},"@astryx.powersearch.operator.isNot":{defaultMessage:`is not`,description:"PowerSearch inequality operator for strings/enums. Example: `Status is not Draft`. Pairs with `is`; separate from `operator.notEquals`."},"@astryx.powersearch.operator.equals":{defaultMessage:`is`,description:'PowerSearch numeric equality operator. Example: `Age is 30`. Ships same English "is" as `operator.is` but is separate so numbers may diverge (e.g. "equals").'},"@astryx.powersearch.operator.notEquals":{defaultMessage:`is not`,description:"PowerSearch numeric inequality operator. Example: `Count is not 0`. Same divergence option as `operator.equals`."},"@astryx.powersearch.operator.greaterThan":{defaultMessage:`is greater than`,description:"PowerSearch numeric operator, strictly greater than. Example: `Age is greater than 18`. Lowercase."},"@astryx.powersearch.operator.lessThan":{defaultMessage:`is less than`,description:"PowerSearch numeric operator, strictly less than. Example: `Priority is less than 5`. Lowercase."},"@astryx.powersearch.operator.greaterThanOrEqual":{defaultMessage:`is greater than or equal to`,description:'PowerSearch numeric operator, ≥. Example: `Age is greater than or equal to 21`. A shorter form (e.g. "≥") is fine if idiomatic.'},"@astryx.powersearch.operator.lessThanOrEqual":{defaultMessage:`is less than or equal to`,description:"PowerSearch numeric operator, ≤. Example: `Priority is less than or equal to 3`. A shorter form is fine if idiomatic."},"@astryx.powersearch.operator.before":{defaultMessage:`is before`,description:"PowerSearch date operator, strictly earlier. Example: `Created is before 2024-01-01`. Temporal, not spatial."},"@astryx.powersearch.operator.after":{defaultMessage:`is after`,description:"PowerSearch date operator, strictly later. Example: `Updated is after 2024-06-01`. Temporal."},"@astryx.powersearch.operator.between":{defaultMessage:`is between`,description:"PowerSearch date operator, inclusive range. Example: `Created is between 2024-01-01 and 2024-06-30`. The `and <end>` portion is composed separately."},"@astryx.powersearch.operator.isTrue":{defaultMessage:`is true`,description:"PowerSearch boolean operator: matches truthy. Example: `Is admin is true`. Pairs with `is false`; field may be affirmative or a yes/no question."},"@astryx.powersearch.operator.isFalse":{defaultMessage:`is false`,description:"PowerSearch boolean operator: matches falsy. Example: `Is admin is false`. Pairs with `is true`."},"@astryx.powersearch.operator.isAnyOf":{defaultMessage:`is any of`,description:"PowerSearch list operator: value is in the set. Example: `Status is any of [Active, Paused, Draft]`. The value list is composed separately; pairs with `is none of`."},"@astryx.powersearch.operator.isNoneOf":{defaultMessage:`is none of`,description:"PowerSearch negated list operator: value not in the set. Example: `Status is none of [Archived, Deleted]`. Pairs with `is any of`."},"@astryx.powersearch.valueEditor.itemsCount":{defaultMessage:`{count, number} {count, plural, one {item} other {items}}`,description:"Overflow summary on a compact filter chip when the list of selected items is too long. Example: `3 items` or `1 item`."},"@astryx.powersearch.valueEditor.entitiesCount":{defaultMessage:`{count, number} {count, plural, one {entity} other {entities}}`,description:"Overflow summary on a compact filter chip when the list of selected entities is too long. Example: `5 entities` or `1 entity`. Pair with `itemsCount` translation."},"@astryx.powersearch.valueEditor.dateRange":{defaultMessage:`date range`,description:"Fallback lowercase noun rendered inline in a filter chip when a date-range value can't be formatted (e.g. `Created is between date range`). Keep lowercase."},"@astryx.powersearch.valueEditor.filtersCount":{defaultMessage:`{count, number} {count, plural, one {filter} other {filters}}`,description:"Summary inside a filter chip when the value is a nested set of filters. Example: `3 filters` or `1 filter`."},"@astryx.powersearch.resultCount":{defaultMessage:`{count, number} {count, plural, one {result} other {results}}`,description:"Live result-count text next to the PowerSearch input, announced to screen readers on change. Example: `12 results`, `1 result`; keep compact."},"@astryx.alertDialog.cancel":{defaultMessage:`Cancel`,description:`Button label on the secondary/dismiss button of an AlertDialog (modal confirmation). Imperative verb; consumers usually override with task-specific text.`},"@astryx.appShell.mobileNavigation":{defaultMessage:`Mobile navigation`,description:`Screen-reader-only accessible name for the mobile-only navigation region on small viewports. "Mobile" = phone/tablet (small screen), not "movable".`},"@astryx.appShell.skipToContent":{defaultMessage:`Skip to content`,description:`Text of the skip link — the first focusable element on the page, visible only while keyboard-focused. Activating it jumps focus past the navigation to the main content area. Imperative verb; keep short.`},"@astryx.avatar.nameWithStatus":{defaultMessage:`{name}, {status}`,description:`Screen-reader accessible name for an Avatar showing a status indicator; composes the person's name with the status label, e.g. "Jane Doe, Online". {name} = the avatar's name/alt text, {status} = the status dot's label. Adjust separator and order per locale.`},"@astryx.avatarGroup.label":{defaultMessage:`Avatars`,description:`Screen-reader-only fallback name for a horizontal cluster of user avatar images. Plural noun; consumers usually override with "Team members", "Attendees", etc.`},"@astryx.avatarGroup.keyboardHint":{defaultMessage:`Use arrow keys to move between avatars`,description:`Screen-reader-only instruction attached (via aria-describedby) to a group of interactive avatars that share a single Tab stop. Tells keyboard users the Left/Right arrow keys move focus between the avatars. Only announced when the group has interactive (link/button) avatars.`},"@astryx.avatarGroup.overflow":{defaultMessage:`{count, number} more`,description:'Accessible name for the "+N" overflow indicator at the end of an AvatarGroup — announces how many additional avatars are not shown. Example: `5 more`. The visible "+N" text is unaffected; this is the aria-label only.'},"@astryx.banner.dismiss":{defaultMessage:`Dismiss`,description:`"Dismiss" = close/hide this notification (not "reject a person"). Tooltip on the small X button on a Banner, and its aria label when the banner's title is not plain text.`},"@astryx.banner.dismissTitled":{defaultMessage:`{dismiss} {title}`,description:"Aria label on the small X button on a Banner, naming which banner it closes so stacked banners are distinguishable. `{dismiss}` is the already-translated tooltip text from `banner.dismiss`; keep it verbatim in the message so visible and accessible labels match. `{title}` is the banner's own title text — example: `Dismiss Upload failed`. Reorder the placeholders freely."},"@astryx.calendar.previousMonth":{defaultMessage:`Previous month`,description:"Screen-reader-only label on the left-arrow button in a Calendar's month header (navigates one month back). Pairs with `calendar.nextMonth`."},"@astryx.calendar.nextMonth":{defaultMessage:`Next month`,description:"Screen-reader-only label on the right-arrow button in a Calendar's month header (navigates one month forward). Pairs with `calendar.previousMonth`."},"@astryx.calendar.daySelected":{defaultMessage:`{date}, selected`,description:'Accessible name for the Calendar day button that is the current single-mode selection. `{date}` is the localized full date, e.g. "Thursday, January 15, 2026". The trailing state word tells screen-reader users the focused day is selected.'},"@astryx.calendar.dayRangeStart":{defaultMessage:`{date}, range start`,description:"Accessible name for the Calendar day button that begins the selected date range (or the first pick of an in-progress range). `{date}` is the localized full date."},"@astryx.calendar.dayRangeEnd":{defaultMessage:`{date}, range end`,description:"Accessible name for the Calendar day button that ends the selected date range. `{date}` is the localized full date. Pairs with `calendar.dayRangeStart`."},"@astryx.calendar.dayRangeStartAndEnd":{defaultMessage:`{date}, range start and range end`,description:"Accessible name for a Calendar day button that both begins and ends a completed one-day range. `{date}` is the localized full date."},"@astryx.calendar.dayInRange":{defaultMessage:`{date}, in range`,description:"Accessible name for a Calendar day button strictly inside the selected date range (not an endpoint). `{date}` is the localized full date."},"@astryx.calendar.rangeStartAnnounce":{defaultMessage:`Start date {date}. Select an end date.`,description:"Screen-reader announcement after the first pick of a Calendar range selection. `{date}` is the localized full date. Prompts the user that a second pick completes the range."},"@astryx.calendar.rangeCompleteAnnounce":{defaultMessage:`Selected range: {start} to {end}.`,description:"Screen-reader announcement after the second pick completes a Calendar range selection. `{start}` and `{end}` are localized full dates in chronological order."},"@astryx.calendar.rangeClearedAnnounce":{defaultMessage:`Cleared start date {date}. Select a start date.`,description:"Screen-reader announcement when the user clicks the in-progress range start again, which clears it instead of completing a zero-length range. `{date}` is the localized full date."},"@astryx.carousel.label":{defaultMessage:`Carousel`,description:`Screen-reader-only fallback name for a horizontally-scrolling row of items. If "carousel" is unfamiliar in your locale, prefer the standard term (e.g. "slider").`},"@astryx.carousel.scrollLeft":{defaultMessage:`Scroll left`,description:"Screen-reader-only label on the left arrow button in a Carousel. Pairs with `carousel.scrollRight`; in RTL locales, coordinate the two so left/right match layout."},"@astryx.carousel.scrollRight":{defaultMessage:`Scroll right`,description:"Screen-reader-only label on the right arrow button in a Carousel. Pairs with `carousel.scrollLeft`; same RTL note."},"@astryx.carousel.slideLabel":{defaultMessage:`Slide {current, number} of {total, number}`,description:"Screen-reader accessible name for one slide in a Carousel, giving its position. `current` is the 1-based slide number; `total` is the slide count."},"@astryx.chat.status.sending":{defaultMessage:`Sending`,description:`Chat send-status caption under an outgoing message while it is being transmitted. Part of the set sending → sent → delivered → read (or failed) — keep tense/aspect consistent.`},"@astryx.chat.status.sent":{defaultMessage:`Sent`,description:`Chat send-status caption shown once the message reaches the server. Part of the set sending → **sent** → delivered → read (or failed) — keep tense consistent.`},"@astryx.chat.status.delivered":{defaultMessage:`Delivered`,description:`Chat send-status caption shown once the recipient's device received the message. Part of the set sending → sent → **delivered** → read (or failed).`},"@astryx.chat.status.read":{defaultMessage:`Read`,description:`Chat send-status caption shown once the recipient opened the message. English past-participle ("has been read", /rɛd/), not the present verb — part of the set sending → sent → delivered → **read**.`},"@astryx.chat.status.failed":{defaultMessage:`Failed`,description:`Chat send-status caption shown when the send attempt errored. Part of the set — the terminal failure branch, orthogonal to the sent → delivered → read success track.`},"@astryx.chat.messageAriaLabel":{defaultMessage:`Message {status}`,description:"Screen-reader-only accessible name for a chat message row. `{status}` interpolates the localized status word (e.g. `Message sent`, `Message delivered`) — reorder if needed."},"@astryx.chat.pastedText.expand":{defaultMessage:`Expand`,description:`Button label on a chip in the chat composer representing a long pasted text block; clicking reveals full content. "Expand" here means reveal more, not grow physically.`},"@astryx.checkboxList.item.checkbox":{defaultMessage:`Checkbox`,description:`Screen-reader-only last-ditch fallback name for a checkbox inside a list item when no label is provided. Should almost never render — consumers should supply a real label.`},"@astryx.commandPalette.emptySearch":{defaultMessage:`No results`,description:`Fallback empty-state text inside a CommandPalette when the user's query has no matches. Very short (2 words); neutral tone.`},"@astryx.commandPalette.emptyBootstrap":{defaultMessage:`Type to search`,description:`Onboarding empty-state text shown inside a CommandPalette on first open, before the user has typed anything. Imperative sentence fragment.`},"@astryx.commandPalette.resultCount":{defaultMessage:`{count, number} {count, plural, one {result} other {results}}`,description:"Screen-reader-only announcement of how many commands match the CommandPalette query as the user types. Example: `12 results`, `1 result`; keep compact."},"@astryx.commandPalette.noResultsFor":{defaultMessage:`No results for {query}`,description:"Screen-reader-only announcement when a CommandPalette query matches nothing. `{query}` is the user's verbatim search text; keep it last if your language allows so truncation-by-AT still conveys the outcome."},"@astryx.commandPalette.loading":{defaultMessage:`Loading`,description:`Screen-reader-only announcement that a CommandPalette search has started and results are being fetched. Present-progressive form; matches the visible spinner.`},"@astryx.dateRangeInput.presetDateRanges":{defaultMessage:`Preset date ranges`,description:`Screen-reader-only accessible name for the sidebar of quick-pick preset ranges inside a DateRangeInput popover (e.g. "Last 7 days", "This month").`},"@astryx.dateTimeInput.timePlaceholder":{defaultMessage:`Select a time`,description:`Grey placeholder inside the empty time-of-day slot in a DateTimeInput. "Time" = clock time (HH:MM), not duration.`},"@astryx.dialog.close":{defaultMessage:`Close`,description:`"Close" = shut/dismiss the dialog, not "nearby" (English homograph). Aria label AND tooltip on the X at the top-right of a Dialog.`},"@astryx.dropdownMenu.label":{defaultMessage:`Menu`,description:`Screen-reader-only fallback name for a dropdown menu popover. Very generic; consumers usually override. Noun ("a menu"), not the imperative.`},"@astryx.lightbox.close":{defaultMessage:`Close`,description:`"Close" = shut/dismiss (not "nearby"). Screen-reader-only label on the X button that dismisses a Lightbox.`},"@astryx.lightbox.previous":{defaultMessage:`Previous`,description:"Screen-reader-only label on the left-arrow button in a Lightbox (navigates to previous media item). Pairs with `lightbox.next`."},"@astryx.lightbox.next":{defaultMessage:`Next`,description:"Screen-reader-only label on the right-arrow button in a Lightbox (navigates to next media item). Pairs with `lightbox.previous`."},"@astryx.listInput.emptyTitle":{defaultMessage:`No {itemName}s yet`,description:'EmptyState title shown inside a lab ListInput when its collection has no records. `{itemName}` is the consumer\'s singular noun for one record (e.g. "guest"); the source appends a literal "s" to pluralize it, which only works for regular English plurals. If your language cannot pluralize an interpolated noun this way, rephrase around `{itemName}` instead (e.g. "No {itemName} added yet").'},"@astryx.listInput.emptyDescription":{defaultMessage:`Add a {itemName} to get started.`,description:'EmptyState supporting text shown inside a lab ListInput when its collection has no records. `{itemName}` is the consumer\'s singular noun for one record (e.g. "guest").'},"@astryx.listInput.addItem":{defaultMessage:`Add {itemName}`,description:'Accessible label on the button that appends a new record to a lab ListInput. `{itemName}` is the consumer\'s singular noun for one record (e.g. "guest").'},"@astryx.listInput.removeItem":{defaultMessage:`Remove {itemName} {position, number}`,description:'Accessible label and tooltip on the button that deletes one record from a lab ListInput. `{itemName}` is the consumer\'s singular noun for one record; `{position}` is its 1-based row number (e.g. "Remove guest 2").'},"@astryx.listInput.removeUnavailable":{defaultMessage:`Remove is unavailable while the list is disabled`,description:`Tooltip shown on the Remove button when the ListInput is disabled or loading, explaining why the action cannot be performed.`},"@astryx.listInput.reorderItem":{defaultMessage:`Reorder {itemName} {position, number}`,description:'Accessible label on the drag-handle button that reorders one record in a lab ListInput. `{itemName}` is the consumer\'s singular noun for one record; `{position}` is its 1-based row number (e.g. "Reorder guest 2").'},"@astryx.listInput.fieldLabelWithPosition":{defaultMessage:`{header}, {itemName} {position, number} of {total, number}`,description:'Accessible name for a field inside a lab ListInput row after the first row, disambiguating repeated column labels. `{header}` is the column\'s own label (e.g. "Name"); `{itemName}` is the consumer\'s singular noun for one record; `{position}`/`{total}` are the row\'s 1-based index and the total row count (e.g. "Name, guest 2 of 3").'},"@astryx.listInput.reorderInstructions":{defaultMessage:`Use Arrow Up or Arrow Down to move this item one position. Press Space or Enter to pick it up for extended keyboard reordering.`,description:`Visually-hidden instructions describing how to use a lab ListInput row's keyboard reorder handle, referenced via aria-describedby from every reorder button.`},"@astryx.listInput.announceAdded":{defaultMessage:`Added {itemName} {position, number}.`,description:"Screen-reader-only live announcement after a new record is appended to a lab ListInput. `{itemName}` is the consumer's singular noun for one record; `{position}` is the new record's 1-based row number."},"@astryx.listInput.announceRemoved":{defaultMessage:`Removed {itemName} {position, number}.`,description:"Screen-reader-only live announcement after a record is deleted from a lab ListInput. `{itemName}` is the consumer's singular noun for one record; `{position}` is the removed record's former 1-based row number."},"@astryx.listInput.announceGrabbed":{defaultMessage:`{itemName} {position, number} grabbed. Use arrow keys to move, Space or Enter to drop, and Escape to cancel.`,description:"Screen-reader-only live announcement when a lab ListInput record's keyboard reorder handle enters extended \"lift\" mode. `{itemName}` is the consumer's singular noun for one record; `{position}` is its 1-based row number."},"@astryx.listInput.announceMovedToPosition":{defaultMessage:`{itemName} moved to position {position, number} of {total, number}.`,description:"Screen-reader-only live announcement each time a lab ListInput record's reorder position changes (arrow-key step, keyboard lift-mode preview, or pointer drag). `{itemName}` is the consumer's singular noun for one record; `{position}`/`{total}` are the record's new 1-based position and the total row count."},"@astryx.listInput.announceReorderCancelled":{defaultMessage:`Reordering cancelled.`,description:`Screen-reader-only live announcement when a lab ListInput reorder in progress is cancelled (Escape key, blur, or the collection becoming disabled/loading mid-drag).`},"@astryx.listInput.announceReturnedToPosition":{defaultMessage:`{itemName} returned to position {position, number}.`,description:"Screen-reader-only live announcement when a lab ListInput reorder is committed without the record's position actually changing. `{itemName}` is the consumer's singular noun for one record; `{position}` is its unchanged 1-based row number."},"@astryx.listInput.announceDropped":{defaultMessage:`{itemName} dropped at position {position, number} of {total, number}.`,description:"Screen-reader-only live announcement when a lab ListInput reorder is committed with the record's position actually changing. `{itemName}` is the consumer's singular noun for one record; `{position}`/`{total}` are its new 1-based position and the total row count."},"@astryx.listInput.announceAlreadyAtBoundary":{defaultMessage:`This {itemName} is already {boundary, select, first {first} last {last} other {}}.`,description:'Screen-reader-only live announcement when an arrow-key reorder attempt has no effect because the record is already at that end of the list. `{itemName}` is the consumer\'s singular noun for one record; `{boundary}` is always exactly "first" or "last".'},"@astryx.markdown.taskList":{defaultMessage:`Task list`,description:"Screen-reader-only accessible name for a GitHub-flavored Markdown task list (rendered from `- [ ] item` / `- [x] done` syntax)."},"@astryx.markdown.table":{defaultMessage:`Table`,description:'Screen-reader-only accessible name for a table rendered inside a Markdown block. Noun ("a table"), not the verb. Separate from `@astryx.table.label` — translations may diverge.'},"@astryx.mobileNav.closeNavigation":{defaultMessage:`Close navigation`,description:"Screen-reader-only label on the X/close button that dismisses the MobileNav overlay. Pairs with `mobileNav.toggle.open`."},"@astryx.multiSelector.selectAll":{defaultMessage:`Select all`,description:`Label on the checkbox/toggle at the top of a MultiSelector dropdown that selects every option. "All" is a determiner here (as in "all the options"), not the pronoun.`},"@astryx.multiSelector.searchPlaceholder":{defaultMessage:`Search…`,description:"Placeholder inside the search input at the top of a MultiSelector's dropdown panel. Imperative verb; trailing `…` is one character."},"@astryx.multiSelector.searchOptions":{defaultMessage:`Search options`,description:`Screen-reader-only accessible name for that same search input inside a MultiSelector.`},"@astryx.multiSelector.empty":{defaultMessage:`No options`,description:`Shown in a MultiSelector's dropdown panel when it was given no options at all, and announced in a polite live region on open. Very short (2 words); neutral tone, not error-y.`},"@astryx.multiSelector.selectAllPartiallySelected":{defaultMessage:`{label}, partially selected`,description:'Accessible name for the MultiSelector select-all option while only some options are selected. `{label}` is the visible select-all label (e.g. "Select all"). ARIA forbids aria-selected="mixed" on options, so the indeterminate state is conveyed through the name instead. "Partially" = some but not all.'},"@astryx.popover.close":{defaultMessage:`Close popover`,description:`"Close" = shut/dismiss, not "nearby". Screen-reader-only label on the close button inside a Popover.`},"@astryx.selector.searchPlaceholder":{defaultMessage:`Search…`,description:"Placeholder inside the search input at the top of a Selector's dropdown panel (for filtering options). Imperative verb; trailing `…` is one character."},"@astryx.selector.searchOptions":{defaultMessage:`Search options`,description:`"Options" = the list of choices in the dropdown. Screen-reader-only accessible name for the search input inside a Selector.`},"@astryx.selector.empty":{defaultMessage:`No options`,description:`Shown in a Selector's dropdown panel when it was given no options at all, and announced in a polite live region on open. Very short (2 words); neutral tone, not error-y.`},"@astryx.sideNav.label":{defaultMessage:`Side navigation`,description:`Screen-reader-only accessible name for the primary vertical sidebar nav (usually on the left).`},"@astryx.sideNav.resizeSidebar":{defaultMessage:`Resize sidebar`,description:`Screen-reader-only label on the vertical drag handle at the right edge of the SideNav that lets the user resize the sidebar's width.`},"@astryx.sideNav.heading.openMenu":{defaultMessage:`Open menu`,description:"Screen-reader-only label on the `⋯` overflow-menu button embedded in a SideNav section heading. Same string as `topNav.heading.openMenu` — translations may share."},"@astryx.tabList.label":{defaultMessage:`Tabs`,description:`Screen-reader-only fallback name for a horizontal tab bar. Plural noun; "Tabs" here = UI tab panels, not browser tabs or the Tab key.`},"@astryx.table.label":{defaultMessage:`Table`,description:`Fallback screen-reader-only accessible name for a data-table region when the consumer provides none. Noun ("a table"), not the verb "to table".`},"@astryx.table.noData":{defaultMessage:`No data`,description:`Fallback empty-state text in the table body when there are zero rows. Neutral tone (not error-y); consumers commonly override with something specific like "No results".`},"@astryx.table.filter.allPlaceholder":{defaultMessage:`All`,description:`Placeholder on a per-column filter dropdown when nothing is selected, meaning "no filter — all rows match". Determiner form (as in "all values"), not the pronoun.`},"@astryx.table.filter.reset":{defaultMessage:`Reset`,description:`Button label inside a table's filter panel/popover; clears pending filter values back to defaults. Imperative verb.`},"@astryx.table.filter.apply":{defaultMessage:`Apply`,description:"Primary button label inside a table's filter panel/popover; commits pending filter values. Imperative verb; pairs with `Reset`."},"@astryx.table.rowStatus.columnHeader":{defaultMessage:`Row status`,description:`Screen-reader-only column header for the narrow status-indicator gutter a Table gains from useTableRowStatus. Sighted users see a blank gutter; assistive tech announces this as the column name.`},"@astryx.table.selection.selectAllRows":{defaultMessage:`Select all rows`,description:`Aria label for the "select all rows" checkbox in a Table header.`},"@astryx.table.selection.selectRow":{defaultMessage:`Select row me for the list of suggestions inside a Typeahead dropdown.`},"@astryx.typeahead.clearSelection":{defaultMessage:`Clear selection`,description:`"Selection" = the chosen value (not highlighted text). Screen-reader-only label on the X that clears the currently-selected value from a Typeahead.`},"@astryx.breadcrumbs.label":{defaultMessage:`Breadcrumb`,description:"Screen-reader-only fallback name for the breadcrumb trail (e.g. `Home > Section > Page`). Singular in English per ARIA convention; plural is fine if natural in your locale."},"@astryx.chat.composer.placeholder":{defaultMessage:`Type a message…`,description:"Grey placeholder text inside the empty chat composer textarea. Imperative verb; trailing `…` is one character."},"@astryx.chat.composerDrawer.label":{defaultMessage:`Items`,description:`Fallback aria label for the ChatComposerDrawer — a horizontal list of attachment/tool chips. Consumers usually override with "Attachments", "Tools", etc.`},"@astryx.chat.composerInput.label":{defaultMessage:`Message input`,description:`Screen-reader-only accessible name for the chat composer textarea. Reorder freely if your language uses one word for "message field".`},"@astryx.chat.speechRecognition.noSpeechDetected":{defaultMessage:`No speech was detected.`,description:`Full-sentence error shown inline in the chat composer after voice input captured silence. Soft-error tone (not alarming); keep terminal period.`},"@astryx.commandPalette.label":{defaultMessage:`Command palette`,description:`Screen-reader-only fallback name for a keyboard-driven command menu (usually opened with Cmd/Ctrl-K). If unfamiliar, prefer a natural equivalent like "quick actions".`},"@astryx.commandPalette.input.placeholder":{defaultMessage:`Search…`,description:"Grey placeholder inside the CommandPalette's search input. Imperative verb; trailing `…` is one character."},"@astryx.commandPalette.list.label":{defaultMessage:`Commands`,description:`"Command" = an app action a user can invoke (metaphor from CLI), not a Unix command. Screen-reader-only name for the matching-commands list.`},"@astryx.contextMenu.label":{defaultMessage:`Context menu`,description:`Screen-reader-only fallback name for the right-click / long-press popup menu. "Context" = context-specific to the activated element, not linguistic context.`},"@astryx.dateInput.placeholder":{defaultMessage:`Select a date`,description:`Grey placeholder inside an empty DateInput field. "Date" = calendar date, not romantic or fruit. Imperative verb.`},"@astryx.dateInput.dialogLabel":{defaultMessage:`Choose date`,description:`Screen-reader-only accessible name for the popover dialog opened from a DateInput's calendar toggle. Imperative verb + noun.`},"@astryx.dateInput.closeCalendar":{defaultMessage:`Close calendar`,description:"Screen-reader-only label on the X inside the DateInput calendar popover (dismisses the popover). Distinct from `dateInput.toggleCalendarClose`, which labels the outer toggle."},"@astryx.dateInput.openCalendar":{defaultMessage:`Open calendar`,description:`Aria label for the DateInput / DateRangeInput / DateTimeInput calendar toggle button when the popover is closed.`},"@astryx.dateInput.toggleCalendarClose":{defaultMessage:`Close calendar`,description:`Aria label for the DateInput / DateRangeInput / DateTimeInput calendar toggle button when the popover is open. Distinct from closeCalendar (which labels the X inside the popover) so translators can differentiate the toggle vs the close-X UI.`},"@astryx.dateInput.clear":{defaultMessage:`Clear {label}`,description:"Aria label for the clear-value button in DateInput / DateRangeInput / DateTimeInput. `{label}` is the field's own label so screen readers announce e.g. 'Clear Start date'."},"@astryx.dateInput.invalidDate":{defaultMessage:`Invalid date`,description:`Screen-reader-only live-region alert in DateInput / DateTimeInput when the typed date cannot be parsed. The field silently reverts on blur, so this is the only rejection feedback a screen-reader user gets.`},"@astryx.dateInput.resetPicking":{defaultMessage:`Reset`,description:`Ghost button in the mobile date picker's header, at the trailing corner beside the month arrows. Removes the chosen date AND returns the calendar to the current month — it undoes the picking done so far and puts the picker back to how it opens, so prefer a word covering both, not one that only means emptying a field. Not cancel: the picker stays open afterwards and nothing is dismissed. Keep it short; it shares one line with the month title and two arrows.`},"@astryx.dateInput.savePicking":{defaultMessage:`Save`,description:`Full-width primary button that closes the mobile date picker, on the calendar. The date is already committed by the tap that chose it, so this only dismisses — but it is worded as saving because that is how the action reads to someone finishing a form. Use the word your platform uses for accepting and closing a sheet.`},"@astryx.dateInput.doneChoosingMonth":{defaultMessage:`Done`,description:`Full-width button under the month and year wheels in the mobile date picker. It does NOT close the picker — it returns to the calendar, having set the month. Word it as finishing this step, not as finishing the whole task; the calendar's own button is the one that closes.`},"@astryx.dateInput.chooseMonthYear":{defaultMessage:`{monthYear}, Choose month and year`,description:`Accessible name for the mobile date picker's header button, which swaps the calendar for month and year wheels. {monthYear} is the currently shown month and year, already localized (e.g. "March 2026"). The whole label is one string so the separator and word order can change per locale.`},"@astryx.dateInput.monthWheel":{defaultMessage:`Month`,description:`Accessible name for the scrollable month column in the mobile date picker. Single word; a calendar month, not a duration.`},"@astryx.dateInput.yearWheel":{defaultMessage:`Year`,description:`Accessible name for the scrollable year column in the mobile date picker. Single word; a calendar year, not a duration.`},"@astryx.dateTimeInput.timeHint12h":{defaultMessage:`e.g., 2:30 PM`,description:`Placeholder hint shown in the DateTimeInput time field when focused and empty with 12-hour format. Gives an example of expected input format.`},"@astryx.dateTimeInput.timeHint24h":{defaultMessage:`e.g., 14:30`,description:`Placeholder hint shown in the DateTimeInput time field when focused and empty with 24-hour format. Gives an example of expected input format.`},"@astryx.dateTimeInput.timeSuffix":{defaultMessage:`{label} time`,description:'Screen-reader-only accessible name for the time-of-day slot in a DateTimeInput. Example: `Start date time`; reorder freely (e.g. "time of {label}").'},"@astryx.dateTimeInput.timeOptionsLabel":{defaultMessage:`{label} options`,description:"Screen-reader-only accessible name for the list of preset times that drops down from a DateTimeInput's time slot. `{label}` is the accessible name of the time field itself, already ending in the word for time — example: `Meeting time options`. Plural: the list holds every selectable time."},"@astryx.dateRangeInput.placeholder":{defaultMessage:`Select date range`,description:`Grey placeholder inside an empty DateRangeInput field. Represents picking a start–end date pair. Imperative verb.`},"@astryx.dateRangeInput.dialogLabel":{defaultMessage:`Choose date range`,description:`Screen-reader-only accessible name for the popover dialog opened from a DateRangeInput. Imperative verb + noun phrase.`},"@astryx.dateTimeInput.placeholder":{defaultMessage:`Select a date`,description:`Grey placeholder inside an empty DateTimeInput field. Note: the English says only "date" though the field is date+time — do not add "and time" unless natural.`},"@astryx.dateTimeInput.dialogLabel":{defaultMessage:`Choose date`,description:`Screen-reader-only accessible name for the DateTimeInput picker dialog. Same English-only "date" phrasing as the placeholder — don't add "and time /**
 * Astryx Reset Stylesheet
 *
 * An opinionated CSS reset that provides a clean, predictable base for
 * Astryx applications. Built on the same principles as Tailwind Preflight
 * and modern-normalize, adapted for the Astryx design system.
 *
 * This reset:
 * - Normalizes cross-browser inconsistencies
 * - Sets box-sizing: border-box universally
 * - Removes default margins, padding, and list styles
 * - Makes images block-level and responsive
 * - Resets form elements to inherit font styles
 * - Uses :where() for zero specificity (easy to override)
 *
 * Usage:
 *
 * 1. Import directly (global reset):
 *    import '@astryxdesign/core/reset.css';
 *
 * 2. Combine with base styles and theme:
 *    import '@astryxdesign/core/reset.css';        // @layer reset  — clean slate
 *    import '@astryxdesign/core/astryx.css';        // @layer astryx-base — component styles
 *    import '@astryxdesign/theme-neutral/theme.css'; // @layer astryx-theme — theme overrides
 *
 * Layer order: reset → astryx-base → astryx-theme
 * Consumer styles (unlayered) always override all Astryx layers.
 * The reset has the lowest priority and can be overridden by any other layer.
 *
 * Similar to:
 * - Tailwind CSS Preflight
 * - Chakra UI's preflight (v3)
 * - Bootstrap Reboot
 * - modern-normalize
 */

@layer reset {

  /* ===========================================================================
     Box Model
     =========================================================================== */

  /*
   * Use border-box globally. Prevents padding/border from affecting
   * element dimensions — the single most impactful reset.
   */
  :where(*, *::before, *::after) {
    box-sizing: border-box;
  }

  /*
   * Reset borders to 0-width solid. This lets you add a border by just
   * setting border-width — no need to also specify border-style.
   */
  :where(*, *::before, *::after) {
    border-width: 0;
    border-style: solid;
    border-color: currentColor;
  }

  /* ===========================================================================
     Document
     =========================================================================== */

  /*
   * Consistent line-height, prevent text size adjustment on orientation
   * change in iOS, and set a readable tab size.
   *
   * color-scheme: light dark — declares that this page supports both modes,
   * enabling CSS light-dark() to resolve correctly. Also ensures that CSS
   * tools (e.g. LightningCSS) which polyfill light-dark() for older browsers
   * inject their toggle-variable initialization in the same CSS bundle.
   * XDSTheme overrides color-scheme per-wrapper as needed.
   */
  :where(html) {
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
    color-scheme: light dark;
  }

  /*
   * Remove default body margin and set font smoothing for sharper text
   * rendering on macOS/iOS.
   */
  :where(body) {
    margin: 0;
    line-height: inherit;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ===========================================================================
     Typography
     =========================================================================== */

  /*
   * Reset headings to inherit size and weight. Headings should be styled
   * intentionally — not rely on browser defaults that vary across browsers.
   */
  :where(h1, h2, h3, h4, h5, h6) {
    font-size: inherit;
    font-weight: inherit;
  }

  /*
   * Remove default margins on all block-level text elements.
   */
  :where(h1, h2, h3, h4, h5, h6, p, blockquote, figure, pre, dl, dd) {
    margin: 0;
  }

  /*
   * Links inherit color and text-decoration. Style them intentionally
   * rather than relying on browser-default blue/purple.
   */
  :where(a) {
    color: inherit;
    text-decoration: inherit;
  }

  /*
   * Correct font-weight rendering in Chrome and Safari.
   */
  :where(b, strong) {
    font-weight: bolder;
  }

  /*
   * Use the configured monospace font stack and fix the odd em sizing
   * that browsers apply to code elements.
   */
  :where(code, kbd, samp, pre) {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      'Liberation Mono', 'Courier New', monospace;
    font-size: 1em;
  }

  /*
   * Correct font-size for small elements.
   */
  :where(small) {
    font-size: 80%;
  }

  /*
   * Prevent sub and sup from affecting line-height.
   */
  :where(sub, sup) {
    font-size: 75%;
    line-height: 0;
    position: relative;
    vertical-align: baseline;
  }

  :where(sub) {
    bottom: -0.25em;
  }

  :where(sup) {
    top: -0.5em;
  }

  /* ===========================================================================
     Lists
     =========================================================================== */

  /*
   * Remove default list styles, margin, and padding. Lists used for
   * navigation or layout shouldn't carry prose styling by default.
   * Use explicit styles for prose lists.
   */
  :where(ol, ul, menu) {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  /* ===========================================================================
     Media
     =========================================================================== */

  /*
   * Make replaced elements block-level. Eliminates the "mystery gap"
   * below inline images and aligns with how these elements are
   * actually used in modern layouts.
   */
  :where(img, svg, video, canvas, audio, iframe, embed, object) {
    display: block;
    vertical-align: middle;
  }

  /*
   * Constrain images and video to their container. Responsive by default.
   */
  :where(img, video) {
    max-width: 100%;
    height: auto;
  }

  /* ===========================================================================
     AspectRatio Fit Baseline
     =========================================================================== */

  /*
   * Child sizing for AspectRatio's `fit` prop — the component marks the
   * child's direct parent with `data-astryx-aspect-ratio-override` (carrying
   * the fit value), and these direct-child rules size the child, so
   * consumers don't hand-write width/height/object-fit on every media child.
   * The marker sits on the parent itself, so the rules don't depend on
   * AspectRatio's internal element structure or its theming surface. As with
   * the [data-astryx-media] baseline below, the rules are zero-specificity
   * and any styling the child sets itself still wins. `fit="center"` needs
   * no rules here — the component centers the child from its own wrapper.
   */
  :where([data-astryx-aspect-ratio-override="cover"], [data-astryx-aspect-ratio-override="contain"])
    > :where(*) {
    width: 100%;
    height: 100%;
  }

  :where([data-astryx-aspect-ratio-override="cover"]) > :where(img, video) {
    object-fit: cover;
  }

  :where([data-astryx-aspect-ratio-override="contain"]) > :where(img, video) {
    object-fit: contain;
  }

  /* ===========================================================================
     Forms
     =========================================================================== */

  /*
   * Form elements should inherit font styles from their parent rather
   * than using the browser's default font stack.
   */
  :where(button, input, optgroup, select, textarea) {
    font: inherit;
    color: inherit;
    margin: 0;
    padding: 0;
  }

  /*
   * Remove default button styling. Buttons should be styled intentionally.
   */
  :where(button, [type='button'], [type='reset'], [type='submit']) {
    -webkit-appearance: button;
    appearance: button;
    background-color: transparent;
    background-image: none;
  }

  /*
   * Pointer cursor for interactive elements.
   */
  :where(button, [role='button']) {
    cursor: pointer;
  }

  /*
   * Disabled elements take back any interactive cursor: a control that will
   * not respond must not answer the pointer as though it will. `default`
   * rather than `not-allowed` — a disabled control sealed behind
   * `pointer-events: none` shows whatever its ancestor shows, and one cursor
   * everywhere beats a stronger one we can only paint on half of them.
   * Covers [aria-disabled] too: astryx keeps a disabled control focusable
   * that way wherever its reason must stay discoverable (Button with a
   * tooltip, Selector's trigger, SideNavItem).
   */
  :where(:disabled, [aria-disabled='true']) {
    cursor: default;
  }

  /*
   * Only allow vertical resizing of textareas to prevent layout breakage.
   */
  :where(textarea) {
    resize: vertical;
  }

  /*
   * Normalize placeholder opacity (Firefox renders at reduced opacity)
   * and set a sensible default color using the Astryx text-placeholder token.
   */
  :where(input::placeholder, textarea::placeholder) {
    opacity: 1;
    color: var(--color-text-secondary, #9ca3af);
  }

  /*
   * Remove the inner padding and cancel buttons in search inputs
   * for Chrome and Safari.
   */
  :where([type='search']::-webkit-search-decoration,
         [type='search']::-webkit-search-cancel-button) {
    -webkit-appearance: none;
  }

  /*
   * Remove default fieldset styles.
   */
  :where(fieldset) {
    margin: 0;
    padding: 0;
  }

  :where(legend) {
    padding: 0;
  }

  /* ===========================================================================
     Tables
     =========================================================================== */

  /*
   * Collapse table borders and fix text-indent/border-color inheritance.
   */
  :where(table) {
    text-indent: 0;
    border-color: inherit;
    border-collapse: collapse;
  }

  /* ===========================================================================
     Misc
     =========================================================================== */

  /*
   * Simplify hr to a single border-top line.
   */
  :where(hr) {
    height: 0;
    color: inherit;
    border-top-width: 1px;
  }

  /*
   * Correct display for summary elements.
   */
  :where(summary) {
    display: list-item;
  }

  /*
   * Reset dialog padding and outline.
   */
  :where(dialog) {
    padding: 0;
    outline: none;
  }

  /*
   * Ensure hidden elements are actually hidden.
   */
  :where([hidden]) {
    display: none;
  }

  /*
   * Remove tap highlight on iOS.
   */
  :where(html) {
    -webkit-tap-highlight-color: transparent;
  }

  /* ===========================================================================
     Color Scheme
     =========================================================================== */

  /*
   * Map data-theme attribute to CSS color-scheme.
   *
   * Setting data-theme on <html> tells the browser which color scheme
   * to use for native UI elements (scrollbars, form controls, date
   * pickers) and enables CSS light-dark() to resolve correctly.
   *
   * XDSTheme auto-detects when it's the root provider and syncs this
   * attribute on the client. For RSC / SSR, set it on <html> in your
   * root layout to avoid a flash of wrong theme:
   *
   *   <html lang="en" data-theme="dark">
   *
   * Values: "light" | "dark" | omitted (defaults to light dark = system)
   */
  :where(html[data-theme="light"]) {
    color-scheme: light;
  }

  :where(html[data-theme="dark"]) {
    color-scheme: dark;
  }

  :where(html:not([data-theme])) {
    color-scheme: light dark;
  }

  /* ===========================================================================
     Media Theme Baseline
     =========================================================================== */

  /*
   * color-scheme flip for [data-*-media] — makes light-dark() base
   * tokens resolve correctly on inverted surfaces without a theme.
   * Token overrides (text/icon/accent) are theme-level (generateOnMediaCSS).
   * Dual-prefix (astryx + legacy xds) during the compat window.
   */
  :where([data-astryx-media="dark"]) {
    color-scheme: dark;
  }

  :where([data-astryx-media="light"]) {
    color-scheme: light;
  }
}
