packages:
  - 'apps/*'
  # Example apps are standalone templates for the community to copy — they are
  # never built in-repo, so they stay out of the workspace and pin their own
  # dependency versions instead of using workspace protocols like catalog:.
  - '!apps/example-*'
  - 'packages/*'
  - 'packages/themes/*'
  - 'internal/*'

# Migrated from .npmrc: pnpm 11 reads these hoisting/linker settings from
# pnpm-workspace.yaml, not .npmrc. Keeps the flat, Yarn-1-style node_modules
# layout that build tools (and some phantom test imports) rely on.
nodeLinker: hoisted
shamefullyHoist: true
linkWorkspacePackages: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@astryxdesign/*'

# Single source of truth for the workspace's vite version: every consumer
# (root test config, packages/build) declares "vite": "catalog:", so a bump
# lands here once and cannot split the workspace across two vite majors.
# vite 8 requires @vitejs/plugin-react >= 5 (4.x peers stop at vite 7) —
# bump them together. The standalone example apps and the vibe-tests
# preview app pin their own vite; keep them on the same major by hand.
catalog:
  vite: ^8.1.3

# Moved from package.json's "pnpm" field: pnpm 11 no longer reads
# pnpm.overrides / pnpm.onlyBuiltDependencies from package.json.
overrides:
  '@stylexjs/stylex': ^0.19.0
  prettier: ^3.9.3
  postcss: ^8.5.18
  picomatch: ^4.0.4
  micromatch>picomatch: ^2.3.2
  anymatch>picomatch: ^2.3.2
  minimatch: ^9.0.7
  dompurify: ^3.4.12
  tmp: '>=0.2.6'
  esbuild: '>=0.28.1'
  '@babel/core': ^7.29.6
  hono: ^4.12.25
  # @modelcontextprotocol/sdk 1.x resolves @hono/node-server ^1, which is
  # vulnerable to path traversal in serve-static on Windows via encoded
  # backslashes (%5C). Patched only in 2.0.5 — a semver-major the sdk's ^1
  # range can never reach on its own. The sdk only calls getRequestListener
  # (with overrideGlobalObjects), which 2.x exports unchanged, and 2.x peers
  # on hono ^4 — already held above. Drop this entry once the sdk depends on
  # @hono/node-server 2.x itself.
  '@hono/node-server': ^2.0.5
  # read-yaml-file 1.x is hard-wired to js-yaml 3.x (`safeLoad`), which has no
  # fix for CVE-2026-53550 — patched only in js-yaml 4.2.0. Overriding js-yaml
  # alone breaks it (4.x renamed safeLoad -> load), so lift the package instead:
  # read-yaml-file 2.x calls `load` and depends on js-yaml ^4. Its only consumer
  # is @manypkg/get-packages, and 2.x keeps the same CJS surface (default export
  # + .sync). The floor below then holds that chain on the patched 4.x line.
  read-yaml-file: ^2.1.0
  read-yaml-file>js-yaml: ^4.2.0
  # Constrain to 4.x — the 5.x line has DoS vulnerabilities (GHSA-pm4m-ph32-ghv5,
  # GHSA-724g-mxrg-4qvm) patched only in 5.2.2. @changesets/parse declares ^4.1.1
  # anyway, so keep it on 4.x where the advisory does not apply.
  '@changesets/parse>js-yaml': ^4.2.0
  fast-uri: ^3.1.4
  brace-expansion: ^2.1.2
  # next pulls sharp as an optional dependency for image optimization and still
  # resolves 0.34.5, which inherits the libvips advisories CVE-2026-33327,
  # CVE-2026-33328, CVE-2026-35590 and CVE-2026-35591. They are patched in
  # sharp 0.35.0 — a semver-major bump on the 0.x line, so next's `^0.34`
  # range can never reach it on its own. Drop this entry once next depends on
  # 0.35 itself.
  sharp: ^0.35.3

# pnpm 11 replaced the onlyBuiltDependencies allowlist with an allowBuilds map
# (managed via `pnpm approve-builds`). These are the same packages previously
# trusted to run install/build scripts under pnpm 10's onlyBuiltDependencies.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  puppeteer: true
  sharp: true
