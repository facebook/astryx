<!-- docs: Arrange related content vertically or horizontally with tokenized spacing. -->
<!-- variant: vertical -->
<div class="ax-stack ax-stack--gap-3">
  <span class="ax-text">First item</span>
  <span class="ax-text">Second item</span>
</div>

<!-- variant: horizontal-wrap -->
<div class="ax-stack ax-stack--horizontal ax-stack--wrap ax-stack--gap-2">
  <span class="ax-badge">One</span>
  <span class="ax-badge">Two</span>
  <span class="ax-badge">Three</span>
</div>
