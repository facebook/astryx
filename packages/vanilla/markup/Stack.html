<!-- docs: Use the default vertical Stack as a VStack and the horizontal modifier as an HStack; prefer Stack over Layout for simple directional flow. -->
<!-- variant: vstack -->
<div class="ax-stack ax-stack--vertical ax-stack--gap-3">
  <span class="ax-text">VStack flows top to bottom.</span>
  <span class="ax-text">Choose a tokenized gap instead of child margins.</span>
</div>

<!-- variant: hstack-wrap -->
<div class="ax-stack ax-stack--horizontal ax-stack--wrap ax-stack--gap-2">
  <span class="ax-badge">HStack item one</span>
  <span class="ax-badge">HStack item two</span>
  <span class="ax-badge">HStack item three</span>
</div>
