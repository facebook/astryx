<!-- docs: Trigger an action with primary, secondary, ghost, or destructive emphasis. -->
<!-- variant: primary -->
<button class="ax-button ax-button--primary" type="button">Continue</button>

<!-- variant: secondary -->
<button class="ax-button ax-button--secondary" type="button">Cancel</button>

<!-- variant: ghost -->
<button class="ax-button ax-button--ghost" type="button">Learn more</button>

<!-- variant: destructive -->
<button class="ax-button ax-button--destructive" type="button">Delete</button>

<!-- variant: disabled -->
<button class="ax-button ax-button--primary" type="button" disabled>
  Continue
</button>
