<!-- docs: Toggle an on-or-off setting that takes effect immediately. -->
<!-- variant: default -->
<label class="ax-switch">
  <input class="ax-switch__control" type="checkbox" role="switch" />
  <span class="ax-switch__track" aria-hidden="true"
    ><span class="ax-switch__thumb"></span
  ></span>
  <span class="ax-switch__content">
    <span class="ax-switch__label">Enable notifications</span>
    <span class="ax-switch__description"
      >Receive alerts for important changes.</span
    >
  </span>
</label>

<!-- variant: checked -->
<label class="ax-switch">
  <input class="ax-switch__control" type="checkbox" role="switch" checked />
  <span class="ax-switch__track" aria-hidden="true"
    ><span class="ax-switch__thumb"></span
  ></span>
  <span class="ax-switch__content">
    <span class="ax-switch__label">Dark mode</span>
  </span>
</label>

<!-- variant: compact -->
<label class="ax-switch ax-switch--sm">
  <input class="ax-switch__control" type="checkbox" role="switch" checked />
  <span class="ax-switch__track" aria-hidden="true"
    ><span class="ax-switch__thumb"></span
  ></span>
  <span class="ax-switch__content">
    <span class="ax-switch__label">Compact navigation</span>
  </span>
</label>

<!-- variant: label-start-spread -->
<label class="ax-switch ax-switch--label-start ax-switch--spread">
  <input class="ax-switch__control" type="checkbox" role="switch" />
  <span class="ax-switch__track" aria-hidden="true"
    ><span class="ax-switch__thumb"></span
  ></span>
  <span class="ax-switch__content">
    <span class="ax-switch__label">Share activity status</span>
  </span>
</label>
