<!-- docs: Preview the shape of loading content; hide decorative placeholders and mark the surrounding region busy. -->
<!-- variant: profile-row -->
<div
  class="ax-stack ax-stack--horizontal ax-stack--gap-3"
  aria-busy="true"
  aria-label="Loading profile">
  <span class="ax-skeleton ax-skeleton--avatar" aria-hidden="true"></span>
  <span class="ax-stack ax-stack--gap-2" style="flex: 1">
    <span
      class="ax-skeleton ax-skeleton--text ax-skeleton--short"
      aria-hidden="true"></span>
    <span class="ax-skeleton ax-skeleton--text" aria-hidden="true"></span>
  </span>
</div>

<!-- variant: card -->
<div
  class="ax-stack ax-stack--gap-3"
  aria-busy="true"
  aria-label="Loading summary">
  <span class="ax-skeleton ax-skeleton--card" aria-hidden="true"></span>
  <span class="ax-skeleton ax-skeleton--text" aria-hidden="true"></span>
  <span
    class="ax-skeleton ax-skeleton--text ax-skeleton--short"
    aria-hidden="true"></span>
</div>
