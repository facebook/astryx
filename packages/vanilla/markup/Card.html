<!-- docs: Group related content in a bordered or elevated surface. -->
<!-- variant: default -->
<article class="ax-card">
  <header class="ax-card__header">
    <h2 class="ax-heading ax-heading--3">Card title</h2>
  </header>
  <div class="ax-card__body"><p class="ax-text">Card content</p></div>
</article>

<!-- variant: elevated -->
<article class="ax-card ax-card--elevation-low">
  <div class="ax-card__body"><p class="ax-text">Elevated card</p></div>
  <footer class="ax-card__footer">
    <button class="ax-button ax-button--primary">Action</button>
  </footer>
</article>
