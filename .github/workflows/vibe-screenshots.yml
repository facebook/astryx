name: Vibe Test Screenshots

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Comma-separated iteration IDs to screenshot'
        required: true
      prompts:
        description: 'Comma-separated prompt IDs (optional, defaults to all)'
        required: false
        default: ''
      deploy_to_gh_pages:
        description: 'Deploy screenshots to gh-pages (default: true)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      report_iteration:
        description: 'Primary iteration ID for report path (default: first in iterations list)'
        required: false
        default: ''

concurrency:
  group: vibe-screenshots-${{ github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-previews:
    name: Build Previews
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup

      - name: Build core packages
        run: pnpm build

      - name: Build preview HTML files
        run: |
          cd internal/vibe-tests
          PROMPT_ARG=""
          if [ -n "${{ github.event.inputs.prompts }}" ]; then
            PROMPT_ARG="--prompts ${{ github.event.inputs.prompts }}"
          fi
          npx tsx src/build-previews.ts \
            --iterations "${{ github.event.inputs.iterations }}" \
            $PROMPT_ARG

      # The iteration manifests carry each iteration's target, which the axe
      # scan needs to pick that iteration's own renders out of the shared
      # previews directory; the result code lets it stamp each entry with a
      # hash of the code it rendered, so scoring can spot a stale sidecar
      - name: Upload preview HTML
        uses: actions/upload-artifact@v7
        with:
          name: preview-html
          path: |
            internal/vibe-tests/results/*/previews/
            internal/vibe-tests/results/*/manifest.json
            internal/vibe-tests/results/*/results/*.tsx
          retention-days: 90

  screenshot:
    name: Capture Screenshots
    needs: build-previews
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Download preview HTML
        uses: actions/download-artifact@v8
        with:
          name: preview-html
          path: internal/vibe-tests/results/

      - name: Screenshot all previews
        run: |
          cd internal/vibe-tests
          npx tsx src/screenshot-previews.ts \
            --iterations "${{ github.event.inputs.iterations }}"

      - name: Axe-scan all previews
        run: |
          cd internal/vibe-tests
          npx tsx src/axe-previews.ts \
            --iterations "${{ github.event.inputs.iterations }}"

      - name: Upload axe results
        uses: actions/upload-artifact@v7
        with:
          name: axe-results
          path: internal/vibe-tests/results/*/axe-results.json
          retention-days: 90

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: vibe-test-screenshots
          path: internal/vibe-tests/results/*/screenshots/
          retention-days: 90

      - name: Upload screenshot manifest
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-manifest
          path: internal/vibe-tests/results/*/screenshots/manifest.json
          retention-days: 90

  deploy-screenshots:
    name: Deploy Screenshots to gh-pages
    needs: screenshot
    if: ${{ github.event.inputs.deploy_to_gh_pages != 'false' }}
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v7

      - name: Determine report iteration
        id: report-id
        run: |
          # Use explicit report_iteration input, or fall back to first in the list
          REPORT_ID="${{ github.event.inputs.report_iteration }}"
          if [ -z "$REPORT_ID" ]; then
            REPORT_ID=$(echo "${{ github.event.inputs.iterations }}" | cut -d',' -f1)
          fi
          echo "id=$REPORT_ID" >> "$GITHUB_OUTPUT"
          echo "Report iteration: $REPORT_ID"

      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          name: vibe-test-screenshots
          path: /tmp/screenshots

      - name: Download screenshot manifest
        uses: actions/download-artifact@v8
        with:
          name: screenshot-manifest
          path: /tmp/manifests

      - name: Deploy screenshots to report directory
        env:
          REPORT_ID: ${{ steps.report-id.outputs.id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node .github/scripts/gh-pages-publisher.mjs vibe-screenshots
          --report-id "$REPORT_ID"
          --screenshots /tmp/screenshots
          --manifests /tmp/manifests
