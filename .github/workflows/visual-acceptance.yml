# Required status and explicit human decision for stable visual changes.
# This workflow never checks out or executes PR-controlled code. It runs the
# default-branch implementation, resolves the current PR head through GitHub,
# and stores the signed decision beside trusted, immutable evidence on gh-pages.

name: Visual acceptance

on:
  pull_request_target:
    branches: ['main']
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  initialize:
    if: github.event_name == 'pull_request_target'
    concurrency:
      group: visual-acceptance-head-${{ github.event.pull_request.head.repo.id }}-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@v7

      - name: Classify scope and initialize the required status
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const {spawnSync} = require('node:child_process');
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const manifestPaths = new Set();
            for (const {filename} of files) {
              const theme = filename.match(/^packages\/themes\/([^/]+)\//);
              const pkg = filename.match(/^packages\/([^/]+)\//);
              if (theme) manifestPaths.add(`packages/themes/${theme[1]}/package.json`);
              else if (pkg) manifestPaths.add(`packages/${pkg[1]}/package.json`);
            }
            const manifests = {};
            const [headOwner, headRepo] = pr.head.repo.full_name.split('/');
            for (const manifestPath of manifestPaths) {
              try {
                const {data} = await github.rest.repos.getContent({
                  owner: headOwner, repo: headRepo, path: manifestPath, ref: pr.head.sha,
                });
                if (!Array.isArray(data) && data.content) {
                  manifests[manifestPath] = JSON.parse(Buffer.from(data.content, 'base64').toString());
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            fs.writeFileSync('visual-scope-manifests.json', JSON.stringify(manifests));
            const result = spawnSync(
              process.execPath,
              ['.github/scripts/visual-scope.mjs', '--manifests', 'visual-scope-manifests.json'],
              {input: `${files.map((file) => file.filename).join('\n')}\n`, encoding: 'utf8'},
            );
            if (result.status !== 0) {
              core.setFailed(result.stderr || 'Stable visual scope classification failed.');
              return;
            }
            const scope = JSON.parse(result.stdout);
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: pr.head.sha,
              context: 'visual-acceptance',
              state: scope.hasStableVisual ? 'pending' : 'success',
              description: scope.hasStableVisual
                ? 'Stable visual capture is still running.'
                : 'No stable visual scope.',
            });

  authorize:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/accept-visual')
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      resolved: ${{ steps.authorize.outputs.resolved }}
      valid: ${{ steps.authorize.outputs.valid }}
      refusal: ${{ steps.authorize.outputs.refusal }}
      pr: ${{ steps.authorize.outputs.pr }}
      head: ${{ steps.authorize.outputs.head }}
      head_repo_id: ${{ steps.authorize.outputs.head_repo_id }}
      head_ref: ${{ steps.authorize.outputs.head_ref }}
      run_id: ${{ steps.authorize.outputs.run_id }}
      run_attempt: ${{ steps.authorize.outputs.run_attempt }}
      approver: ${{ steps.authorize.outputs.approver }}
      approver_id: ${{ steps.authorize.outputs.approver_id }}
      permission: ${{ steps.authorize.outputs.permission }}
      effective_permission: ${{ steps.authorize.outputs.effective_permission }}
      role_name: ${{ steps.authorize.outputs.role_name }}
      comment_id: ${{ steps.authorize.outputs.comment_id }}
      reason: ${{ steps.authorize.outputs.reason }}
    steps:
      # This job is deliberately read-only. The mutation job acquires the shared
      # head-branch lock using these trusted API-derived outputs.
      - name: Checkout trusted default-branch code
        uses: actions/checkout@v7

      - name: Authorize and resolve the decision
        id: authorize
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const {pathToFileURL} = require('node:url');
            const {
              isVisualAcceptanceEndpointMaintainer,
              visualAcceptanceIdentity,
            } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/visual-gate/authorization.mjs`).href,
            );
            const {owner, repo} = context.repo;
            const number = context.issue.number;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (!pr.head.repo?.id || !pr.head.ref) {
              core.setFailed('The pull request head repository or branch is unavailable.');
              return;
            }
            core.setOutput('resolved', 'true');
            core.setOutput('pr', String(number));
            core.setOutput('head', pr.head.sha);
            core.setOutput('head_repo_id', String(pr.head.repo.id));
            core.setOutput('head_ref', pr.head.ref);
            const refuse = (message) => {
              core.setOutput('valid', 'false');
              core.setOutput('refusal', message);
            };
            const body = context.payload.comment.body.trim();
            const match = body.match(/^\/accept-visual\s+(\d+)\/(\d+)\s+([\s\S]+)$/);
            if (!match) {
              refuse('copy the exact `/accept-visual <run>/<attempt> <reason>` command from the report.');
              return;
            }
            const runId = Number(match[1]);
            const runAttempt = Number(match[2]);
            const reason = match[3].trim();
            if (reason.length < 12 || reason.length > 500 ||
                /^(looks? good|intentional|approved|accept(ed)?|lgtm)[.! ]*$/i.test(reason)) {
              refuse('the reason must explain why the pixels are correct (12–500 characters).');
              return;
            }
            if (pr.state !== 'open' || pr.base.ref !== 'main') {
              refuse('the pull request is not open against `main`.');
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, event: 'pull_request', head_sha: pr.head.sha, per_page: 100,
            });
            const latestCI = runs
              .filter((run) => run.name === 'CI')
              .sort((a, b) => b.id - a.id)[0];
            if (!latestCI || latestCI.id !== runId || latestCI.run_attempt !== runAttempt ||
                latestCI.status !== 'completed') {
              refuse('that evidence is not from the latest completed CI attempt for this head.');
              return;
            }
            let identity = visualAcceptanceIdentity();
            try {
              const response = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: context.actor,
              });
              identity = visualAcceptanceIdentity(response.data);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!isVisualAcceptanceEndpointMaintainer(identity)) {
              refuse('only a repository maintainer may accept stable visual changes.');
              return;
            }
            core.setOutput('valid', 'true');
            core.setOutput('run_id', String(runId));
            core.setOutput('run_attempt', String(runAttempt));
            core.setOutput('approver', context.actor);
            core.setOutput('approver_id', String(context.payload.comment.user.id));
            core.setOutput('permission', identity.permission);
            core.setOutput('effective_permission', identity.effectivePermission);
            core.setOutput('role_name', identity.roleName ?? '');
            core.setOutput('comment_id', String(context.payload.comment.id));
            core.setOutput('reason', reason);

  accept:
    needs: authorize
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.resolved == 'true'
    concurrency:
      group: visual-acceptance-head-${{ needs.authorize.outputs.head_repo_id }}-${{ needs.authorize.outputs.head_ref }}
      cancel-in-progress: false
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Report a refused decision
        if: needs.authorize.outputs.valid != 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr }}
          REFUSAL: ${{ needs.authorize.outputs.refusal }}
        with:
          retries: 3
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `Visual acceptance refused: ${process.env.REFUSAL}`,
            });

      - name: Checkout trusted default-branch code
        if: needs.authorize.outputs.valid == 'true'
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        if: needs.authorize.outputs.valid == 'true'
        uses: ./.github/actions/setup

      - name: Archive the acceptance decision
        id: record
        if: needs.authorize.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr }}
          HEAD_SHA: ${{ needs.authorize.outputs.head }}
          RUN_ID: ${{ needs.authorize.outputs.run_id }}
          RUN_ATTEMPT: ${{ needs.authorize.outputs.run_attempt }}
          APPROVER: ${{ needs.authorize.outputs.approver }}
          APPROVER_ID: ${{ needs.authorize.outputs.approver_id }}
          PERMISSION: ${{ needs.authorize.outputs.permission }}
          EFFECTIVE_PERMISSION: ${{ needs.authorize.outputs.effective_permission }}
          ROLE_NAME: ${{ needs.authorize.outputs.role_name }}
          COMMENT_ID: ${{ needs.authorize.outputs.comment_id }}
          REASON: ${{ needs.authorize.outputs.reason }}
        run: |
          set -eu
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PAGES="$RUNNER_TEMP/visual-acceptance-pages"
          DEST="visual-gate/acceptances/${PR_NUMBER}/${HEAD_SHA}"
          for attempt in 1 2 3 4 5; do
            rm -rf "$PAGES"
            git clone --depth=1 --single-branch --branch gh-pages "$REPO_URL" "$PAGES"
            node .github/scripts/visual-gate/visual-acceptance.mjs accept \
              --pages "$PAGES" \
              --pr "$PR_NUMBER" \
              --head "$HEAD_SHA" \
              --run-id "$RUN_ID" \
              --run-attempt "$RUN_ATTEMPT" \
              --approver "$APPROVER" \
              --approver-id "$APPROVER_ID" \
              --permission "$PERMISSION" \
              --effective-permission "$EFFECTIVE_PERMISSION" \
              --role-name "$ROLE_NAME" \
              --comment-id "$COMMENT_ID" \
              --reason "$REASON"
            if [ -z "$(git -C "$PAGES" status --porcelain -- "$DEST")" ]; then
              echo "The current visual bundle was already accepted."
              exit 0
            fi
            git -C "$PAGES" config user.name "github-actions[bot]"
            git -C "$PAGES" config user.email "github-actions[bot]@users.noreply.github.com"
            git -C "$PAGES" add "$DEST"
            git -C "$PAGES" commit -m "visual acceptance: PR #${PR_NUMBER} at ${HEAD_SHA}"
            if git -C "$PAGES" push origin gh-pages; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Could not archive visual acceptance after 5 attempts"
          exit 1

      - name: Reconcile acceptance against the latest published evidence
        id: reconcile
        if: steps.record.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr }}
          HEAD_SHA: ${{ needs.authorize.outputs.head }}
        run: |
          FRESH="$RUNNER_TEMP/visual-acceptance-reconcile"
          rm -rf "$FRESH"
          git clone --depth=1 --single-branch --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$FRESH"
          node .github/scripts/visual-gate/visual-acceptance.mjs state \
            --pages "$FRESH" --pr "$PR_NUMBER" --head "$HEAD_SHA" > acceptance-state.json
          node - <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('acceptance-state.json', 'utf8'));
          for (const key of ['state', 'reason', 'description']) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${state[key]}\n`);
          }
          NODE

      - name: Project the reconciled decision onto the PR
        if: steps.reconcile.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr }}
          HEAD_SHA: ${{ needs.authorize.outputs.head }}
          ACCEPTED_RUN_ID: ${{ needs.authorize.outputs.run_id }}
          ACCEPTED_RUN_ATTEMPT: ${{ needs.authorize.outputs.run_attempt }}
          ACCEPTANCE_STATE: ${{ steps.reconcile.outputs.state }}
          ACCEPTANCE_REASON: ${{ steps.reconcile.outputs.reason }}
          ACCEPTANCE_DESCRIPTION: ${{ steps.reconcile.outputs.description }}
        with:
          retries: 3
          script: |
            const {owner, repo} = context.repo;
            const pr = Number(process.env.PR_NUMBER);
            const head = process.env.HEAD_SHA;
            let state = process.env.ACCEPTANCE_STATE;
            let reason = process.env.ACCEPTANCE_REASON;
            let description = process.env.ACCEPTANCE_DESCRIPTION;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, event: 'pull_request', head_sha: head, per_page: 100,
            });
            const latestCI = runs
              .filter((run) => run.name === 'CI')
              .sort((a, b) => b.id - a.id)[0];
            const exactRun =
              latestCI &&
              latestCI.id === Number(process.env.ACCEPTED_RUN_ID) &&
              latestCI.run_attempt === Number(process.env.ACCEPTED_RUN_ATTEMPT) &&
              latestCI.status === 'completed';
            if (!exactRun) {
              state = 'pending';
              reason = 'capture';
              description = 'A newer CI attempt must publish trusted visual evidence.';
            }
            const accepted = state === 'success' && reason === 'accepted';
            if (!['success', 'pending', 'failure'].includes(state)) {
              core.setFailed('Reconciled visual acceptance state is invalid.');
              return;
            }
            const label = 'visual-approved';
            if (accepted) {
              try {
                await github.rest.issues.getLabel({owner, repo, name: label});
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner, repo, name: label, color: '2da44e',
                  description: 'Current visual bundle has an explicit acceptance record',
                });
              }
              await github.rest.issues.addLabels({owner, repo, issue_number: pr, labels: [label]});
            } else {
              try {
                await github.rest.issues.removeLabel({owner, repo, issue_number: pr, name: label});
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: head, context: 'visual-acceptance', state,
              description: description.slice(0, 140),
            });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr,
              body: accepted
                ? `Visual changes accepted for \`${head.slice(0, 12)}\`. A new push invalidates this approval; after merge, the reviewed AFTER frames must reproduce before the baseline is promoted.`
                : `The requested visual evidence is no longer current. Status remains pending; copy the command from the latest report.`,
            });

      - name: Mark an acceptance infrastructure failure
        if: failure() && needs.authorize.outputs.valid == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr }}
          HEAD_SHA: ${{ needs.authorize.outputs.head }}
        with:
          retries: 3
          script: |
            const {owner, repo} = context.repo;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: process.env.HEAD_SHA, context: 'visual-acceptance', state: 'failure',
              description: 'Visual acceptance could not be recorded.',
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: Number(process.env.PR_NUMBER),
              body: 'Visual acceptance could not be recorded. See this workflow run for the rejected invariant or infrastructure error.',
            });
