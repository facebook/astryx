# Builds the standalone CLI runtime (scripts/build-cli-standalone.mjs): the
# published @astryxdesign/cli and @astryxdesign/core packages plus their locked
# dependencies in one tarball. Then it checks the runtime holds exactly those
# packages and runs the CLI's own smoke suites against it, extracted into an
# empty directory with nothing installed.
# Publishes nothing; the tarball is kept as a workflow artifact.
name: CLI Standalone

on:
  pull_request:
    branches: ['main']
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'scripts/build-cli-standalone.mjs'
      - '.github/scripts/cli-standalone-smoke-test.mjs'
      - '.github/scripts/cli-smoke-test.mjs'
      - '.github/scripts/cli-json-smoke-test.mjs'
      - '.github/workflows/cli-standalone.yml'

permissions: {}

concurrency:
  group: 'cli-standalone-${{ github.head_ref }}'
  cancel-in-progress: true

jobs:
  standalone:
    runs-on: 4-core-ubuntu
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Packs @astryxdesign/cli and @astryxdesign/core the way `pnpm publish`
      # does (their prepack builds run here), then adds their locked
      # dependencies.
      - name: Build the standalone runtime
        run: node scripts/build-cli-standalone.mjs --out-dir "$RUNNER_TEMP/cli-standalone"

      - name: Test the runtime
        run: node .github/scripts/cli-standalone-smoke-test.mjs "$RUNNER_TEMP"/cli-standalone/astryxdesign-cli-standalone-*.tgz

      - name: Upload the runtime
        uses: actions/upload-artifact@v7
        with:
          name: cli-standalone
          path: |
            ${{ runner.temp }}/cli-standalone/astryxdesign-cli-standalone-*.tgz
            ${{ runner.temp }}/cli-standalone/astryxdesign-cli-standalone-*.tgz.sha256
          retention-days: 14
