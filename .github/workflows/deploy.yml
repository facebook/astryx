# Validate every push to main. Stable docs, Storybook, and Sandbox deploy through
# the Vercel project; this workflow preserves the post-merge test gates only.
name: Main

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions: {}

concurrency:
  group: 'main-validation'
  cancel-in-progress: false

jobs:
  # The one commit every lane and leg of this run tests. A push validates the
  # pushed commit; a dispatch, main's tip when it starts. Each leg resolving
  # `main` itself could straddle a merge, shard different file lists, and skip
  # a file in every leg.
  main-commit:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the commit under test
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            let sha = context.sha;
            if (context.eventName !== 'push') {
              const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
              sha = data.commit.sha;
            }
            core.setOutput('sha', sha);

  # Verify package.json exports match the source tree.
  # Fails if exports are stale — run `node scripts/sync-exports.js` locally to fix.
  sync-exports:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check package.json exports are in sync
        run: node scripts/sync-exports.js --check

  # The push gate, as three parallel lanes joined by `test` below.
  #
  # This was one job running both Vitest projects, a full `pnpm build`, and
  # every package typecheck on a 2-core runner — strictly more than ci.yml's
  # `test`, which was already being terminated around 20 minutes with no
  # summary. Same defect, later surface: main's post-merge gate was over the
  # same budget.
  #
  # Nothing is dropped and nothing runs twice. The two Vitest projects are
  # independent by construction (vitest.config.ts), so they split cleanly; the
  # typecheck needs the `pnpm build` it follows, so they stay together in
  # their own lane and take the build with them.
  #
  # Both Vitest lanes split into four legs, as in ci.yml: one job each ran
  # test-ui in ~18 minutes and test-node in ~28, so main's gate took about half
  # an hour while the PR gate took under fifteen. `test` joins the legs.
  test-ui:
    needs: [main-commit]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: 4-core-ubuntu
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - uses: ./.github/actions/setup

      - name: Run this shard of the UI tests
        run: pnpm test:ui --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Match the PR gate: FR23 needs an idle test runner, not just a new
      # process, so one leg runs it after its own share has exited.
      - name: Run the isolated Markdown benchmark
        if: matrix.shard == 1
        run: pnpm test:ui:isolated

  test-node:
    needs: [main-commit]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Vitest runs one test file per CPU beyond the first, so the 2-core runner
    # ran this suite one file at a time (~23 min). Four cores give it three.
    runs-on: 4-core-ubuntu
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - uses: ./.github/actions/setup

      - run: pnpm test:node --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Visual, accessibility and RTL run on main, not on every pull request update
  # (spec:AST-030 FR12, DEC-7): each push runs ci.yml's canonical release-check
  # on its exact commit and waits for it, so this run reports the result and a
  # failure is fixed forward. This workflow's concurrency group runs one push at
  # a time and keeps only the newest waiting, and a push that main has already
  # moved past leaves its check to the newer push's run.
  heavy-lanes:
    needs: [main-commit]
    if: github.event_name == 'push'
    runs-on: ubuntu-slim
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    steps:
      - name: Run the visual, accessibility and RTL release-check on this commit
        uses: actions/github-script@v9
        env:
          SHA: ${{ needs.main-commit.outputs.sha }}
        with:
          script: |
            const sha = process.env.SHA;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const tip = async () => (await github.rest.repos.getBranch({...context.repo, branch: 'main'})).data.commit.sha;
            if ((await tip()) !== sha) {
              core.notice(`main moved past ${sha.slice(0, 7)}; the newer push's run checks it.`);
              return;
            }
            const since = new Date(Date.now() - 60_000).toISOString();
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'ci.yml',
              ref: 'main',
              inputs: {operation: 'release-check', 'release-branch': 'main', 'expected-head': sha},
            });
            // The dispatch API returns no run id: find the dispatch run made
            // for this commit, then wait for it to finish.
            let run;
            for (let attempt = 0; attempt < 30 && !run; attempt++) {
              await sleep(10_000);
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'ci.yml',
                event: 'workflow_dispatch',
                branch: 'main',
                created: `>=${since}`,
                per_page: 20,
              });
              run = data.workflow_runs.find(candidate => candidate.head_sha === sha);
            }
            if (!run) {
              // A merge that landed as this dispatched makes the dispatch
              // check the newer commit, which that push's run reports.
              if ((await tip()) !== sha) {
                core.notice(`main moved past ${sha.slice(0, 7)} during the dispatch; the newer push's run checks it.`);
                return;
              }
              throw new Error(`No release-check run started for ${sha}.`);
            }
            core.info(`release-check: ${run.html_url}`);
            while (run.status !== 'completed') {
              await sleep(30_000);
              run = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: run.id})).data;
            }
            if (run.conclusion !== 'success') {
              throw new Error(`Visual, accessibility or RTL release-check ${run.conclusion} on ${sha}: ${run.html_url}`);
            }

  # The typecheck mirroring the PR `build` job in ci.yml. ci.yml only runs
  # on pull_request/merge_group, so a typecheck error can land on main (its
  # push only runs the suite) undetected — then break the `build` check on
  # every open PR, which typechecks the PR merged with main (see #3197).
  # Running them here closes that gap and blocks a broken deploy.
  typecheck:
    needs: [main-commit]
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.main-commit.outputs.sha }}

      - uses: ./.github/actions/setup

      - run: pnpm build

      - name: Verify package exports
        run: node scripts/verify-exports.mjs

      # Every workspace package's own `typecheck` script, as in ci.yml.
      - name: Typecheck every package
        run: pnpm typecheck

  # Stable join for the three post-merge validation lanes.
  test:
    needs: [test-ui, test-node, typecheck]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Assert every push gate succeeded
        run: |
          echo "test-ui:    ${{ needs.test-ui.result }}"
          echo "test-node:  ${{ needs.test-node.result }}"
          echo "typecheck:  ${{ needs.typecheck.result }}"
          [ "${{ needs.test-ui.result }}" = "success" ] || exit 1
          [ "${{ needs.test-node.result }}" = "success" ] || exit 1
          [ "${{ needs.typecheck.result }}" = "success" ] || exit 1
