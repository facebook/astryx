# Deploy Storybook + Sandbox to GitHub Pages.
# This workflow is WEBSITE-ONLY — it does not publish to npm. ALL npm publishing
# (both stable `latest` and `canary` prereleases) lives in release.yml, so a
# single npm trusted-publisher config (release.yml) covers everything.
# Only runs on push to main.
#
# Shape: sync-exports, test, and build run in PARALLEL; deploy waits for test
# and build, then only assembles the built artifacts and pushes — it builds
# nothing itself. (The old shape was sequential — test, then a deploy job that
# rebuilt everything from scratch — which put ~13min between a merge and the
# site going live. Building once, in parallel with test, cuts that roughly in
# half while test still gates the actual push.)
#
# Deployment layout on gh-pages:
#   /storybook/    — stable Storybook (always latest main)
#   /sandbox/      — stable Sandbox (always latest main)
#   /pr/<number>/  — PR preview dirs (managed by ci.yml, preserved here)
#   /reports/      — vibe test reports (preserved)
#   /assets/       — landing page CSS
#   /index.html    — landing page
#   /latest        — short hash of latest deploy
#
# Publish model — cheap clean-slate via git plumbing (see "Publish" step):
# Every deploy replaces ONLY the regenerated stable paths (storybook/, sandbox/,
# assets/, index.html, latest, .nojekyll) and carries /pr/ and /reports/ forward
# untouched, then pushes the result as a single ORPHAN commit (no history). This
# keeps three properties at once:
#   A. Deploy time is O(1) in preview count. Earlier this job did
#      `git clone` of all of gh-pages + `cp -r` the whole /pr/ tree forward on
#      every push; once previews grew to ~1GB / tens of thousands of files that
#      copy blew the 15-min job timeout and EVERY main deploy was cancelled
#      (see #4716). We now fetch NO preview blobs — a --filter=blob:none +
#      sparse checkout materializes only the stable paths; /pr/ stays in the
#      index and is reused by SHA.
#   B. No stale-asset accumulation. The stable paths are removed and rewritten
#      each deploy, so superseded content-hashed assets don't pile up (the bug
#      that `keep_files:false` originally fixed in #916).
#   C. No gh-pages history bloat. The single-orphan-commit push is exactly what
#      `force_orphan:true` gave us (#2239 / #2238) — it just no longer requires
#      a full local copy of the tree to produce it. compact-gh-pages.yml remains
#      the weekly backstop.
name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  # Verify package.json exports match the source tree.
  # Fails if exports are stale — run `node scripts/sync-exports.js` locally to fix.
  sync-exports:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check package.json exports are in sync
        run: node scripts/sync-exports.js --check


  test:
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: ./.github/actions/setup

      - run: pnpm test

      - run: pnpm build

      # Typecheck gates mirroring the PR `build` job in ci.yml. ci.yml only runs
      # on pull_request/merge_group, so a typecheck error can land on main (its
      # push only runs `pnpm test`) undetected — then break the `build` check on
      # every open PR, which typechecks the PR merged with main (see #3197).
      # Running them here closes that gap and blocks a broken deploy.
      - name: Verify package exports
        run: node scripts/verify-exports.mjs

      - name: Typecheck component docs
        run: pnpm -F @astryxdesign/core typecheck:docs

      - name: Typecheck lab docs
        run: pnpm -F @astryxdesign/lab typecheck:docs

      - name: Typecheck charts docs
        run: pnpm -F @astryxdesign/charts typecheck:docs

      - name: Typecheck template docs
        run: pnpm -F @astryxdesign/cli typecheck:template-docs

      # Full-package strict checkJs over the CLI (src, bin, scripts, docs, and
      # the emitted templates). Requires the `pnpm build` above so the template
      # .tsx sources can resolve the built @astryxdesign/{core,charts,lab} types.
      - name: Typecheck CLI (strict)
        run: pnpm -F @astryxdesign/cli typecheck:strict

      - name: Typecheck storybook
        run: pnpm -F @astryxdesign/storybook typecheck

      - name: Typecheck core (including tests)
        run: pnpm -F @astryxdesign/core typecheck

  # Build everything the site needs, in parallel with `test`. The results are
  # handed to `deploy` as artifacts, so a broken test run never publishes —
  # test still gates the push, it just no longer serializes the build.
  build:
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup

      - name: Build core package
        run: pnpm build

      - name: Build Storybook
        run: pnpm -F @astryxdesign/storybook build

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/sandbox/.next/cache
          # IMPORTANT: no restore-keys fallback. The key is pinned to the
          # @astryxdesign/core dist hash because the Next.js module cache bakes in the
          # resolved export graph of @astryxdesign/core. A loose restore-keys fallback
          # (e.g. "nextjs-sandbox-<lock>-") would let a build restore a cache
          # produced against a DIFFERENT export shape. That is exactly what
          # broke the post-merge deploy of the XDS un-prefix migration (#2941):
          # the migration changed core's exports (bare names, new subpaths), the
          # exact key missed, and restore-keys fell back to a pre-migration
          # cache whose compiled modules still expected XDS*-prefixed exports —
          # producing "'Text' is not exported from '@astryxdesign/core/Text'" and
          # "Element type is invalid ... undefined" prerender failures.
          # A changed key now yields a COLD cache (safe rebuild) instead of a
          # poisoned warm one.
          #
          # PR builds (ci.yml) deliberately use a different, PR-scoped key:
          # they build with a per-PR basePath (/<repo>/pr/<n>/sandbox), and a
          # basePath change makes Next.js invalidate the webpack cache — so a
          # cache shared with this main build would never actually warm a PR.
          key: nextjs-sandbox-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/core/dist/**') }}

      - name: Build Sandbox
        run: pnpm -F @astryxdesign/sandbox build
        env:
          # GitHub Pages serves this project at <owner>.github.io/<repo>/, so the
          # sandbox must be built with the repo name as a base path prefix —
          # otherwise its root-absolute asset URLs (/sandbox/_next/...) drop the
          # /<repo> segment and 404. Derived from the repo name so it survives renames.
          SANDBOX_BASE_PATH: /${{ github.event.repository.name }}/sandbox
          NODE_OPTIONS: '--max-old-space-size=4096'

      # The landing page (assembled in `deploy`) links these straight out of
      # the built tree, which deploy no longer has — stage them as an artifact.
      - name: Stage landing page assets
        run: |
          mkdir -p site-assets
          cp packages/core/dist/astryx.css site-assets/astryx.css
          cp packages/core/src/reset.css site-assets/reset.css
          cp packages/themes/neutral/dist/theme.css site-assets/theme.css

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v7
        with:
          name: deploy-storybook
          path: apps/storybook/dist/
          retention-days: 1

      - name: Upload Sandbox artifact
        uses: actions/upload-artifact@v7
        with:
          name: deploy-sandbox
          path: apps/sandbox/out/
          retention-days: 1

      - name: Upload landing assets artifact
        uses: actions/upload-artifact@v7
        with:
          name: deploy-assets
          path: site-assets/
          retention-days: 1

  deploy:
    needs: [test, build]
    if: always() && !cancelled() && needs.test.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Download Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: deploy-storybook
          path: storybook-dist

      - name: Download Sandbox artifact
        uses: actions/download-artifact@v8
        with:
          name: deploy-sandbox
          path: sandbox-dist

      - name: Download landing assets artifact
        uses: actions/download-artifact@v8
        with:
          name: deploy-assets
          path: site-assets

      - name: Prepare stable site content
        run: |
          SHORT_HASH="${GITHUB_SHA:0:7}"

          # Assemble the regenerated stable paths into ./staged — everything the
          # deploy owns EXCEPT /pr/ and /reports/, which live on gh-pages and are
          # carried forward untouched by the Publish step below.
          rm -rf staged
          mkdir -p staged/storybook staged/sandbox staged/assets
          cp -r storybook-dist/* staged/storybook/
          if [ -d "sandbox-dist" ]; then
            cp -r sandbox-dist/* staged/sandbox/
          fi

          # Astryx CSS for the landing page, staged by the build job
          cp site-assets/astryx.css staged/assets/astryx.css
          cp site-assets/reset.css staged/assets/reset.css
          cp site-assets/theme.css staged/assets/theme.css

          cat > staged/index.html << 'LANDING_EOF'
          <!DOCTYPE html>
          <html lang="en" data-astryx-theme="neutral">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Astryx Design System</title>
            <link rel="stylesheet" href="assets/reset.css">
            <link rel="stylesheet" href="assets/astryx.css">
            <link rel="stylesheet" href="assets/theme.css">
            <style>
              body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--color-background-body);
                font-family: var(--font-family-body);
                color: var(--color-text-primary);
              }
              .container {
                max-width: 480px;
                width: 100%;
                padding: var(--spacing-6);
              }
              h1 { font-size: var(--text-heading-1-size); font-weight: var(--font-weight-semibold); margin-bottom: var(--spacing-2); }
              p { color: var(--color-text-secondary); margin-bottom: var(--spacing-6); font-size: var(--text-body-size); line-height: 1.5; }
              .links { display: flex; flex-direction: column; gap: var(--spacing-3); }
              a.card {
                display: flex; align-items: center; justify-content: space-between;
                padding: var(--spacing-4);
                background: var(--color-background-card);
                border-radius: var(--radius-element);
                box-shadow: var(--shadow-low);
                text-decoration: none;
                color: var(--color-text-primary);
                transition: box-shadow 0.15s ease;
              }
              a.card:hover { box-shadow: var(--shadow-med); }
              .card-title { font-weight: var(--font-weight-semibold); }
              .card-desc { font-size: var(--text-supporting-size); color: var(--color-text-secondary); margin-top: 2px; }
              .arrow { color: var(--color-text-secondary); font-size: 1.25rem; }
              .hash { font-family: var(--font-family-code); font-size: var(--text-supporting-size); color: var(--color-text-secondary); margin-top: var(--spacing-4); text-align: center; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Astryx Design System</h1>
              <p>Component library for building internal tools. Select an environment below.</p>
              <div class="links">
                <a class="card" href="storybook/index.html">
                  <div>
                    <div class="card-title">📖 Storybook</div>
                    <div class="card-desc">Component docs, props, and interactive examples</div>
                  </div>
                  <span class="arrow">→</span>
                </a>
                <a class="card" href="sandbox/index.html">
                  <div>
                    <div class="card-title">🏗️ Sandbox</div>
                    <div class="card-desc">Full app demo with theme editor</div>
                  </div>
                  <span class="arrow">→</span>
                </a>
                <a class="card" href="https://github.com/facebook/astryx">
                  <div>
                    <div class="card-title">💻 GitHub</div>
                    <div class="card-desc">Source code, issues, and wiki</div>
                  </div>
                  <span class="arrow">→</span>
                </a>
              </div>
              <div class="hash">Build: DEPLOY_HASH_PLACEHOLDER</div>
            </div>
          </body>
          </html>
          LANDING_EOF

          # Inject the short hash into the landing page
          sed -i "s|DEPLOY_HASH_PLACEHOLDER|${SHORT_HASH}|" staged/index.html

          # Write the latest deployed hash (used by PR comment links, etc.)
          echo -n "${SHORT_HASH}" > staged/latest

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Carry /pr/ and /reports/ forward WITHOUT downloading or copying them
          # (>1GB / tens of thousands of files). See the header comment for the
          # full rationale:
          #   --filter=blob:none  → clone fetches trees but NO file contents
          #   sparse-checkout     → only the stable paths are materialized;
          #                         every other path (/pr/, /reports/,
          #                         /visual-gate/) stays in the index as a
          #                         skip-worktree entry (never written out)
          #   git write-tree      → rebuilds the full tree from the index, so
          #                         those paths are reused by SHA
          #
          # This is an allow-BY-DEFAULT mechanism: anything outside the cone
          # below survives automatically. Adding a path to the sparse-checkout
          # set makes it a MANAGED path, wiped and republished each deploy — so
          # never add a path that another workflow owns. /visual-gate/ holds the
          # visual-regression baseline (owned by visual-baseline.yml); wiping it
          # would silently disarm the release gate.
          #   commit-tree (no -p) → one ORPHAN commit == force_orphan, produced
          #                         without a full local copy of gh-pages
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          WORK_DIR="$PWD"
          MAX_ATTEMPTS=5

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "::group::Publish attempt $attempt of $MAX_ATTEMPTS"
            cd "$WORK_DIR"
            rm -rf /tmp/ghp

            # Partial + no-checkout clone: fetches commits and trees, but no blobs.
            git clone --filter=blob:none --no-checkout --depth=1 \
              --single-branch --branch gh-pages "$REPO_URL" /tmp/ghp
            cd /tmp/ghp
            OLD_HEAD="$(git rev-parse HEAD)"

            # Materialize ONLY the stable paths (cone mode also keeps root files
            # like index.html/latest/.nojekyll). /pr/ & /reports/ are left as
            # skip-worktree index entries — never fetched, never written.
            git sparse-checkout init --cone
            git sparse-checkout set storybook sandbox assets
            git checkout gh-pages

            # Clean-replace the stable paths so superseded content-hashed assets
            # don't accumulate (the bug keep_files:false originally fixed).
            rm -rf storybook sandbox assets index.html latest
            cp -r "$WORK_DIR"/staged/. ./
            touch .nojekyll

            # git add -A respects skip-worktree, so /pr/, /reports/ and
            # /visual-gate/ are NOT staged for deletion — they stay in the
            # index and are carried forward by write-tree.
            git add -A
            if git diff --cached --quiet; then
              echo "Nothing to publish"; echo "::endgroup::"; exit 0
            fi

            TREE="$(git write-tree)"
            COMMIT="$(git commit-tree "$TREE" -m "Deploy ${GITHUB_SHA:0:7} to GitHub Pages")"

            # force-with-lease guards against a concurrent gh-pages writer
            # (another main deploy or a PR-preview push); on a lost race we
            # re-clone the fresh tip and replay, so no update is clobbered.
            if git push origin \
                 "--force-with-lease=refs/heads/gh-pages:${OLD_HEAD}" \
                 "${COMMIT}:refs/heads/gh-pages"; then
              echo "Published on attempt $attempt (orphan ${COMMIT:0:7})"
              echo "::endgroup::"
              exit 0
            fi

            echo "Push rejected (concurrent gh-pages update) — retrying in $((attempt * 2))s"
            echo "::endgroup::"
            sleep $((attempt * 2))
          done

          echo "::error::Failed to publish to gh-pages after ${MAX_ATTEMPTS} attempts"
          exit 1
