# Promote captured shots into the visual baseline — the "the after is correct"
# outcome of the release gate, made explicit.
#
# Separate from release-gate.yml on purpose. The gate only ever READS the
# baseline; this is the one workflow that writes it, it runs only when a human
# or the release cut dispatches it, and it refuses to run without a reason.
# Every promotion appends to the decision log in the baseline manifest (who,
# when, which run, why, which shots), so any baseline can be read back to the
# change that justified it.
#
# Shots are promoted OUT OF A SPECIFIC GATE RUN's capture artifact, never
# re-captured here: the picture that becomes the baseline is exactly the
# picture that was reviewed.
#
# Typical uses:
#   keys=core-button--default__y2k-light,core-badge--solid__y2k-light
#     reason="Y2K button radius went square on purpose (#5123)"
#   keys=all reason="Playwright chromium bump — every shot re-rendered"

name: Visual Baseline

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Release Gate run id whose capture to promote from'
        required: true
      keys:
        description: 'Comma-separated shot keys, or "all"'
        required: true
      reason:
        description: 'Why the new rendering is the correct one'
        required: true
      prune:
        description: 'Also drop baseline shots whose story no longer exists'
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: visual-baseline
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read # download-artifact from another run
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup

      - name: Download the capture being promoted
        uses: actions/download-artifact@v8
        with:
          name: visual-capture
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: .visual-run

      - name: Fetch the current baseline
        run: |
          set -eu
          rm -rf /tmp/gh-pages
          git clone --depth=1 --filter=blob:none --sparse --single-branch --branch gh-pages \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages
          git -C /tmp/gh-pages sparse-checkout set visual-gate/baseline
          mkdir -p /tmp/gh-pages/visual-gate/baseline

      - name: Promote
        env:
          KEYS: ${{ inputs.keys }}
          REASON: ${{ inputs.reason }}
          PROMOTER: ${{ github.actor }}
        run: |
          set -eu
          node .github/scripts/visual-gate/gate.mjs accept \
            --baseline /tmp/gh-pages/visual-gate/baseline \
            --out .visual-run \
            --keys "$KEYS" \
            --reason "$REASON" \
            --actor "$PROMOTER" \
            ${{ inputs.prune && '--prune' || '' }}

      - name: Push the baseline
        run: |
          set -eu
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A visual-gate/baseline
          git commit -m "visual baseline: ${{ inputs.keys }} (run ${{ inputs.run_id }})" || {
            echo "Baseline unchanged"; exit 0;
          }
          for attempt in 1 2 3; do
            if git push origin gh-pages; then
              echo "Baseline updated"
              exit 0
            fi
            git fetch origin gh-pages && git rebase origin/gh-pages || true
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the updated baseline"
          exit 1

      - name: Summary
        run: |
          {
            echo "## Visual baseline updated"
            echo ""
            echo "- promoted: \`${{ inputs.keys }}\`"
            echo "- from run: ${{ inputs.run_id }}"
            echo "- reason: ${{ inputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
