# Promote captured shots into the visual baseline — the "the after is correct"
# outcome of the release gate, made explicit.
#
# Separate from release-gate.yml on purpose. The gate only ever READS the
# baseline; this is the one workflow that writes it, it runs only when a human
# or the release cut dispatches it, and it refuses to run without a reason.
# Every promotion appends to the decision log in the baseline manifest (who,
# when, which run, why, which shots), so any baseline can be read back to the
# change that justified it.
#
# Shots are promoted OUT OF A SPECIFIC GATE RUN's capture artifact, never
# re-captured here: the picture that becomes the baseline is exactly the
# picture that was reviewed.
#
# Typical uses:
#   keys=core-button--default__y2k-light,core-badge--solid__y2k-light
#     reason="Y2K button radius went square on purpose (#5123)"
#   keys=all reason="Playwright chromium bump — every shot re-rendered"

name: Visual Baseline

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Release Gate run id whose capture to promote from'
        required: true
      keys:
        description: 'Comma-separated shot keys, or "all"'
        required: true
      reason:
        description: 'Why the new rendering is the correct one'
        required: true
      prune:
        description: 'Also drop baseline shots whose story no longer exists'
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-slim
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read # download-artifact from another run
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup

      - name: Queue baseline publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/gh-pages-publisher.mjs enqueue --scope visual-gate/baseline

      - name: Download the capture being promoted
        uses: actions/download-artifact@v8
        with:
          name: visual-capture
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: .visual-run

      - name: Wait for the baseline publication turn
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/gh-pages-publisher.mjs wait --scope visual-gate/baseline

      - name: Promote and publish the baseline
        env:
          KEYS: ${{ inputs.keys }}
          REASON: ${{ inputs.reason }}
          PROMOTER: ${{ github.actor }}
          PRUNE: ${{ inputs.prune && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: >
          node .github/scripts/gh-pages-publisher.mjs visual-baseline-manual
          --capture .visual-run
          --keys "$KEYS"
          --reason "$REASON"
          --actor "$PROMOTER"
          --prune "$PRUNE"

      - name: Release the baseline publication turn
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/gh-pages-publisher.mjs release --scope visual-gate/baseline

      - name: Summary
        run: |
          {
            echo "## Visual baseline updated"
            echo ""
            echo "- promoted: \`${{ inputs.keys }}\`"
            echo "- from run: ${{ inputs.run_id }}"
            echo "- reason: ${{ inputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
