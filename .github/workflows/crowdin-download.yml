# Crowdin translations validation — Crowdin's native GitHub integration now
# commits translated locale files directly and keeps its own PR up to date,
# so this workflow no longer downloads translations or opens one itself.
#
# What it still needs to gate, because nothing else in CI does:
#   - Crowdin's raw export isn't run through Prettier, so translated locale
#     JSON can drift from the repo's formatting.
#   - `skip_untranslated_strings` in crowdin.yml strips untranslated keys
#     from within a file, but a locale with zero translated keys still comes
#     back as an empty `{}` file rather than being omitted.
# (CLDR weekday freshness and catalog/ICU correctness are already covered by
# `pnpm check:repo` in the Lint workflow.)
name: Crowdin Translations Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/core/locales/*.json'

permissions: {}

concurrency:
  group: crowdin-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: 4-core-ubuntu
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # A JSON object with no entries; `jq` returns 0 for `{}`. en.json (the
      # source) and pseudo.json (generated, gitignored) are exempt.
      - name: Reject empty locale catalogs
        run: |
          shopt -s nullglob
          empty=()
          for f in packages/core/locales/*.json; do
            case "$f" in
              packages/core/locales/en.json|packages/core/locales/pseudo.json) continue ;;
            esac
            if [ "$(jq -r 'if type == "object" then length else -1 end' "$f")" = "0" ]; then
              empty+=("$f")
            fi
          done
          if [ "${#empty[@]}" -gt 0 ]; then
            echo "::error::Empty locale catalog(s) with zero translated keys — delete before merging: ${empty[*]}"
            exit 1
          fi

      - name: Check locale JSON formatting
        run: |
          shopt -s nullglob
          files=(packages/core/locales/*.json)
          if [ "${#files[@]}" -gt 0 ]; then
            pnpm exec prettier --check "${files[@]}"
          fi
