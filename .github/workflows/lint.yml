name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint:
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Classify changed files
        if: github.event_name == 'pull_request'
        id: scope
        run: |
          git fetch origin ${{ github.base_ref }} --depth=50
          MERGE_BASE=$(git merge-base HEAD origin/${{ github.base_ref }} 2>/dev/null || echo "")
          if [ -z "$MERGE_BASE" ]; then
            printf 'docsite_only=false\nspec_only=false\ntooling_only=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CLASSIFIER_ROOT="$RUNNER_TEMP/change-scope"
          CLASSIFIER_DIR="$CLASSIFIER_ROOT/.github/scripts"
          REGISTRY_DIR="$CLASSIFIER_ROOT/scripts"
          mkdir -p "$CLASSIFIER_DIR" "$REGISTRY_DIR"
          CLASSIFIER="$CLASSIFIER_DIR/change-scope.cjs"
          MATCHER="$CLASSIFIER_DIR/knowledge-paths.cjs"
          REGISTRY="$REGISTRY_DIR/component-packages.cjs"
          if git show "origin/${{ github.base_ref }}:.github/scripts/change-scope.cjs" > "$CLASSIFIER" 2>/dev/null \
            && git show "origin/${{ github.base_ref }}:.github/scripts/knowledge-paths.cjs" > "$MATCHER" 2>/dev/null \
            && git show "origin/${{ github.base_ref }}:scripts/component-packages.cjs" > "$REGISTRY" 2>/dev/null; then
            git diff --name-status "$MERGE_BASE"...HEAD \
              | node "$CLASSIFIER" --github-output
          else
            # Missing trusted policy or dependencies cannot grant a specialized
            # lane. Run full lint until the base branch supplies the classifier.
            printf 'docsite_only=false\nspec_only=false\ntooling_only=false\n' \
              >> "$GITHUB_OUTPUT"
          fi

      # A change that ships to consumers names its package in a Changeset, and a
      # released CLI JSON id cannot disappear unclassified. The release coverage
      # audit runs the same classifier over the cut range, so the two agree.
      - name: Check Changeset coverage
        if: github.event_name == 'pull_request'
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -eu
          # The checked-out merge commit and its first parent (the base branch
          # tip): exactly what this pull request lands.
          git fetch --no-tags --depth=2 origin "$MERGE_SHA"
          RELEASED=$(git ls-remote --tags --refs origin 'v*' \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)
          if [ -z "$RELEASED" ]; then
            echo 'No vX.Y.Z release tag found to compare CLI JSON ids against.'
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "+refs/tags/${RELEASED}:refs/tags/${RELEASED}"
          node scripts/release/changeset-coverage.mjs pr \
            --base "$MERGE_SHA^1" --head "$MERGE_SHA" --released "$RELEASED"

      - name: Skip full lint for lightweight docs
        if: steps.scope.outputs.docsite_only == 'true' || steps.scope.outputs.spec_only == 'true'
        run: echo "Lightweight documentation PR — skipping full lint"

      - uses: ./.github/actions/setup
        if: steps.scope.outputs.docsite_only != 'true' && steps.scope.outputs.spec_only != 'true'

      - name: Clear ESLint cache
        if: steps.scope.outputs.docsite_only != 'true' && steps.scope.outputs.spec_only != 'true'
        run: rm -rf .eslintcache node_modules/.cache

      - name: Check repository guardrails
        if: steps.scope.outputs.docsite_only != 'true' && steps.scope.outputs.spec_only != 'true'
        run: pnpm check:repo

      # The CLI README's generated tables (commands, error codes, response
      # types) ship to consumers. A merge from main can silently drop a
      # generated row, so the merged result is checked against its sources.
      - name: Check generated CLI README
        if: steps.scope.outputs.docsite_only != 'true' && steps.scope.outputs.spec_only != 'true'
        run: node packages/cli/scripts/generate-cli-readme.mjs --check

      - name: Run ESLint
        if: steps.scope.outputs.docsite_only != 'true' && steps.scope.outputs.spec_only != 'true'
        run: pnpm lint
