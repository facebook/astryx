# Release gate — the checks a release must clear, run before the daily cut.
#
# Two of them, and they answer different questions:
#   visual  — did anything on screen change, in any theme, since the last
#             accepted baseline? (.github/scripts/visual-gate)
#   a11y    — did any NEW accessibility violation appear against the baseline?
#             (the same full-suite audit a11y-weekly runs, run daily here)
#
# Why this is not in ci.yml: capturing several hundred screenshots and running
# axe over every story is the wrong tax on every push to every PR. It runs once
# a day instead, and on demand for anyone who wants one sooner.
#
# TIMING. It fires at 06:00 PT, two hours before the 08:00 PT release cut, and
# the margin is deliberate: the visual leg takes ~15 min but the a11y leg audits
# every story in the index and has taken ~57 min (a11y-weekly run 31998548109).
# At the original 07:10 the verdict would have landed AFTER the cut window
# opened — a gate the release cannot read in time is not a gate.
#
# THE VERDICT IS ADVICE WITH TEETH, NOT A VETO. `changed` is not `failed`: a
# visual change is only a regression if nobody meant it. The release cut reads
# verdict.json, opens the report (before / after / diff per shot), and decides
# per change — "the after is correct" is a valid outcome, recorded by promoting
# that shot through visual-baseline.yml. What must never happen is a release
# going out through a diff nobody looked at.
#
# Consumed by the release cron as:
#   https://facebook.github.io/astryx/visual-gate/latest/verdict.json  (status, changes)
#   https://facebook.github.io/astryx/visual-gate/latest/              (the report)

name: Release Gate

on:
  schedule:
    # 13:00 UTC = 06:00 PT — two hours before the 08:00 PT cut (see TIMING above).
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      tiers:
        description: 'Shot tiers: surface, theme-matrix, full'
        required: false
        default: 'surface,theme-matrix'

permissions: {}

concurrency:
  group: release-gate
  cancel-in-progress: false

jobs:
  visual:
    name: Visual regression
    # Pinned label, deliberately: a baseline is only comparable against the
    # same platform and browser build. The gate refuses the comparison rather
    # than reporting a runner change as hundreds of regressions.
    runs-on: 2-core-ubuntu-arm
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      status: ${{ steps.gate.outputs.status }}
      changed: ${{ steps.gate.outputs.changed }}
      added: ${{ steps.gate.outputs.added }}
      total: ${{ steps.gate.outputs.total }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm -F @astryxdesign/storybook build

      - name: Install Playwright browser
        run: npx playwright install chromium

      # Only the baseline, not the whole gh-pages tree (which carries every PR
      # preview): sparse + blob:none keeps this to the PNGs actually needed.
      - name: Fetch visual baseline from gh-pages
        run: |
          set -eu
          rm -rf /tmp/gh-pages
          git clone --depth=1 --filter=blob:none --sparse --single-branch --branch gh-pages \
            "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages
          git -C /tmp/gh-pages sparse-checkout set visual-gate/baseline
          mkdir -p .visual-baseline
          if [ -d /tmp/gh-pages/visual-gate/baseline ]; then
            cp -r /tmp/gh-pages/visual-gate/baseline/. .visual-baseline/
            echo "Baseline: $(ls .visual-baseline/shots 2>/dev/null | wc -l) shots"
          else
            echo "::notice::No baseline on gh-pages yet — this run establishes one."
          fi

      # Exit 2 means "changed", which is a question for the release cut, not a
      # broken run. Exit 1 (crashed) still fails the job.
      - name: Run the visual gate
        id: gate
        run: |
          set +e
          node .github/scripts/visual-gate/gate.mjs check \
            --storybook-dir apps/storybook/dist \
            --baseline .visual-baseline \
            --out .visual-run \
            --tiers "${{ inputs.tiers || 'surface,theme-matrix' }}" \
            --summary-output visual-summary.md
          code=$?
          cat visual-summary.md >> "$GITHUB_STEP_SUMMARY" || true
          [ "$code" -eq 1 ] && exit 1
          exit 0

      # The capture is what a promotion copies from, so it has to outlive the
      # run: visual-baseline.yml promotes shots out of this artifact by run id.
      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-capture
          path: |
            .visual-run/shots/
            .visual-run/manifest.json
            .visual-run/verdict.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: .visual-run/report/
          retention-days: 30
          if-no-files-found: warn

      # The assertion a pixel diff cannot make. A baseline proves a component
      # looks like it did last week — including when the reason is that a theme
      # override stopped applying and the broken frame was promoted as correct.
      # This asserts each declared target's override actually reached the
      # pixels, by equality against the probe theme's unique per-selector
      # colour. No baseline, no images, and it names the target.
      #
      # Reported, not enforced, until the standing failures are worked down:
      # today 50 targets lose to component styles because StyleX emits into
      # @layer priority1-4, which sort AFTER astryx-theme. Failing the gate on
      # a known systemic issue would just teach everyone to ignore it.
      - name: Check theme overrides reach the pixels
        id: reach
        continue-on-error: true
        run: |
          set +e
          node .github/scripts/visual-gate/gate.mjs reach \
            --storybook-dir apps/storybook/dist \
            --out .visual-run > reach-summary.txt 2>&1
          code=$?
          {
            echo "## Theme override reach"
            echo ""
            echo '```'
            head -40 reach-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat reach-summary.txt
          [ "$code" -eq 1 ] && exit 1
          exit 0

      - name: Upload reach report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-reach
          path: .visual-run/reach.json
          retention-days: 30
          if-no-files-found: warn

  a11y:
    name: Accessibility
    runs-on: 2-core-ubuntu-arm
    # The full-suite audit walks every story in the index and has taken ~57 min.
    # A 45-minute budget killed it mid-audit, which reads as `crashed` — and a
    # crashed gate holds the release, so an under-sized timeout would block
    # every cut.
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      status: ${{ steps.summarize.outputs.status }}
      total_violations: ${{ steps.summarize.outputs.total_violations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm -F @astryxdesign/storybook build

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run full-suite accessibility audit
        id: audit
        continue-on-error: true
        run: |
          BASELINE_FLAGS=""
          if [ -f .github/a11y-baseline.json ]; then
            BASELINE_FLAGS="--baseline .github/a11y-baseline.json --fail-on-new"
          fi
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output a11y-report.json \
            $BASELINE_FLAGS

      - name: Summarize
        id: summarize
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          node .github/scripts/weekly-a11y-summary.js \
            --report a11y-report.json \
            --audit-outcome "$AUDIT_OUTCOME" \
            --summary-output a11y-summary.md \
            --github-output "$GITHUB_OUTPUT"
          cat a11y-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-gate-report
          path: |
            a11y-report.json
            a11y-summary.md
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Publish verdict
    needs: [visual, a11y]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    permissions:
      contents: write
    # Not the pages-deploy group: GitHub keeps only the newest pending run per
    # group, so joining it could cancel a pending site deploy (see
    # cleanup-previews.yml for the same reasoning).
    concurrency:
      group: release-gate-publish
      cancel-in-progress: false
    steps:
      - name: Download report
        uses: actions/download-artifact@v8
        with:
          name: visual-report
          path: report

      - name: Compose the release-gate verdict
        env:
          VISUAL_STATUS: ${{ needs.visual.result == 'success' && needs.visual.outputs.status || 'crashed' }}
          A11Y_STATUS: ${{ needs.a11y.outputs.status || 'crashed' }}
          A11Y_VIOLATIONS: ${{ needs.a11y.outputs.total_violations || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          REPORT_URL="https://facebook.github.io/astryx/visual-gate/${GITHUB_RUN_ID}/"
          cat > report/release-gate.json <<JSON
          {
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "runUrl": "${RUN_URL}",
            "reportUrl": "${REPORT_URL}",
            "visual": {"status": "${VISUAL_STATUS}"},
            "a11y": {"status": "${A11Y_STATUS}", "violations": ${A11Y_VIOLATIONS}}
          }
          JSON
          cat report/release-gate.json

      - name: Publish to gh-pages
        run: |
          set -eu
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            rm -rf /tmp/gh-pages
            git clone --depth=1 --filter=blob:none --sparse --single-branch --branch gh-pages "$REPO_URL" /tmp/gh-pages
            git -C /tmp/gh-pages sparse-checkout set visual-gate
            RUN_DIR="/tmp/gh-pages/visual-gate/${GITHUB_RUN_ID}"
            rm -rf "$RUN_DIR" /tmp/gh-pages/visual-gate/latest
            mkdir -p "$RUN_DIR" /tmp/gh-pages/visual-gate/latest
            cp -r report/. "$RUN_DIR"/
            cp -r report/. /tmp/gh-pages/visual-gate/latest/

            # Keep the twenty most recent run directories; the report images are
            # only useful while the change they describe is still a live question.
            ls -1d /tmp/gh-pages/visual-gate/*/ 2>/dev/null \
              | grep -Ev '/(baseline|latest)/$' \
              | sort -V | head -n -20 | xargs -r rm -rf

            cd /tmp/gh-pages
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A visual-gate
            git commit -m "release gate: ${GITHUB_RUN_ID}" || { echo "Nothing to publish"; exit 0; }
            if git push origin gh-pages; then
              echo "Published https://facebook.github.io/astryx/visual-gate/${GITHUB_RUN_ID}/"
              exit 0
            fi
            echo "Push failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Could not publish the release-gate report to gh-pages"
          exit 1

      - name: Summary
        env:
          VISUAL_STATUS: ${{ needs.visual.outputs.status }}
          A11Y_STATUS: ${{ needs.a11y.outputs.status }}
        run: |
          {
            echo "## Release gate"
            echo ""
            echo "| check | status |"
            echo "|---|---|"
            echo "| visual | ${VISUAL_STATUS:-crashed} |"
            echo "| a11y | ${A11Y_STATUS:-crashed} |"
            echo ""
            echo "Report: https://facebook.github.io/astryx/visual-gate/${GITHUB_RUN_ID}/"
          } >> "$GITHUB_STEP_SUMMARY"
