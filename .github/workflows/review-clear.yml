# Reconcile the code-review gate after an engineering review — including on
# fork PRs.
#
# review-signal owns whether a head needs code review. It records that ownership
# with needs:code-review and the review-required status. This workflow may clear
# an owned gate after exact-head approval or restore it after that effective
# approver requests changes or their review is dismissed. It never creates a
# gate for a head that review-signal did not mark as code-gated.
#
# The mutation cannot run on the raw pull_request_review event for fork PRs
# (read-only token → 403). It therefore runs on workflow_run after Review signal
# anchors approved, changes_requested, and dismissed review events from the base
# repository with a write-capable token. It never checks out or runs
# PR-controlled code: its helper comes from the trusted workflow SHA.
#
# The reviewed PR is identified by the head commit and branch the review run
# recorded. The run's head_repository is not evidence: for a fork PR it names
# this repository, and the run lists no PRs. Candidates come from the run's own
# PR list, GitHub's commit association, and every open PR whose head is that
# exact commit; each is re-read and must match the commit and branch. When more
# than one open PR matches, the run cannot tell which one was reviewed, so it
# only restores gates and never clears one. A PR the default branch's
# protection does not govern owns "review-required/stacked-pr-<number>" rather
# than "review-required" (see review-signal.yml).
#
# Runs never cancel one another, so they can overlap or finish out of order.
# Before every mutation, and again after its status write, a run re-reads the
# PR and recomputes its decision from the live exact-head reviews, gate status,
# and labels; if the decision changed, it reconciles again. Every review change
# starts its own run after the change, so the last run to write also verifies
# last.

name: Review clear

on:
  workflow_run:
    workflows: ['Review signal']
    types: [completed]

permissions: {}

concurrency:
  # Each run is its own group: no review-clear run cancels another. Grouping by
  # any PR key cannot be exact (GitHub compares group names case-insensitively,
  # while branch names are case-sensitive), and correctness does not depend on
  # cancellation: every run re-decides from live state before each mutation.
  group: review-clear-run-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  clear:
    if: github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      statuses: write
      checks: write
      contents: read
    steps:
      - name: Reconcile the exact-head code gate
        uses: actions/github-script@v9
        env:
          ENG_OWNERS: ${{ vars.ENGOWNERS }}
        with:
          # See review-signal.yml — a transient 503 on the status POST must not
          # be the last word on whether the gate clears.
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const CODE = 'needs:code-review';
            const MAX_ATTEMPTS = 3;

            // The review run records the reviewed head commit and branch. Its
            // head_repository is not evidence: for a fork PR it names this
            // repository, not the fork.
            const headBranch = run.head_branch;
            const headSha = run.head_sha;
            if (!headBranch || !headSha) {
              core.info('The review run does not identify a head; nothing to reconcile.');
              return;
            }

            // Entitled code approvers come from the ENGOWNERS repo variable
            // (passed in as env above). Any eng owner's approval clears the code
            // gate — eng owns the code, and the GitHub-native CODEOWNERS set is
            // a subset of ENGOWNERS, so ENGOWNERS covers it. No file read / no
            // content API, so there is nothing to 502 on. If the variable is
            // empty/unset, DON'T clear (leave the gate as-is) and let
            // review-signal's flag job reconcile — declining to clear is the
            // safe direction here; an empty list is never "everyone".
            const codeApprovers = new Set(
              ((process.env.ENG_OWNERS || '').match(/@?[A-Za-z0-9-]+/g) || [])
                .map((h) => h.replace(/^@/, '').toLowerCase()),
            );
            if (!codeApprovers.size) {
              core.warning('ENGOWNERS variable empty/unset; not clearing (flag job will reconcile).');
              return;
            }

            // The same dependency-free helper review-signal uses, from this
            // run's trusted default-branch SHA: an older or stacked base may
            // predate it, and a stacked base is another PR's unmerged head.
            let decision;
            try {
              const { data: decisionFile } = await github.rest.repos.getContent({
                owner, repo, ref: context.sha,
                path: '.github/scripts/review-signal-decision.cjs',
              });
              const decisionSrc = Buffer.from(decisionFile.content, 'base64').toString('utf8');
              const decisionModule = { exports: {} };
              new Function('module', 'exports', 'require', decisionSrc)(
                decisionModule, decisionModule.exports,
                () => { throw new Error('review-signal-decision.cjs must stay dependency-free'); },
              );
              decision = decisionModule.exports;
            } catch (e) {
              core.warning(`Could not load the review decision helper: ${e.message}`);
              return;
            }

            // Candidate numbers from every source that can name the PR. The
            // run lists only same-repository PRs, and commit association often
            // lists none for an unmerged commit, so the open-PR scan by exact
            // head commit is what finds a fork PR.
            const numbers = new Set((run.pull_requests || []).map((pr) => pr.number));
            try {
              const associated = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: headSha, per_page: 100 },
              );
              for (const pr of associated) numbers.add(pr.number);
            } catch (e) {
              core.warning(`Could not read PRs associated with ${headSha.slice(0, 7)}: ${e.message}`);
            }
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            for (const pr of open) {
              if (pr.head?.sha === headSha) numbers.add(pr.number);
            }
            // Only the live PR decides: open, and its head is exactly the
            // reviewed commit on the reviewed branch.
            const candidates = [];
            for (const number of [...numbers].sort((a, b) => a - b)) {
              const { data: live } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (live.state === 'open' && live.head?.sha === headSha && live.head?.ref === headBranch) {
                candidates.push(live);
              }
            }
            if (!candidates.length) {
              core.info(`No open PR has head ${headBranch}@${headSha.slice(0, 7)}; the flag job reconciles any newer head.`);
              return;
            }
            // One head can back several open PRs (for example one to the
            // default branch and one stacked). The review belongs to one of
            // them and the run does not say which, so never clear on
            // ambiguity; still restore any candidate whose own exact-head
            // review state was withdrawn.
            const ambiguous = candidates.length > 1;
            if (ambiguous) {
              core.warning(`Head ${headSha.slice(0, 7)} on ${headBranch} backs open PRs ${candidates.map((pr) => `#${pr.number}`).join(', ')}; restoring gates only, never clearing.`);
            }
            for (const candidate of candidates) {
              let settled = false;
              for (let attempt = 1; attempt <= MAX_ATTEMPTS && !settled; attempt += 1) {
                settled = (await reconcile(candidate.number, !ambiguous)) !== 'moved';
              }
              if (!settled) {
                core.warning(`PR #${candidate.number} kept moving while its gate was reconciled; leaving it to the flag job.`);
              }
            }

            // The decision for one PR from live state: 'restore' after an
            // effective ENGOWNER withdrawal, 'clear' after an effective
            // exact-head approval, or 'none'. Only the existing label or a
            // latest gate status emitted by this gate proves that
            // review-signal owned the gate.
            async function decide(pr, allowClear) {
              const scope = decision.gateScope(pr);
              const gate = decision.gateContext('review-required', pr);
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              const { codeApproved, codeWithdrawn } = decision.resolveReviewApprovals({
                reviews,
                headSha,
                engOwners: [...codeApprovers],
                designOwners: [],
              });
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                {owner, repo, ref: headSha, per_page: 100},
              );
              const latestGateStatus = statuses.find((status) => status.context === gate);
              const trustedStatus =
                latestGateStatus?.creator?.login === 'github-actions[bot]';
              const description = latestGateStatus?.description || '';
              const statusOwnsGate =
                trustedStatus &&
                ((latestGateStatus.state === 'pending' &&
                  (description.startsWith('Waiting on code review:') ||
                    description === 'Waiting on code review after approval withdrawal.')) ||
                  (latestGateStatus.state === 'success' &&
                    description === 'Cleared by code-owner approval.'));
              const gateOwned =
                pr.labels.some((label) => label.name === CODE) || statusOwnsGate;
              if (!gateOwned) return { action: 'none', gate, reason: 'not-owned' };
              if (codeWithdrawn) return { action: 'restore', gate };
              if (!codeApproved) return { action: 'none', gate, reason: 'no-change' };
              if (!allowClear) return { action: 'none', gate, reason: 'ambiguous' };
              // A required context is shared by every PR with this head. When
              // another open PR that also reads it shares the head, one PR's
              // approval cannot clear it (review-signal holds it pending).
              // Commit association omits fork PRs, so also scan the open PRs.
              if (scope.governed) {
                const associated = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { owner, repo, commit_sha: headSha, per_page: 100 },
                );
                const openNow = await github.paginate(github.rest.pulls.list, {
                  owner, repo, state: 'open', per_page: 100,
                });
                const sameHead = new Set(
                  [...associated, ...openNow]
                    .filter((other) => other.state === 'open' && other.head?.sha === headSha)
                    .map((other) => other.number),
                );
                sameHead.delete(pr.number);
                const others = [];
                for (const number of sameHead) {
                  const { data } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                  others.push(data);
                }
                const siblings = decision.governedSiblings(pr, others);
                if (siblings.length) {
                  return { action: 'none', gate, reason: 'shared', siblings };
                }
              }
              return { action: 'clear', gate };
            }

            async function reconcile(prNumber, allowClear) {
              // Full PR (labels, head, base, stack).
              const { data: full } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (full.state !== 'open' || full.head.sha !== headSha) {
                core.info(`PR #${prNumber} no longer has the reviewed head; leaving it as-is.`);
                return 'done';
              }
              let plan;
              try {
                plan = await decide(full, allowClear);
              } catch (e) {
                core.warning(`Could not resolve exact-head gate state: ${e.message}`);
                return 'done';
              }
              const GATE = plan.gate;
              if (plan.action === 'none') {
                if (plan.reason === 'not-owned') {
                  core.info(`PR #${prNumber}: current head was not marked as code-gated; leaving it as-is.`);
                } else if (plan.reason === 'ambiguous') {
                  core.info(`PR #${prNumber}: approval is ambiguous across PRs sharing this head; not clearing.`);
                } else if (plan.reason === 'shared') {
                  core.info(`PR #${prNumber}: head is shared with open PR ${plan.siblings.map((n) => `#${n}`).join(', ')}; not clearing ${GATE}.`);
                } else {
                  core.info(`PR #${prNumber}: no effective ENGOWNER review-state change; leaving gate as-is.`);
                }
                return 'done';
              }

              // Runs can overlap, so re-read the PR and recompute the decision
              // from live reviews, statuses, and labels immediately before every
              // mutation and after the status write. A moved head ends this
              // run's claim; a moved base or stack, or a changed decision,
              // starts the reconciliation over from the live state.
              let labels = [];
              async function stillPlanned() {
                const { data: current } = await github.rest.pulls.get({
                  owner, repo, pull_number: prNumber,
                });
                if (!decision.samePullIdentity(full, current)) {
                  if (current.state !== 'open' || current.head.sha !== headSha) {
                    core.info(`PR #${prNumber}: head moved while resolving approval; leaving gate as-is.`);
                    return 'gone';
                  }
                  return 'moved';
                }
                let now;
                try {
                  now = await decide(current, allowClear);
                } catch (e) {
                  core.warning(`Could not re-resolve exact-head gate state: ${e.message}`);
                  return 'gone';
                }
                if (now.action !== plan.action) {
                  core.info(`PR #${prNumber}: the gate decision changed from ${plan.action} to ${now.action} while reconciling; reconciling again.`);
                  return 'moved';
                }
                labels = current.labels.map((l) => l.name);
                return 'same';
              }
              const stop = (state) => (state === 'moved' ? 'moved' : 'done');
              let live = await stillPlanned();
              if (live !== 'same') return stop(live);

              // The commit status is the hard gate; publish it before the
              // advisory label in both directions. If the status POST fails,
              // throw without any label mutation.
              if (plan.action === 'restore') {
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha: headSha, context: GATE,
                  state: 'pending',
                  description: 'Waiting on code review after approval withdrawal.',
                });
                core.info(`${GATE} status → pending on #${prNumber}.`);
                live = await stillPlanned();
                if (live !== 'same') return stop(live);
                if (!labels.includes(CODE)) {
                  await github.rest.issues.addLabels({
                    owner, repo, issue_number: prNumber, labels: [CODE],
                  });
                  core.info(`Restored ${CODE} on #${prNumber}.`);
                }
                return 'done';
              }

              // Clear: set status success, drop the label (ignore if already
              // gone), and neutralize any stale action_required check run.
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: headSha, context: GATE,
                state: 'success', description: 'Cleared by code-owner approval.',
              });
              core.info(`${GATE} status → success on #${prNumber}.`);
              live = await stillPlanned();
              if (live !== 'same') return stop(live);
              if (labels.includes(CODE)) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: CODE });
                  core.info(`Removed ${CODE} on #${prNumber}.`);
                } catch (e) {
                  core.warning(`Could not remove ${CODE} (may already be gone): ${e.message}`);
                }
              }
              // Neutralize stale check-run(s) of the same name so the rollup isn't
              // dragged to failure by a pre-status action_required leftover.
              let staleRuns = [];
              try {
                const { data } = await github.rest.checks.listForRef({
                  owner, repo, ref: headSha, check_name: 'review-required', per_page: 100,
                });
                staleRuns = data.check_runs.filter((cr) =>
                  cr.conclusion && cr.conclusion !== 'success' && cr.conclusion !== 'neutral');
              } catch (e) {
                core.warning(`Could not list stale check-runs: ${e.message}`);
              }
              for (const cr of staleRuns) {
                live = await stillPlanned();
                if (live !== 'same') return stop(live);
                try {
                  await github.rest.checks.update({
                    owner, repo, check_run_id: cr.id,
                    conclusion: 'neutral',
                    output: { title: 'Superseded by review-required status', summary: 'Cleared by code-owner approval; see the review-required status.' },
                  });
                  core.info(`Neutralized stale check-run ${cr.id} on #${prNumber}.`);
                } catch (e) {
                  core.warning(`Could not neutralize stale check-run: ${e.message}`);
                }
              }
              return 'done';
            }
