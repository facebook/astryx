# Reconcile the code-review gate after an engineering review — including on
# fork PRs.
#
# review-signal owns whether a head needs code review. It records that ownership
# with needs:code-review and the review-required status. This workflow may clear
# an owned gate after exact-head approval or restore it after that effective
# approver requests changes or their review is dismissed. It never creates a
# gate for a head that review-signal did not mark as code-gated.
#
# The mutation cannot run on the raw pull_request_review event for fork PRs
# (read-only token → 403). It therefore runs on workflow_run after Review signal
# anchors approved, changes_requested, and dismissed review events from the base
# repository with a write-capable token. It never checks out or runs
# PR-controlled code.

name: Review clear

on:
  workflow_run:
    workflows: ['Review signal']
    types: [completed]

permissions: {}

concurrency:
  group: review-clear-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

jobs:
  clear:
    if: github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      statuses: write
      checks: write
      contents: read
    steps:
      - name: Reconcile the exact-head code gate
        uses: actions/github-script@v9
        env:
          ENG_OWNERS: ${{ vars.ENGOWNERS }}
        with:
          # See review-signal.yml — a transient 503 on the status POST must not
          # be the last word on whether the gate clears.
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const CODE = 'needs:code-review';

            // Resolve the PR the review belonged to.
            //
            // NOTE: for a workflow_run fired by a pull_request_target/
            // pull_request_review-triggered workflow, the payload's top-level
            // head_sha/head_branch point at the DEFAULT BRANCH (main), not the
            // PR — and pull_requests is empty for forks. So neither the SHA nor
            // the payload branch resolves the PR. The reliable signal is the
            // triggering run's own head_branch (correct even for forks); find
            // the open PR whose head branch matches.
            let prNumber = null;
            const prs0 = run.pull_requests || [];
            if (prs0.length) {
              prNumber = prs0[0].number;
            } else if (run.head_branch) {
              try {
                // head param wants OWNER:branch; head_repository is the fork/owner.
                const headOwner = (run.head_repository && run.head_repository.owner &&
                  run.head_repository.owner.login) || owner;
                const list = await github.paginate(github.rest.pulls.list, {
                  owner, repo, state: 'open',
                  head: `${headOwner}:${run.head_branch}`, per_page: 100,
                });
                let match = list[0];
                // Fallback: some fork setups don't match the head filter; scan by branch name.
                if (!match) {
                  const all = await github.paginate(github.rest.pulls.list, {
                    owner, repo, state: 'open', per_page: 100,
                  });
                  match = all.find((p) => p.head && p.head.ref === run.head_branch);
                }
                if (match) prNumber = match.number;
              } catch (e) {
                core.warning(`Could not resolve PR from branch ${run.head_branch}: ${e.message}`);
              }
            }
            if (!prNumber) { core.info('No PR resolved for this review run.'); return; }

            // Full PR (labels + head sha).
            const { data: full } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const headSha = full.head.sha;

            // Entitled code approvers come from the ENGOWNERS repo variable
            // (passed in as env above). Any eng owner's approval clears the code
            // gate — eng owns the code, and the GitHub-native CODEOWNERS set is
            // a subset of ENGOWNERS, so ENGOWNERS covers it. No file read / no
            // content API, so there is nothing to 502 on. If the variable is
            // empty/unset, DON'T clear (leave the gate as-is) and let
            // review-signal's flag job reconcile — declining to clear is the
            // safe direction here; an empty list is never "everyone".
            const codeApprovers = new Set(
              ((process.env.ENG_OWNERS || '').match(/@?[A-Za-z0-9-]+/g) || [])
                .map((h) => h.replace(/^@/, '').toLowerCase()),
            );
            if (!codeApprovers.size) {
              core.warning('ENGOWNERS variable empty/unset; not clearing (flag job will reconcile).');
              return;
            }

            // Resolve the effective exact-head review state with the same
            // dependency-free helper review-signal uses. Also read this head's
            // latest review-required status: only the existing label or a latest
            // status emitted by this gate proves that review-signal owned it.
            let codeApproved = false;
            let codeWithdrawn = false;
            let gateOwned = false;
            try {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: prNumber, per_page: 100,
              });
              const { data: decisionFile } = await github.rest.repos.getContent({
                owner, repo, ref: full.base.sha,
                path: '.github/scripts/review-signal-decision.cjs',
              });
              const decisionSrc = Buffer.from(decisionFile.content, 'base64').toString('utf8');
              const decisionModule = { exports: {} };
              new Function('module', 'exports', 'require', decisionSrc)(
                decisionModule, decisionModule.exports,
                () => { throw new Error('review-signal-decision.cjs must stay dependency-free'); },
              );
              ({codeApproved, codeWithdrawn} =
                decisionModule.exports.resolveReviewApprovals({
                  reviews,
                  headSha,
                  engOwners: [...codeApprovers],
                  designOwners: [],
                }));

              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                {owner, repo, ref: headSha, per_page: 100},
              );
              const latestGateStatus = statuses.find(
                (status) => status.context === 'review-required',
              );
              const trustedStatus =
                latestGateStatus?.creator?.login === 'github-actions[bot]';
              const description = latestGateStatus?.description || '';
              const statusOwnsGate =
                trustedStatus &&
                ((latestGateStatus.state === 'pending' &&
                  (description.startsWith('Waiting on code review:') ||
                    description === 'Waiting on code review after approval withdrawal.')) ||
                  (latestGateStatus.state === 'success' &&
                    description === 'Cleared by code-owner approval.'));
              gateOwned =
                full.labels.some((label) => label.name === CODE) || statusOwnsGate;
            } catch (e) {
              core.warning(`Could not resolve exact-head gate state: ${e.message}`);
              return;
            }

            if (!gateOwned) {
              core.info(`PR #${prNumber}: current head was not marked as code-gated; leaving it as-is.`);
              return;
            }
            if (!codeApproved && !codeWithdrawn) {
              core.info(`PR #${prNumber}: no effective ENGOWNER review-state change; leaving gate as-is.`);
              return;
            }

            // Re-read immediately before either mutation. A head that moved after
            // review resolution must be reconciled by review-signal for the new
            // head, never by carrying this decision forward.
            const { data: current } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });
            if (current.head.sha !== headSha) {
              core.info(`PR #${prNumber}: head moved while resolving approval; leaving gate as-is.`);
              return;
            }
            const labels = current.labels.map((l) => l.name);

            if (codeWithdrawn) {
              // The commit status is the hard gate; publish it before the advisory
              // label. If this POST fails, throw without any label-only mutation.
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: headSha, context: 'review-required',
                state: 'pending',
                description: 'Waiting on code review after approval withdrawal.',
              });
              core.info(`review-required status → pending on #${prNumber}.`);
              if (!labels.includes(CODE)) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: prNumber, labels: [CODE],
                });
                core.info(`Restored ${CODE} on #${prNumber}.`);
              }
              return;
            }

            // Clear: drop the label (ignore if already gone), set status success,
            // and neutralize any stale action_required review-required check run.
            if (labels.includes(CODE)) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: CODE });
                core.info(`Removed ${CODE} on #${prNumber}.`);
              } catch (e) {
                core.warning(`Could not remove ${CODE} (may already be gone): ${e.message}`);
              }
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: headSha, context: 'review-required',
              state: 'success', description: 'Cleared by code-owner approval.',
            });
            core.info(`review-required status → success on #${prNumber}.`);
            // Neutralize stale check-run(s) of the same name so the rollup isn't
            // dragged to failure by a pre-status action_required leftover.
            try {
              const { data } = await github.rest.checks.listForRef({
                owner, repo, ref: headSha, check_name: 'review-required', per_page: 100,
              });
              for (const cr of data.check_runs) {
                if (cr.conclusion && cr.conclusion !== 'success' && cr.conclusion !== 'neutral') {
                  await github.rest.checks.update({
                    owner, repo, check_run_id: cr.id,
                    conclusion: 'neutral',
                    output: { title: 'Superseded by review-required status', summary: 'Cleared by code-owner approval; see the review-required status.' },
                  });
                  core.info(`Neutralized stale check-run ${cr.id} on #${prNumber}.`);
                }
              }
            } catch (e) {
              core.warning(`Could not neutralize stale check-run: ${e.message}`);
            }
