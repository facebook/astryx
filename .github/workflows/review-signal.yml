# Review signal — deterministic labels that route reviews and gate auto-merge.
#
# On PR open/update this workflow inspects the changed file paths (never the
# code itself) and the PR author, then applies up to two labels:
#
#   needs:code-review   — HIGH-RISK code areas: a new package, a new
#                         component/module (in core — NOT lab, which is the
#                         canary staging area), any runtime change under
#                         core/src, or public API surface, NOT confined to
#                         low-risk areas (themes, templates, sandbox, storybook,
#                         docsite). Requests review from CODEOWNERS. ENGOWNERS
#                         self-serve code. A DESIGNOWNER author also self-serves
#                         an existing-file Core diff only when the trusted-base
#                         classifier proves every runtime line appearance-only
#                         and no other code reason applies.
#
#   needs:design-review — DESIGN-AFFECTING changes anywhere: StyleX styling,
#                         theme/token files, or a template's .tsx. Keyed on
#                         visual signals only — NOT docs and NOT "a new dir
#                         appeared" (styleless modules don't count). NOT
#                         area-gated — a theme/template edit is where design
#                         lives. Requests review from DESIGNOWNERS. Skipped when
#                         the author is a DESIGNOWNER (design self-serves design).
#                         Besides the path signals, the DIFF CONTENT is scored
#                         by .github/scripts/lib/classify-visual.js (#3667) —
#                         most component styling here is an inline stylex.create
#                         edit in a .tsx, which no path pattern can see.
#
# The CODE label DISABLES auto-merge so the PR can't merge unattended (the
# design label is advisory and does not). Both are cleared when an entitled
# owner approves (code → CODEOWNER; design → DESIGNOWNER
# or CODEOWNER). Code detection is path-based and deterministic; design adds a
# content-based diff score (deterministic too — same diff, same score).
#
# HARD GATE (code review only): this emits a "review-required" COMMIT STATUS.
# When code review is needed it's set to `pending`, which blocks a required
# status context AND renders as a neutral yellow "waiting" dot (not a red
# failure), so a PR awaiting review doesn't add red noise to the queue. An
# entitled owner's code approval flips it to `success`. Keep "review-required"
# a REQUIRED status check in branch protection: it blocks non-admin merges even
# for internal contributors who have write access.
#
# Design review is ADVISORY: a design-affecting change is labeled
# needs:design-review and design owners are requested, but it does NOT block
# the merge. All contributor (non-owner) PRs require code review; engineering
# owners self-serve code, and design owners self-serve only classifier-proven
# appearance-only Core runtime changes.
#
# Uses pull_request_target so it can label / request reviewers / disable
# auto-merge on fork PRs. It reads the PR file list, diff text, and changed Core
# base/head source bytes as inert API data. The approval helper comes from the
# trusted workflow SHA; the visual classifier comes from the PR base commit when
# the PR targets the default branch, and from the workflow SHA otherwise. It reads
# eng/design owner lists from repository VARIABLES (vars.ENGOWNERS /
# vars.DESIGNOWNERS) — no checkout and no execution of PR-controlled code.
# Do not add checkout or build steps here.
#
# Stacked PRs (based on another PR's branch) are flagged too, against their own
# base. GitHub always runs pull_request_target from the default branch, with
# GITHUB_SHA at its tip, so a non-default base cannot choose the workflow or
# helper code; manual dispatch is honored only from the default branch. A base
# change re-flags the PR; title/body edits do not. Commit statuses are shared by
# every PR with the same head, so the required "review-required" context is
# published only for a PR the default branch's protection governs (it targets
# the default branch, or is a rung of a native stack on it). Any other PR gets a
# non-required "review-required/stacked-pr-<number>" context instead.

name: Review signal

on:
  # No base-branch filter: a PR stacked on another PR's branch needs the gate as
  # much as a main-based one. `edited` is admitted only for base changes (see
  # the flag job's condition).
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        edited,
      ]
  pull_request_review:
    types: [submitted, dismissed]
  # Manual re-trigger. The App only auto-runs on the PR events above, so if it
  # ever misses one (e.g. the workflow was added after a PR was opened, leaving
  # the required "review-required" check stuck as Expected/pending), this is the
  # recovery lever. Leave `pr` blank to re-flag EVERY open PR (backfill); pass a
  # number to re-flag just that one.
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to re-flag (blank = all open PRs)'
        required: false
        type: string

permissions: {}

concurrency:
  # Only runs that classify a PR share its group, so every run that cancels
  # another reclassifies the live PR itself. Everything else is run-scoped and
  # never cancels a classification: review events (their anchor must complete
  # for review-clear), title/body edits, the backfill-all dispatch, and a
  # dispatch from a ref other than the default branch.
  group: review-signal-${{ ((github.event_name == 'pull_request_target' && (github.event.action != 'edited' || github.event.changes.base)) || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && format('pr-{0}', github.event.pull_request.number || github.event.inputs.pr) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  CODE_LABEL: 'needs:code-review'
  DESIGN_LABEL: 'needs:design-review'
  COMMUNITY_LABEL: 'community'

jobs:
  # ---------------------------------------------------------------------------
  # Detect signals from changed paths + author; label, request reviewers, gate.
  # ---------------------------------------------------------------------------
  flag:
    # A dispatch runs the workflow file from the selected ref; only the default
    # branch's copy may publish the gate.
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'edited' || github.event.changes.base != null))
      || (github.event_name == 'workflow_dispatch' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    name: Flag review signals
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      contents: read
      statuses: write
      checks: write
    steps:
      - name: Detect signals and route
        uses: actions/github-script@v9
        env:
          ENG_OWNERS: ${{ vars.ENGOWNERS }}
          DESIGN_OWNERS: ${{ vars.DESIGNOWNERS }}
        with:
          # api.github.com 503s intermittently; an unretried one used to leave a
          # PR with no review-required status at all, blocked forever on
          # "Expected — waiting for status" (#5149, #5152).
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const CODE = process.env.CODE_LABEL;
            const DESIGN = process.env.DESIGN_LABEL;
            const COMMUNITY = process.env.COMMUNITY_LABEL;

            // A pull request that moves, or whose file list and diff disagree,
            // while it is classified is read and classified again, at most this
            // many times, before the run fails without publishing a decision.
            const MAX_ATTEMPTS = 3;
            class Retry extends Error {}

            // Resolve which PR(s) to flag: the payload PR on a PR event, the
            // `pr` input on manual dispatch, or every open PR when it's blank
            // (backfill / mass recovery). Only numbers are taken here. Every
            // attempt below classifies the live PR: an event payload is a
            // snapshot from when GitHub queued the event, and the list endpoint
            // omits changed_files and stack.
            let numbers;
            if (context.eventName === 'workflow_dispatch') {
              const num = (context.payload.inputs.pr || '').trim();
              if (num) {
                numbers = [Number(num)];
              } else {
                const open = await github.paginate(github.rest.pulls.list, {
                  owner, repo, state: 'open', per_page: 100,
                });
                numbers = open.map((pr) => pr.number);
                core.info(`Backfill: re-flagging ${numbers.length} open PR(s).`);
              }
            } else {
              numbers = [context.payload.pull_request.number];
            }

            // Match the trusted workflow version: an older PR base can predate
            // this helper even though the running workflow requires it.
            let reviewDecisionLoad = null;
            function loadReviewDecision() {
              reviewDecisionLoad ??= (async () => {
                const { data: reviewDecisionFile } = await github.rest.repos.getContent({
                  owner, repo, ref: context.sha,
                  path: '.github/scripts/review-signal-decision.cjs',
                });
                const reviewDecisionSource = Buffer.from(
                  reviewDecisionFile.content,
                  'base64',
                ).toString('utf8');
                const reviewDecisionModule = { exports: {} };
                new Function('module', 'exports', 'require', reviewDecisionSource)(
                  reviewDecisionModule,
                  reviewDecisionModule.exports,
                  () => { throw new Error('review-signal-decision.cjs must stay dependency-free'); },
                );
                return reviewDecisionModule.exports;
              })();
              return reviewDecisionLoad;
            }

            let hadError = false;
            for (const number of numbers) {
              try {
                await flagOne(number);
              } catch (e) {
                hadError = true;
                core.warning(`Failed to flag PR #${number}: ${e.message}`);
              }
            }
            if (hadError) core.setFailed('One or more PRs failed to flag; see warnings.');

            async function flagOne(number) {
              let reason = '';
              for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1) {
                const { data: pr } = await github.rest.pulls.get({
                  owner, repo, pull_number: number,
                });
                if (pr.state !== 'open') {
                  core.info(`PR #${number} is ${pr.state}; nothing to flag.`);
                  return;
                }
                try {
                  await flagSnapshot(pr);
                  return;
                } catch (e) {
                  if (!(e instanceof Retry)) throw e;
                  reason = e.message;
                  core.info(`PR #${number} ${reason} (attempt ${attempt} of ${MAX_ATTEMPTS}); reading it again.`);
                }
              }
              throw new Error(`PR #${number} ${reason} on every attempt; refusing to publish a decision.`);
            }

            // ================= per-PR detection + routing =================
            // Classify one snapshot of a live PR. Throws Retry, with nothing
            // further published, when the PR's head, base, or stack changed
            // after the snapshot was read, or its file list and diff disagree.
            // Every label, reviewer, auto-merge, and status change re-reads
            // the PR first.
            async function flagSnapshot(pr) {
            const reviewDecision = await loadReviewDecision();
            // Commit statuses are shared by every PR with this head. Only a PR
            // the default branch's protection governs publishes the required
            // context; any other PR publishes one scoped to its own number.
            const scope = reviewDecision.gateScope(pr);
            const GATE = reviewDecision.gateContext('review-required', pr);
            async function moved() {
              const { data: live } = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number,
              });
              return !reviewDecision.samePullIdentity(pr, live);
            }
            // Called immediately before every mutation.
            async function ensureUnmoved() {
              if (await moved()) throw new Retry('moved while it was classified');
            }
            // The effective exact-head ENGOWNER approval, read live.
            async function readCodeApproval(engOwners) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              return reviewDecision.resolveReviewApprovals({
                reviews,
                headSha: pr.head.sha,
                engOwners,
                designOwners: [],
              }).codeApproved;
            }
            // The one path that writes the gate status. A required context is
            // shared by every PR with this head, so when another open PR that
            // also reads it shares the head, no single decision can be right
            // for both: publish pending until the heads differ. When the
            // decision rests on the approval state, that state is re-read
            // before the write and verified after it, because review-clear
            // can act on a review that lands in between; a change starts the
            // classification over.
            async function publishGate(state, description, approval = null) {
              let finalState = state;
              let finalDescription = description;
              if (scope.governed) {
                // Commit association omits fork PRs, so also scan the open
                // PRs for this exact head.
                const sameHead = new Set();
                const associated = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { owner, repo, commit_sha: pr.head.sha, per_page: 100 },
                );
                const open = await github.paginate(github.rest.pulls.list, {
                  owner, repo, state: 'open', per_page: 100,
                });
                for (const other of [...associated, ...open]) {
                  if (other.state === 'open' && other.head?.sha === pr.head.sha) sameHead.add(other.number);
                }
                sameHead.delete(pr.number);
                const others = [];
                for (const number of sameHead) {
                  const { data } = await github.rest.pulls.get({
                    owner, repo, pull_number: number,
                  });
                  others.push(data);
                }
                const siblings = reviewDecision.governedSiblings(pr, others);
                if (siblings.length) {
                  finalState = 'pending';
                  finalDescription = `Head is shared with open PR ${siblings.map((n) => `#${n}`).join(', ')}; each needs its own head.`.slice(0, 140);
                }
              }
              async function ensureApprovalUnchanged() {
                if (
                  approval &&
                  (await readCodeApproval(approval.engOwners)) !== approval.codeApproved
                ) {
                  throw new Retry('changed its review state while it was classified');
                }
              }
              await ensureApprovalUnchanged();
              await ensureUnmoved();
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: pr.head.sha,
                context: GATE, state: finalState, description: finalDescription,
              });
              core.info(`${GATE} status: ${finalState}`);
              await ensureApprovalUnchanged();
            }
            const author = pr.user.login.toLowerCase();
            // Bots (Dependabot, github-actions, etc.) are our own automation,
            // not community contributors, and their PRs (dep bumps, chores) are
            // mechanical and CI-gated. Exempt them from both the review gates
            // and the community label entirely.
            const authorIsBot = pr.user.type === 'Bot' || /\[bot\]$/.test(author);

            // --- Owner sets come from repo VARIABLES (vars.ENGOWNERS /
            // vars.DESIGNOWNERS), passed in as env above. No file read, no
            // content API — so there is nothing to 502 on. CODEOWNERS is NOT
            // read here: it is GitHub-native and auto-requests its reviewers on
            // every PR regardless of branch protection, which covers code
            // review for contributor and design-owner PRs. These lists are
            // CRITICAL: an empty/unset value would mis-bucket a real owner as a
            // community contributor and wrongly gate them. So treat an empty
            // owner list as a configuration error and THROW — the caller's
            // per-PR try/catch then skips this PR, LEAVES ITS GATE UNTOUCHED
            // (never a false success), and fails the run visibly. An unreadable
            // owner list is never "no owners".
            function parseHandles(text) {
              return ((text || '').match(/@?[A-Za-z0-9-]+/g) || [])
                .map((h) => h.replace(/^@/, '').toLowerCase());
            }
            function ownersFromVar(name) {
              const handles = parseHandles(process.env[name]);
              if (!handles.length) {
                throw new Error(`Owner variable ${name} is empty or unset — refusing to bucket authors from an empty list.`);
              }
              return handles;
            }
            const engOwners = ownersFromVar('ENG_OWNERS');
            const designOwners = ownersFromVar('DESIGN_OWNERS');
            const authorIsEng = engOwners.includes(author);
            const authorIsDesign = designOwners.includes(author);

            // Bot PRs: no gate, no community label. Set the check to success so
            // a required "review-required" doesn't block them, drop any stray
            // gate/community labels, and stop.
            if (authorIsBot) {
              core.info(`@${author} is a bot — exempt from review gates.`);
              const current = pr.labels.map((l) => l.name);
              for (const name of [CODE, DESIGN, COMMUNITY]) {
                if (current.includes(name)) {
                  await ensureUnmoved();
                  try {
                    await github.rest.issues.removeLabel({
                      owner, repo, issue_number: pr.number, name,
                    });
                  } catch (e) {
                    core.warning(`Could not remove ${name}: ${e.message}`);
                  }
                }
              }
              await publishGate(
                'success',
                'Automated (bot) PR — exempt from review gates.',
              );
              return;
            }

            // --- Changed files. ---
            const allFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            if (allFiles.length !== pr.changed_files) {
              // A push or retarget between the two reads changes the count;
              // otherwise the listing is incomplete and the gate fails closed.
              await ensureUnmoved();
              throw new Error(
                `GitHub returned ${allFiles.length} of ${pr.changed_files} changed files; refusing to classify an incomplete PR.`,
              );
            }
            // The file list decides the gate and the diff feeds the visual
            // classifier; they are separate reads, so they must describe the
            // same change before anything is decided. A disagreement is
            // retried (the PR moved, or GitHub served inconsistent data) and
            // never falls through to a decision. GitHub refuses a diff for a
            // very large PR; then the list is read twice and must match, and
            // the visual classifier is skipped (it fails closed).
            let diff = null;
            try {
              ({ data: diff } = await github.request(
                'GET /repos/{owner}/{repo}/pulls/{pull_number}',
                { owner, repo, pull_number: pr.number,
                  headers: { accept: 'application/vnd.github.diff' } },
              ));
              diff = String(diff);
            } catch (e) {
              if (e.status !== 406 && e.status !== 422) throw e;
              core.info(`GitHub did not serve a diff for PR #${pr.number} (${e.status}); checking the file list against a second read.`);
            }
            if (diff !== null) {
              if (!reviewDecision.diffMatchesFiles(diff, allFiles)) {
                await ensureUnmoved();
                throw new Retry('served a diff that does not describe its changed-file list');
              }
            } else {
              const again = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              if (!reviewDecision.sameFileList(allFiles, again)) {
                await ensureUnmoved();
                throw new Retry('served two different changed-file lists');
              }
            }
            // A change is excluded as a safe-space change only when both its
            // current and previous path are safe. This keeps unsafe→safe and
            // Core→safe renames visible and fail-closed.
            const {files, hasSafeBoundaryRename, paths} =
              reviewDecision.classifyReviewSignalPaths(allFiles);
            const isSafeSpace = reviewDecision.isSafeSpace;

            // Two DIFFERENT categories — do not conflate them:
            //
            //   SAFE SPACES — experimentation / staging. Exempt from BOTH gates.
            //     No review of any kind is expected here.
            //     lab, sandbox, storybook. A rename is safe only when both the
            //     previous and current paths are safe.
            //
            //   DESIGN SPACES — where design work lives. Exempt from the CODE
            //     gate (low-risk for code), but they TRIGGER the DESIGN gate.
            //     themes, templates, docsite.
            //
            // Both are low-risk for the CODE gate, so the code gate ignores
            // their union; only the design gate cares about the distinction.
            const isDesignSpace = (p) =>
              /^packages\/themes\//.test(p) ||
              /^packages\/cli\/templates\//.test(p) ||
              /^apps\/docsite\//.test(p);
            // Code gate ignores both categories.
            const isCodeExempt = (p) => isSafeSpace(p) || isDesignSpace(p);
            const consideredCode = paths.filter((p) => !isCodeExempt(p));

            // A "source barrel" is packages/<pkg>/src/**/index.ts(x). We do NOT
            // hardcode which packages are component libraries — any package's
            // src barrel counts, so new packages are covered automatically.
            // Safe/design spaces and lab are already excluded above.
            const isSrcBarrel = (p) =>
              /^packages\/[^/]+\/src\/(.+\/)?index\.tsx?$/.test(p);
            // A NEW component/module is a newly-added top-level src dir barrel.
            const isNewComponentBarrel = (p) =>
              /^packages\/[^/]+\/src\/[^/]+\/index\.tsx?$/.test(p) &&
              !isCodeExempt(p);
            // Any RUNTIME change under core/src (incl. styling .tsx) is
            // higher-blast-radius than a leaf change — core is what everything
            // composites over, so a change there warrants review even when it's
            // styling-only. Docs/tests/stories are excluded (they don't gate).
            const isCoreRuntime = (p) =>
              /^packages\/core\/src\/.+\.tsx?$/.test(p) &&
              !/\.test\.tsx?$/.test(p) &&
              !/\.doc\.mjs$/.test(p) &&
              !/\.stories\.tsx?$/.test(p);

            // ============ HIGH-RISK CODE ============
            const codeReasons = [];
            if (hasSafeBoundaryRename) {
              codeReasons.push('safe-space boundary rename');
            }
            const newPackage = files.some(
              (f) => f.status === 'added' &&
                /^packages\/[^/]+\/package\.json$/.test(f.filename),
            );
            if (newPackage) codeReasons.push('new package');
            const newComponent = files.some(
              (f) => f.status === 'added' && isNewComponentBarrel(f.filename),
            );
            if (newComponent) codeReasons.push('new component/module');
            const apiSurface = consideredCode.some(
              (p) => isSrcBarrel(p) || /^packages\/[^/]+\/package\.json$/.test(p),
            );
            if (apiSurface && !newPackage && !newComponent) {
              codeReasons.push('public API surface change');
            }
            const coreChange = paths.some(isCoreRuntime);

            // ============ DESIGN-AFFECTING ============
            // DESIGN SPACES trigger this gate; SAFE SPACES never do (both
            // defined above). Keyed on visual signals, NOT on "a new dir
            // appeared" (that caught infra like i18n) and NOT on docs
            // (.doc.mjs / .md / content).
            //   - Component StyleX — visual changes to shipped components,
            //     anywhere except a safe space.
            //   - themes / templates — design spaces (themes src, template .tsx).
            //   - docsite — a published design surface, but only its VISUAL dirs
            //     (app/, components/, themes/); blog/markdown content, lib/data
            //     plumbing, generated output, and tests are skipped.
            const isDocsiteVisual = (p) =>
              /^apps\/docsite\/src\/(app|components|themes)\/.+\.(tsx|stylex\.ts)$/.test(p) &&
              !/\.test\.tsx?$/.test(p);
            const designReasons = [];
            if (paths.some((p) => /\.stylex\.tsx?$/.test(p) && !isSafeSpace(p))) designReasons.push('StyleX styles');
            if (paths.some((p) => /^packages\/themes\/.+\/src\/.+\.tsx?$/.test(p))) designReasons.push('theme/token change');
            if (paths.some((p) => /^packages\/cli\/templates\/.+\.tsx$/.test(p))) designReasons.push('template change');
            if (paths.some(isDocsiteVisual)) designReasons.push('docsite visual change');

            // Content-based visual signal (#3667). The classifier also proves
            // the narrower appearance-only exception for DESIGNOWNER authors.
            // It and the diff both come from the API: trusted source, inert PR
            // diff text. A default-branch base commit is reviewed code; a
            // stacked PR's base is another PR's unmerged head, so its classifier
            // comes from the trusted workflow SHA instead. Any fetch or parse
            // failure keeps the exception false, so Core runtime changes
            // continue to require engineering.
            let visualClassification = null;
            if (coreChange || designReasons.length === 0) {
              try {
                const classifierRef = scope.targetsDefaultBranch ? pr.base.sha : context.sha;
                const { data: libFile } = await github.rest.repos.getContent({
                  owner, repo, ref: classifierRef,
                  path: '.github/scripts/lib/classify-visual.js',
                });
                const libSrc = Buffer.from(libFile.content, 'base64').toString('utf8');
                const mod = { exports: {} };
                new Function('module', 'exports', 'require', libSrc)(
                  mod, mod.exports,
                  () => { throw new Error('classify-visual.js must stay dependency-free'); },
                );
                if (diff === null) {
                  throw new Error('no diff is available for this PR');
                }
                const sources = {};
                const coreRuntimeFiles = files.filter((file) =>
                  isCoreRuntime(file.filename) ||
                  (file.previous_filename && isCoreRuntime(file.previous_filename)),
                );
                async function readSource(fullName, ref, filePath) {
                  const [sourceOwner, sourceRepo] = fullName.split('/');
                  const { data } = await github.rest.repos.getContent({
                    owner: sourceOwner,
                    repo: sourceRepo,
                    ref,
                    path: filePath,
                  });
                  if (Array.isArray(data) || data.type !== 'file' || !data.content) {
                    throw new Error(`Could not read source bytes for ${filePath}.`);
                  }
                  return Buffer.from(data.content, 'base64').toString('utf8');
                }
                for (const file of coreRuntimeFiles) {
                  const previousPath = file.previous_filename || file.filename;
                  if (file.status !== 'modified' || previousPath !== file.filename) {
                    continue;
                  }
                  const [baseSource, headSource] = await Promise.all([
                    readSource(
                      pr.base.repo.full_name,
                      pr.base.sha,
                      previousPath,
                    ),
                    readSource(
                      pr.head.repo.full_name,
                      pr.head.sha,
                      file.filename,
                    ),
                  ]);
                  sources[file.filename] = {base: baseSource, head: headSource};
                }
                visualClassification = mod.exports.classifyVisualDiff(diff, {
                  ignorePath: isSafeSpace,
                  sources,
                });
                core.info(`visual content score: ${visualClassification.score} (${visualClassification.bucket}); appearanceOnly=${visualClassification.appearanceOnly}`);
                if (
                  designReasons.length === 0 &&
                  (visualClassification.bucket === 'visual' ||
                    visualClassification.bucket === 'likely-visual')
                ) {
                  designReasons.push(
                    `visual diff content (score ${visualClassification.score})`,
                  );
                }
              } catch (e) {
                core.warning(`Content-based visual classification failed closed: ${e.message}`);
              }
            }

            const appearanceOnly = visualClassification?.appearanceOnly === true;
            if (coreChange && !codeReasons.includes('new component/module')) {
              codeReasons.push(appearanceOnly ? 'core visual change' : 'core change');
            }

            // ALL contributor (non-owner) PRs require code review. The narrow
            // appearance-only exception below is available only to a DESIGNOWNER;
            // external contributors stay in the normal contribution flow.
            const authorIsOwner = authorIsEng || authorIsDesign;
            if (!authorIsOwner) codeReasons.push('community contribution');

            const onlyCoreVisualChange =
              codeReasons.length === 1 && codeReasons[0] === 'core visual change';
            const designOwnerAppearanceSelfServe =
              authorIsDesign && appearanceOnly && onlyCoreVisualChange;
            // Eng owners self-serve all code. Design owners self-serve only the
            // classifier-proven appearance-only Core case above.
            const codeHighRisk =
              codeReasons.length > 0 &&
              !authorIsEng &&
              !designOwnerAppearanceSelfServe;

            // Design owners self-serve design — no design tag for them.
            const designAffecting = designReasons.length > 0 && !authorIsDesign;

            core.info(`author=@${author} eng=${authorIsEng} design=${authorIsDesign}`);
            core.info(`code: ${codeHighRisk} (${codeReasons.join(', ') || '-'})`);
            core.info(`design: ${designAffecting} (${designReasons.join(', ') || '-'})`);

            // --- Resolve approvals by reading reviews (fork-safe). ---
            // The clear job runs on pull_request_review, but that event does NOT
            // reliably dispatch a workflow run for FORK PRs — so a fork
            // contributor's gate would never clear via that path. Instead, read
            // the PR's reviews here (this job runs on pull_request_target and
            // workflow_dispatch, both of which work for forks) and treat a gate
            // as satisfied when an entitled owner has approved:
            //   code gate   → an ENGOWNER approval
            //   design gate → a DESIGNOWNER approval
            // Only reviews whose commit_id equals this current PR head count.
            // Within that head, each reviewer's latest APPROVED /
            // CHANGES_REQUESTED / DISMISSED state wins. An H1 approval can never
            // clear H2 for either engineering or design.
            let codeApproved = false;
            let designApproved = false;
            try {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              ({codeApproved, designApproved} =
                reviewDecision.resolveReviewApprovals({
                  reviews,
                  headSha: pr.head.sha,
                  engOwners,
                  designOwners,
                }));
            } catch (e) {
              core.warning(`Could not resolve exact-head reviews: ${e.message}`);
            }

            // Effective gate = detected gate minus what an entitled owner
            // already approved.
            const codeGated = codeHighRisk && !codeApproved;
            const designGated = designAffecting && !designApproved;
            core.info(`approvals: code=${codeApproved} design=${designApproved} → codeGated=${codeGated} designGated=${designGated}`);

            // --- Apply labels. ---
            const current = pr.labels.map((l) => l.name);
            const toAdd = [];
            if (codeGated && !current.includes(CODE)) toAdd.push(CODE);
            if (designGated && !current.includes(DESIGN)) toAdd.push(DESIGN);
            // A quiet "community" marker on PRs authored by someone who is not
            // on the eng or design team, so the contribution queue is filterable
            // (label:community) separately from the review gates. Absence = team.
            // (authorIsOwner is defined above.)
            if (!authorIsOwner && !current.includes(COMMUNITY)) toAdd.push(COMMUNITY);
            if (toAdd.length) {
              await ensureUnmoved();
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: toAdd,
              });
            }
            // Keep it accurate: if an owner's PR somehow carries it (e.g. author
            // was added to an owners file after opening), drop it.
            if (authorIsOwner && current.includes(COMMUNITY)) {
              await ensureUnmoved();
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pr.number, name: COMMUNITY,
                });
              } catch (e) {
                core.warning(`Could not remove ${COMMUNITY}: ${e.message}`);
              }
            }
            // Remove gate labels an entitled owner has already approved away
            // (fork-safe clearing — the pull_request_review clear job doesn't
            // fire for forks, so we reconcile here from the reviews we read).
            async function dropLabel(name) {
              await ensureUnmoved();
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pr.number, name,
                });
                core.info(`Cleared ${name} (approved).`);
              } catch (e) {
                core.warning(`Could not remove ${name}: ${e.message}`);
              }
            }
            if (!codeGated && current.includes(CODE)) await dropLabel(CODE);
            if (!designGated && current.includes(DESIGN)) await dropLabel(DESIGN);

            // --- Request reviewers (can't request the author; ignore 422s). ---
            // Code review is left to GitHub-native CODEOWNERS auto-request (it
            // requests the codeowners on every PR regardless of branch
            // protection). We only add DESIGN owners, and only when a design
            // gate actually fires — so design owners aren't pinged on every PR.
            async function requestReviewers(handles) {
              const reviewers = [...new Set(handles)].filter((h) => h !== author);
              if (!reviewers.length) return;
              await ensureUnmoved();
              try {
                await github.rest.pulls.requestReviewers({
                  owner, repo, pull_number: pr.number, reviewers,
                });
              } catch (e) {
                core.warning(`requestReviewers(${reviewers.join(',')}) failed: ${e.message}`);
              }
            }
            if (designGated) await requestReviewers(designOwners);

            // --- Only the CODE gate blocks. Design review is advisory:
            //     it labels + requests design owners (above) but does NOT
            //     disable auto-merge or block the merge. ---
            if (codeGated && pr.auto_merge) {
              await ensureUnmoved();
              try {
                await github.graphql(
                  `mutation ($id: ID!) {
                     disablePullRequestAutoMerge(input: { pullRequestId: $id }) {
                       pullRequest { number }
                     }
                   }`,
                  { id: pr.node_id },
                );
                core.info('Disabled auto-merge (code review required).');
              } catch (e) {
                core.warning(`Could not disable auto-merge: ${e.message}`);
              }
            }

            // No explanatory comment is posted here on purpose. The label and
            // status are the mechanical signals; reviews provide judgment
            // separately rather than through a static workflow comment.

            // --- The blocking gate: a "review-required" COMMIT STATUS. ---
            // We use a commit STATUS (not a check run) for two reasons:
            //   1. Branch protection here requires the "review-required" context
            //      as a status context ("Expected — Waiting for status to be
            //      reported"), which only a commit status satisfies — a check
            //      run of the same name does not clear it.
            //   2. A pending status renders as a neutral YELLOW dot ("waiting"),
            //      not a red failure like a check run's action_required — so a
            //      PR awaiting review doesn't add red noise to the queue.
            // Only the CODE gate drives it (design is advisory). pending blocks
            // (branch protection passes only success); an owner's code approval
            // flips it to success.
            const gateReasons = codeGated ? codeReasons : [];
            // Never swallow a failure here: the status IS the gate, so a PR
            // whose POST failed is blocked on a status that will never arrive.
            // Throwing marks the run red and lets the per-PR catch continue a
            // backfill; re-run the workflow to retry.
            const gateDescription = codeGated
              ? `Waiting on code review: ${gateReasons.join(', ')}`.slice(0, 140)
              : codeHighRisk && codeApproved
                ? 'Cleared by code-owner approval.'
                : 'No code review required.';
            // Only a code-gated decision rests on the approval state.
            await publishGate(
              codeGated ? 'pending' : 'success',
              gateDescription,
              codeHighRisk ? { codeApproved, engOwners } : null,
            );
            // Neutralize any stale "review-required" CHECK RUN left over from the
            // pre-status gate. Such a leftover (conclusion action_required) drags
            // the status rollup to FAILURE even though we now gate via a commit
            // status — so once the status is set, clear the old check-run.
            let staleRuns = [];
            try {
              const { data } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, check_name: 'review-required', per_page: 100,
              });
              staleRuns = data.check_runs.filter((cr) =>
                cr.conclusion && cr.conclusion !== 'success' && cr.conclusion !== 'neutral');
            } catch (e) {
              core.warning(`Could not list stale check-runs: ${e.message}`);
            }
            for (const cr of staleRuns) {
              await ensureUnmoved();
              try {
                await github.rest.checks.update({
                  owner, repo, check_run_id: cr.id,
                  conclusion: 'neutral',
                  output: { title: 'Superseded by review-required status', summary: 'The gate is now a review-required commit status; see that context.' },
                });
                core.info(`Neutralized stale review-required check-run ${cr.id}.`);
              } catch (e) {
                core.warning(`Could not neutralize stale check-run: ${e.message}`);
              }
            }
            // A PR retargeted onto the default branch (or into a native stack
            // on it) keeps the scoped status its stacked runs published for
            // this head. Retire it so a stale pending dot does not linger.
            if (scope.governed) {
              const stackedContext = `review-required/stacked-pr-${pr.number}`;
              let stale = null;
              try {
                const statuses = await github.paginate(
                  github.rest.repos.listCommitStatusesForRef,
                  { owner, repo, ref: pr.head.sha, per_page: 100 },
                );
                stale = statuses.find((status) => status.context === stackedContext);
              } catch (e) {
                core.warning(`Could not read ${stackedContext}: ${e.message}`);
              }
              if (stale?.state === 'pending') {
                await ensureUnmoved();
                try {
                  await github.rest.repos.createCommitStatus({
                    owner, repo, sha: pr.head.sha, context: stackedContext,
                    state: 'success',
                    description: 'Superseded: this PR is now gated by review-required.',
                  });
                } catch (e) {
                  core.warning(`Could not retire ${stackedContext}: ${e.message}`);
                }
              }
            }
            } // end flagSnapshot

  # Anchor the clear/restore chain for every review state that can change the
  # effective exact-head engineering approval.
  review-anchor:
    if: >-
      github.event_name == 'pull_request_review' &&
      contains(fromJSON('["approved","changes_requested","dismissed"]'), github.event.review.state)
    name: Anchor review-clear chain
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Note review state change
        run: echo "Review state changed; review-clear will reconcile the code gate."
