# PR CI: test, build, analyze, a11y audit, and comment
# Everything runs in parallel where possible
#
# Merge queue: test + build also run on merge_group events so the
# merge queue can gate on them before landing a PR.
name: CI

on:
  pull_request:
    branches: ['main', 'release/**']
  merge_group:
  # Explicit release checks and baseline capture share the canonical owners.
  # Reviewed captures are committed through a normal pull request.
  workflow_dispatch:
    inputs:
      operation:
        description: 'Check the marked release branch or capture a main baseline candidate'
        type: choice
        options: [capture, release-check]
        default: capture
        required: true
      release-branch:
        description: 'Marked release/vX.Y.Z branch; required for release-check'
        type: string
        required: false
      release-version:
        description: 'Exact X.Y.Z version recorded by the active marker; required for release-check'
        type: string
        required: false
      expected-head:
        description: 'Exact full release branch SHA; required for release-check'
        type: string
        required: false
      plan-digest:
        description: 'Exact SHA-256 digest recorded by the active marker; required for release-check'
        type: string
        required: false

permissions: {}

concurrency:
  group: 'ci-${{ github.event.merge_group.head_sha || github.head_ref || github.run_id }}'
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  maintenance-request:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'capture'
    runs-on: ubuntu-slim
    steps:
      - name: Require explicit main-branch maintenance
        run: |
          set -eu
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Baseline maintenance must be dispatched from main.'
            exit 1
          fi

  # Detect lightweight changes. Missing merge-base data fails closed.
  check-scope:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'release-check'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      docsite_only: ${{ steps.scope.outputs.docsite_only }}
      spec_only: ${{ steps.scope.outputs.spec_only }}
      tooling_only: ${{ steps.scope.outputs.tooling_only }}
      release_bump: ${{ steps.scope.outputs.release_bump }}
      release_branch: ${{ steps.release-authority.outputs.branch }}
      release_head: ${{ steps.release-authority.outputs.head }}
      release_plan_digest: ${{ steps.release-authority.outputs.planDigest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fetch active release refs
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check') ||
          (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/v'))
        run: git fetch origin '+refs/heads/release/v*:refs/remotes/origin/release/v*'

      - name: Validate active release authority
        id: release-authority
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check') ||
          (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/v'))
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs['release-branch'] || github.base_ref }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs['release-version'] || '' }}
          EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs['expected-head'] || github.event.pull_request.head.sha }}
          PLAN_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs['plan-digest'] || '' }}
          RECEIPT_HEAD: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.base_ref }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'check' || 'pr' }}
        run: |
          set -eu
          TRUSTED_POLICY="$RUNNER_TEMP/release-policy"
          mkdir -p "$TRUSTED_POLICY/scripts/release" "$TRUSTED_POLICY/scripts/lib"
          git show "origin/$RELEASE_BRANCH:scripts/release/active-release.mjs" \
            > "$TRUSTED_POLICY/scripts/release/active-release.mjs"
          git show "origin/$RELEASE_BRANCH:scripts/lib/workspace-globs.mjs" \
            > "$TRUSTED_POLICY/scripts/lib/workspace-globs.mjs"
          VALIDATOR="$TRUSTED_POLICY/scripts/release/active-release.mjs"
          ACTIVE_BRANCHES=$(node "$VALIDATOR" list-active --root "$GITHUB_WORKSPACE")
          ARGS=(
            validate
            --root "$GITHUB_WORKSPACE"
            --mode "$MODE"
            --release-branch "$RELEASE_BRANCH"
            --expected-head "$EXPECTED_HEAD"
            --checkout-sha "$RECEIPT_HEAD"
            --ref-name "$REF_NAME"
            --active-branches "$ACTIVE_BRANCHES"
          )
          if [ "$MODE" = check ]; then
            ARGS+=(--release-version "$RELEASE_VERSION" --plan-digest "$PLAN_DIGEST")
            REMOTE_HEAD=$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')
            ARGS+=(--remote-head "$REMOTE_HEAD")
          fi
          node "$VALIDATOR" "${ARGS[@]}"

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=50

      - name: Determine change scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            printf 'docsite_only=false\nspec_only=false\ntooling_only=false\nrelease_bump=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$BASE_REF" == release/v* ]]; then
            # Release bump PRs contain generated bookkeeping only. The final
            # branch head receives one full visual/a11y/RTL release-check.
            printf 'docsite_only=false\nspec_only=true\ntooling_only=true\nrelease_bump=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MERGE_BASE=$(git merge-base HEAD origin/${{ github.base_ref }} 2>/dev/null || echo "")
          if [ -z "$MERGE_BASE" ]; then
            printf 'docsite_only=false\nspec_only=false\ntooling_only=false\nrelease_bump=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'release_bump=false' >> "$GITHUB_OUTPUT"
          CLASSIFIER_ROOT="$RUNNER_TEMP/change-scope"
          CLASSIFIER_DIR="$CLASSIFIER_ROOT/.github/scripts"
          REGISTRY_DIR="$CLASSIFIER_ROOT/scripts"
          mkdir -p "$CLASSIFIER_DIR" "$REGISTRY_DIR"
          CLASSIFIER="$CLASSIFIER_DIR/change-scope.cjs"
          MATCHER="$CLASSIFIER_DIR/knowledge-paths.cjs"
          REGISTRY="$REGISTRY_DIR/component-packages.cjs"
          if git show "origin/${{ github.base_ref }}:.github/scripts/change-scope.cjs" > "$CLASSIFIER" 2>/dev/null \
            && git show "origin/${{ github.base_ref }}:.github/scripts/knowledge-paths.cjs" > "$MATCHER" 2>/dev/null \
            && git show "origin/${{ github.base_ref }}:scripts/component-packages.cjs" > "$REGISTRY" 2>/dev/null; then
            git diff --name-status "$MERGE_BASE"...HEAD \
              | node "$CLASSIFIER" --github-output
          else
            # Missing trusted policy or dependencies cannot grant a specialized
            # lane. Run broad CI until the base branch supplies the full classifier.
            printf 'docsite_only=false\nspec_only=false\ntooling_only=false\n' \
              >> "$GITHUB_OUTPUT"
          fi
  # Generated-only version PR lane. It validates release bookkeeping in a few
  # minutes; the merged branch head receives one full visual/a11y/RTL projection.
  release-bump:
    needs: [check-scope]
    if: ${{ github.event_name == 'pull_request' && needs.check-scope.outputs.release_bump == 'true' }}
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch release refs, base, and trusted release policy
        run: |
          git fetch origin '+refs/heads/release/v*:refs/remotes/origin/release/v*'
          git fetch origin "${{ github.base_ref }}" --depth=50
          TRUSTED_POLICY="$RUNNER_TEMP/release-policy"
          mkdir -p "$TRUSTED_POLICY/scripts/release" "$TRUSTED_POLICY/scripts/lib"
          git show "origin/${{ github.base_ref }}:scripts/release/active-release.mjs" \
            > "$TRUSTED_POLICY/scripts/release/active-release.mjs"
          git show "origin/${{ github.base_ref }}:scripts/lib/workspace-globs.mjs" \
            > "$TRUSTED_POLICY/scripts/lib/workspace-globs.mjs"

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup

      - name: Require generated-only release bookkeeping
        run: |
          node "$RUNNER_TEMP/release-policy/scripts/release/active-release.mjs" validate-diff \
            --root "$GITHUB_WORKSPACE" \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Validate branch, head, plan, versions, and Changeset consumption
        run: |
          set -eu
          VALIDATOR="$RUNNER_TEMP/release-policy/scripts/release/active-release.mjs"
          ACTIVE_BRANCHES=$(node "$VALIDATOR" list-active --root "$GITHUB_WORKSPACE")
          node "$VALIDATOR" validate \
            --root "$GITHUB_WORKSPACE" \
            --mode pr \
            --release-branch "${{ github.base_ref }}" \
            --expected-head "${{ github.event.pull_request.head.sha }}" \
            --checkout-sha "${{ github.event.pull_request.head.sha }}" \
            --ref-name "${{ github.base_ref }}" \
            --active-branches "$ACTIVE_BRANCHES" \
            | tee release-bump-receipt.json

      - name: Validate generated changelogs and codemods
        run: |
          pnpm check:changesets
          node scripts/format-changelogs.mjs --check
          VERSION=$(node -p "require('./.release/active.json').version")
          pnpm exec vitest run \
            "packages/cli/assets/codemods/transforms/v${VERSION}/__tests__" \
            packages/cli/assets/codemods/__tests__/registry.test.mjs

      - name: Upload exact-head release bump receipt
        uses: actions/upload-artifact@v7
        with:
          name: release-bump-receipt-${{ github.event.pull_request.head.sha }}
          path: release-bump-receipt.json
          retention-days: 30

  release-sync:
    name: release-sync
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    # Match the stable publisher so byte parity covers the same packed manifest.
    runs-on: 4-core-ubuntu
    permissions:
      contents: read
    steps:
      - name: Checkout sync candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect and require the release-sync branch contract
        id: release-sync-scope
        env:
          SYNC_BRANCH: ${{ github.head_ref }}
        run: |
          set -eu
          git fetch origin main
          BASE_VERSION=$(git show origin/main:packages/core/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          HEAD_VERSION=$(node -p "require('./packages/core/package.json').version")
          case "$SYNC_BRANCH" in
            chore/sync-v*-to-main)
              VERSION=${SYNC_BRANCH#chore/sync-v}
              VERSION=${VERSION%-to-main}
              printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
              test "$HEAD_VERSION" = "$VERSION"
              echo 'required=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              if [ "$HEAD_VERSION" != "$BASE_VERSION" ]; then
                echo 'A stable package-version change on main must use chore/sync-vX.Y.Z-to-main and pass release-sync.'
                exit 1
              fi
              echo 'required=false' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Fetch release authority and trusted validator
        if: steps.release-sync-scope.outputs.required == 'true'
        run: |
          set -eu
          git fetch origin main 'refs/tags/v*:refs/tags/v*' '+refs/heads/release/v*:refs/remotes/origin/release/v*'
          TRUSTED_POLICY="$RUNNER_TEMP/release-policy"
          mkdir -p "$TRUSTED_POLICY/scripts/release" "$TRUSTED_POLICY/scripts/lib"
          git show origin/main:scripts/release/active-release.mjs \
            > "$TRUSTED_POLICY/scripts/release/active-release.mjs"
          git show origin/main:scripts/lib/workspace-globs.mjs \
            > "$TRUSTED_POLICY/scripts/lib/workspace-globs.mjs"

      - name: Validate published bytes and consumed-only Changeset sync
        if: steps.release-sync-scope.outputs.required == 'true'
        env:
          SYNC_BRANCH: ${{ github.head_ref }}
        run: |
          set -eu
          VERSION=${SYNC_BRANCH#chore/sync-v}
          VERSION=${VERSION%-to-main}
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          VALIDATOR="$RUNNER_TEMP/release-policy/scripts/release/active-release.mjs"
          ACTIVE_BRANCHES=$(node "$VALIDATOR" list-active --root "$GITHUB_WORKSPACE")
          node "$VALIDATOR" validate-sync \
            --root "$GITHUB_WORKSPACE" \
            --base origin/main \
            --release-ref "v$VERSION" \
            --active-branches "$ACTIVE_BRANCHES"

      - name: Setup Node and pnpm for published-byte verification
        if: steps.release-sync-scope.outputs.required == 'true'
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Verify immutable tag package bytes match npm
        if: steps.release-sync-scope.outputs.required == 'true'
        env:
          SYNC_BRANCH: ${{ github.head_ref }}
        run: |
          set -eu
          VERSION=${SYNC_BRANCH#chore/sync-v}
          VERSION=${VERSION%-to-main}
          TAG_ROOT="$RUNNER_TEMP/release-tag"
          git worktree add --detach "$TAG_ROOT" "v$VERSION"
          cd "$TAG_ROOT"
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/release/verify-published.mjs --version "$VERSION"

  # Required docsite owner: data tests plus the production browser contract.
  docsite-test:
    needs: [check-scope, docsite-browser]
    if: ${{ github.event_name != 'workflow_dispatch' && needs.check-scope.outputs.release_bump != 'true' && always() && !cancelled() }}
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - name: Require successful scope classification
        if: needs.check-scope.result != 'success'
        run: |
          echo "Change scope could not be classified; refusing to skip required work."
          exit 1

      - name: Require successful docsite browser contract
        if: needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        env:
          DOCSITE_BROWSER_RESULT: ${{ needs.docsite-browser.result }}
        run: test "$DOCSITE_BROWSER_RESULT" = 'success'

      - name: Skip docsite work for Node tooling
        if: needs.check-scope.outputs.tooling_only == 'true'
        run: echo "Node-tooling PR — docsite generation is not an owned check"

      - uses: actions/checkout@v7

      # Spec validation imports the canonical CLI discovery path, so the
      # lightweight docs path needs workspace dependencies too.
      - uses: ./.github/actions/setup
        if: needs.check-scope.outputs.tooling_only != 'true'

      - name: Validate spec records
        if: needs.check-scope.outputs.spec_only == 'true'
        run: node scripts/check-knowledge.mjs

      # Docsite `generate` runs `astryx theme build`, which imports the compiled
      # @astryxdesign/core/theme entry (dist/theme/index.js). Build core first so that
      # entry exists — otherwise generate fails with "Cannot find module".
      - name: Build core package
        if: needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/core build

      # The generated preview registry imports every configured canary component
      # package. Build those exports so Vitest exercises the same graph as the
      # canary deployment.
      - name: Build canary component packages
        if: needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: |
          pnpm -F @astryxdesign/lab build
          pnpm -F @astryxdesign/charts build
          pnpm -F @astryxdesign/richtext build
          pnpm -F @astryxdesign/vega build

      - name: Generate and test docsite data
        if: needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/docsite generate && pnpm -F @astryxdesign/docsite test

  # Docsite browser contracts. The playground preview runs user-authored code
  # in a sandboxed iframe whose only tie to the page is a nonce-attested
  # MessagePort handshake (apps/docsite/src/app/playground/previewChannel.ts).
  # jsdom can drive that state machine but cannot prove the integration: that
  # the frame's real `load` event reaches it, that a replaced document is torn
  # down and the current code and theme reach its successor, and that a
  # document previewed code navigated the frame to receives nothing. Only the
  # production build has the opaque-origin sandbox at all, so this job builds
  # the docsite and drives `next start` in Chromium. Its outcome feeds the
  # existing required docsite-test context; it is not another required lane.
  docsite-browser:
    needs: [check-scope]
    if: github.event_name != 'workflow_dispatch' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install Playwright
        run: npx playwright install chromium

      # The production build imports every theme package's built entry and the
      # canary component packages, on top of core.
      - name: Build docsite workspace dependencies
        run: |
          pnpm -F @astryxdesign/core build
          pnpm -F @astryxdesign/lab build
          pnpm -F @astryxdesign/charts build
          pnpm -F @astryxdesign/richtext build
          pnpm -F @astryxdesign/vega build
          pnpm -F @astryxdesign/theme-neutral build
          pnpm -F @astryxdesign/theme-matcha build
          pnpm -F @astryxdesign/theme-stone build
          pnpm -F @astryxdesign/theme-gothic build
          pnpm -F @astryxdesign/theme-chocolate build
          pnpm -F @astryxdesign/theme-y2k build
          pnpm -F @astryxdesign/theme-butter build

      - name: Build the docsite
        run: pnpm -F @astryxdesign/docsite build

      - name: Run docsite browser contracts
        run: pnpm test:docsite-browser

      - name: Upload docsite browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docsite-browser-evidence
          path: test-results/docsite/
          if-no-files-found: error
          retention-days: 7

  # Lightweight check — does the PR touch any published components?
  # Gates pr-a11y and pr-rtl to avoid unnecessary work.
  #
  # `scripts/component-packages.cjs` owns the component source roots used here
  # and by the RTL roster. `analyze-pr.js` still decides which changed components
  # each downstream audit receives. When those projections disagree the audits
  # silently no-op, so harness/registry changes also exercise the RTL smoke scope.
  # Spec-only changes keep only the trusted scope classifier and the
  # knowledge validator below. Unrelated component discovery must not take a
  # runner or fan out into visual, accessibility, or RTL work.
  check-components:
    needs: [check-scope]
    if: (github.event_name == 'pull_request' && needs.check-scope.outputs.spec_only != 'true') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check')
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      has_components: ${{ steps.check.outputs.has_components }}
      has_rtl_components: ${{ steps.check.outputs.has_rtl_components }}
      has_rtl_harness: ${{ steps.check.outputs.has_rtl_harness }}
      force_full_component_audits: ${{ steps.check.outputs.force_full_component_audits }}
      # Stable visual scope is separate from component scope: Core and the
      # non-private shipped themes participate; canaryOnly packages do not.
      has_stable_visual: ${{ steps.check.outputs.has_stable_visual }}
      broad_stable_visual: ${{ steps.check.outputs.broad_stable_visual }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Depth 50 (same as check-scope) so the three-dot diff below can find
          # a merge base. With the default depth of 1 the diff fails with
          # "no merge base", the error is swallowed by the pipeline, and
          # has_components silently becomes false — skipping pr-a11y entirely.
          fetch-depth: 50

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=50

      - name: Check for component changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            printf 'has_components=true\nhas_rtl_components=true\nhas_rtl_harness=true\nforce_full_component_audits=true\nhas_stable_visual=true\nbroad_stable_visual=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ needs.check-scope.outputs.docsite_only }}" = "true" ] \
            || [ "${{ needs.check-scope.outputs.spec_only }}" = "true" ] \
            || [ "${{ needs.check-scope.outputs.tooling_only }}" = "true" ]; then
            printf 'has_components=false\nhas_rtl_components=false\nhas_rtl_harness=false\nforce_full_component_audits=false\nhas_stable_visual=false\n' >> "$GITHUB_OUTPUT"
            echo "Trusted specialized lane — component audits explicitly not applicable."
            exit 0
          fi
          if ! MERGE_BASE=$(git merge-base HEAD origin/${{ github.base_ref }} 2>/dev/null); then
            echo "::warning::No merge base between HEAD and origin/${{ github.base_ref }} — running full component audits"
            printf 'has_components=true\nhas_rtl_components=true\nhas_rtl_harness=true\nforce_full_component_audits=true\n' >> "$GITHUB_OUTPUT"
            echo "has_stable_visual=true" >> "$GITHUB_OUTPUT"
            echo "broad_stable_visual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          POLICY_ROOT="$RUNNER_TEMP/component-audit-scope"
          mkdir -p "$POLICY_ROOT/.github/scripts" "$POLICY_ROOT/scripts"
          SCOPE="$POLICY_ROOT/.github/scripts/component-audit-scope.cjs"
          REGISTRY="$POLICY_ROOT/scripts/component-packages.cjs"
          if git show "origin/${{ github.base_ref }}:.github/scripts/component-audit-scope.cjs" > "$SCOPE" 2>/dev/null \
            && git show "origin/${{ github.base_ref }}:scripts/component-packages.cjs" > "$REGISTRY" 2>/dev/null; then
            git diff --name-status "$MERGE_BASE"...HEAD \
              | node "$SCOPE" --registry "$REGISTRY" --github-output
          else
            echo "::warning::Trusted component audit policy is unavailable — running full component audits"
            printf 'has_components=true\nhas_rtl_components=true\nhas_rtl_harness=true\nforce_full_component_audits=true\n' >> "$GITHUB_OUTPUT"
          fi

          FILES=$(git diff --name-only "$MERGE_BASE"...HEAD)

          # One classifier owns the release-channel rule. It reads each
          # package's `astryx.canaryOnly` metadata rather than hard-coding
          # today's Lab/charts/richtext/vega list.
          printf '%s\n' "$FILES" \
            | node .github/scripts/visual-scope.mjs --github-output "$GITHUB_OUTPUT"

  # Tests run as two parallel lanes joined by `test` below.
  #
  # They used to be one `pnpm test` on a 2-core runner, which ran both Vitest
  # projects back to back and was terminated around 20 minutes with no summary
  # — no assertion output, so nothing said which suite was at fault. `main` was
  # already at ~19m15, so the budget, not any one test, was the defect.
  #
  # The projects are independent by construction (see vitest.config.ts: `ui` is
  # jsdom + StyleX, `node` is everything else), so running them as two jobs
  # costs no duplicate execution. They do NOT carry half the work each: on this
  # CI, `ui` is ~5x the heavier lane, so it takes the larger runner.
  #
  # The earlier local figure that put `node` ahead (570s vs 244s) was not a
  # comparable measurement — only the node run was bounded to a small worker
  # pool, and node is the project whose cost is per-assertion CLI subprocesses.
  #
  # The repo-wide guardrail steps ride `test-ui` (~18s of it).
  #
  # `test` remains a job, so the required check of that name still exists and
  # still reports for every PR. This mirrors the `build` join over
  # build-storybook + build-sandbox below.
  test-ui:
    needs: [check-scope]
    if: ${{ github.event_name != 'workflow_dispatch' && always() && !cancelled() && needs.check-scope.outputs.spec_only != 'true' }}
    runs-on: 4-core-ubuntu
    permissions:
      contents: read
    steps:
      - name: Require successful scope classification
        if: needs.check-scope.result != 'success'
        run: |
          echo "Change scope could not be classified; refusing to skip required work."
          exit 1

      - name: Skip heavy work for a specialized lane
        if: needs.check-scope.outputs.docsite_only == 'true' || needs.check-scope.outputs.spec_only == 'true' || needs.check-scope.outputs.tooling_only == 'true'
        run: echo "Specialized PR lane — skipping unrelated test suite"

      - uses: actions/checkout@v7
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'

      - uses: ./.github/actions/setup
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'

      - name: Check knowledge schema history
        if: >-
          github.event_name == 'pull_request' &&
          needs.check-scope.outputs.docsite_only != 'true' &&
          needs.check-scope.outputs.spec_only != 'true' &&
          needs.check-scope.outputs.tooling_only != 'true'
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          node scripts/check-knowledge.mjs --base "${{ github.event.pull_request.base.sha }}"

      - name: Check copyright headers
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: ./scripts/add-copyright.sh --check

      - name: Check package.json exports are in sync
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: node scripts/sync-exports.js --check

      - name: Verify the published CLI ./api type surface
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: node .github/scripts/cli-api-types-verify.mjs

      - name: Check token docs are in sync
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: node scripts/generate-token-docs.mjs --check

      # Fails when the lab readiness manifest claims a check the source tree
      # contradicts — the report is derived, never hand-maintained.
      - name: Check lab readiness manifest is current
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm lab:readiness:check

      # A child process isolates engine state, not CPU or memory contention.
      # FR23 must wait until the other UI workers have exited (AST-036).
      - name: Run UI tests and isolated Markdown benchmark
        run: |
          pnpm vitest run --project ui --exclude packages/core/src/Markdown/Markdown.fr23.perf.test.ts
          pnpm vitest run --project ui packages/core/src/Markdown/Markdown.fr23.perf.test.ts --no-file-parallelism
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'

  test-node:
    needs: [check-scope]
    if: ${{ github.event_name != 'workflow_dispatch' && always() && !cancelled() && needs.check-scope.outputs.spec_only != 'true' }}
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - name: Require successful scope classification
        if: needs.check-scope.result != 'success'
        run: |
          echo "Change scope could not be classified; refusing to skip required work."
          exit 1

      - name: Skip heavy work for a specialized lane
        if: needs.check-scope.outputs.docsite_only == 'true' || needs.check-scope.outputs.spec_only == 'true'
        run: echo "Specialized PR lane — skipping unrelated test suite"

      - uses: actions/checkout@v7
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true'

      - uses: ./.github/actions/setup
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true'

      - run: pnpm vitest run --project node
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true'

      # Theme-family compilation is owned by `theme-build`, not Build. Until
      # that surface has an admitted dedicated lane, broad CI keeps its browser
      # contract inside the existing Node test owner rather than `test-build`.
      - name: Install Playwright for theme-family contract
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: npx playwright install chromium

      - name: Build theme-family compiler dependencies
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/core build

      - name: Generate the maintained theme-family fixture
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/sandbox generate:theme-family

      - name: Run theme family cascade guard
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: node .github/scripts/theme-family-cascade.js

  # Public registry contract. Generation proves schema, dependency, route-lock,
  # alias, and release-gating invariants; the final step drives every canonical
  # item through the exact pinned ShadCN client and compiles every written source.
  registry-contract:
    needs: [check-scope]
    if: ${{ github.event_name != 'workflow_dispatch' && always() && !cancelled() && needs.check-scope.outputs.spec_only != 'true' }}
    runs-on: 4-core-ubuntu
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require successful scope classification
        if: needs.check-scope.result != 'success'
        run: |
          echo "Change scope could not be classified; refusing to skip required work."
          exit 1

      - name: Skip registry work for spec-only changes
        if: needs.check-scope.outputs.spec_only == 'true'
        run: echo "Spec-only PR — public registry output cannot change"

      - uses: actions/checkout@v7
        if: needs.check-scope.outputs.spec_only != 'true'

      - uses: ./.github/actions/setup
        if: needs.check-scope.outputs.spec_only != 'true'

      - name: Build registry package exports
        if: needs.check-scope.outputs.spec_only != 'true'
        run: pnpm build

      - name: Verify hidden production registry contract
        if: needs.check-scope.outputs.spec_only != 'true'
        run: node internal/shadcn-registry/verify-production-gate.mjs

      - name: Generate and validate the complete preview registry
        if: needs.check-scope.outputs.spec_only != 'true'
        env:
          DOCSITE_TARGET: canary
        run: node apps/docsite/scripts/generate-data.mjs

      - name: Install and build every preview registry item
        if: needs.check-scope.outputs.spec_only != 'true'
        run: node internal/shadcn-registry/verify-full-catalog.mjs

      - name: Generate the hidden production registry
        if: needs.check-scope.outputs.spec_only != 'true'
        env:
          DOCSITE_TARGET: latest
        run: node apps/docsite/scripts/generate-data.mjs

      - name: Verify hidden production discovery surfaces
        if: needs.check-scope.outputs.spec_only != 'true'
        env:
          ASTRYX_VERIFY_HIDDEN_PRODUCTION: '1'
          NEXT_PUBLIC_DOCS_TARGET: latest
        run: pnpm -F @astryxdesign/docsite exec vitest run src/__tests__/hidden-shadcn-production.test.ts

      - name: Install and build every hidden production registry item
        if: needs.check-scope.outputs.spec_only != 'true'
        env:
          ASTRYX_SHADCN_USE_PUBLISHED_PACKAGES: '1'
        run: node internal/shadcn-registry/verify-full-catalog.mjs

  # Historical required check name. The Vitest lanes, Build test owner, and
  # public registry contract always report or explicitly skip, so this join
  # projects their combined result without creating another surface lane.
  test:
    needs: [check-scope, test-ui, test-node, test-build, registry-contract]
    if: ${{ github.event_name != 'workflow_dispatch' && always() && !cancelled() && needs.check-scope.outputs.spec_only != 'true' }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Require expected test-owner outcomes
        env:
          CHECK_SCOPE_RESULT: ${{ needs.check-scope.result }}
          DOCSITE_ONLY: ${{ needs.check-scope.outputs.docsite_only }}
          SPEC_ONLY: ${{ needs.check-scope.outputs.spec_only }}
          TOOLING_ONLY: ${{ needs.check-scope.outputs.tooling_only }}
          TEST_UI_RESULT: ${{ needs.test-ui.result }}
          TEST_NODE_RESULT: ${{ needs.test-node.result }}
          TEST_BUILD_RESULT: ${{ needs.test-build.result }}
          REGISTRY_CONTRACT_RESULT: ${{ needs.registry-contract.result }}
        run: node .github/scripts/ci-test-join.mjs

  # Build storybook + typecheck + analyze components (parallel with test and
  # build-sandbox). Uploads the storybook preview and analysis artifacts for
  # downstream jobs.
  # The sandbox preview build lives in build-sandbox: it alone takes ~4min
  # while everything here takes ~2min, so the two run in parallel and the
  # `build` join below folds their results into the historical check name.
  build-storybook:
    needs: [check-scope]
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.operation == 'release-check') && always() && !cancelled() && needs.check-scope.outputs.spec_only != 'true' }}
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    outputs:
      short_hash: ${{ steps.release.outputs.short_hash || steps.urls.outputs.short_hash }}
      sandbox_url: ${{ steps.urls.outputs.sandbox_url }}
      pr_number: ${{ steps.urls.outputs.pr_number }}
    steps:
      - name: Require successful scope classification
        if: needs.check-scope.result != 'success'
        run: |
          echo "Change scope could not be classified; refusing to skip required work."
          exit 1

      - name: Skip heavy work for a specialized lane
        if: needs.check-scope.outputs.docsite_only == 'true' || needs.check-scope.outputs.spec_only == 'true' || needs.check-scope.outputs.tooling_only == 'true'
        run: echo "Specialized PR lane — skipping unrelated build"

      - name: Checkout
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        uses: actions/checkout@v7
        with:
          # Component evidence artifacts are named for and reviewed at the PR
          # head, so build their Storybook bytes from that exact tree rather
          # than GitHub's synthetic merge checkout.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Depth 50 (same as check-scope) so analyze-pr.js's three-dot diff
          # can find a merge base — depth 1 breaks it ("no merge base") and
          # the analysis silently reported zero changed components.
          fetch-depth: 50

      - name: Verify Storybook source checkout
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true' && github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Fetch base branch for PR analysis
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true' && github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=50

      - name: Setup Node and pnpm
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        uses: ./.github/actions/setup

      - name: Build core package
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm build

      - name: Verify package exports
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: node scripts/verify-exports.mjs

      - name: Typecheck component docs
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/core typecheck:docs

      - name: Typecheck lab docs
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/lab typecheck:docs

      - name: Typecheck charts docs
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/charts typecheck:docs

      - name: Typecheck rich text docs
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/richtext typecheck:docs

      - name: Typecheck Vega docs
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/vega typecheck:docs

      - name: Typecheck template docs
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/cli typecheck:template-docs

      # Full-package strict checkJs over the CLI (src, bin, scripts, docs, and
      # the emitted templates). Requires the `pnpm build` above so the template
      # .tsx sources can resolve the built @astryxdesign/{core,charts,lab} types.
      - name: Typecheck CLI (strict)
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/cli typecheck:strict

      - name: Typecheck storybook
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/storybook typecheck

      - name: Typecheck core (including tests)
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/core typecheck

      # The accessibility spec-test contracts are consumed as TypeScript source
      # by Vitest and Playwright, and neither runner typechecks. This is the
      # only gate over them.
      - name: Typecheck accessibility spec-test contracts
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/a11y-spec typecheck

      - name: Build Storybook
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: pnpm -F @astryxdesign/storybook build

      - name: Stamp Storybook source revision
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
        run: git rev-parse HEAD > apps/storybook/dist/astryx-build-sha.txt

      - name: Compute PR preview path
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true' && github.event_name == 'pull_request'
        id: urls
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          COMMIT_HASH="${{ github.event.pull_request.head.sha }}"
          SHORT_HASH="${COMMIT_HASH:0:7}"
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_OWNER="${{ github.repository_owner }}"

          echo "short_hash=${SHORT_HASH}" >> $GITHUB_OUTPUT
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "sandbox_url=https://${REPO_OWNER}.github.io/${REPO_NAME}/pr/${PR_NUMBER}/sandbox/" >> $GITHUB_OUTPUT

      - name: Identify full release audit scope
        if: github.event_name == 'workflow_dispatch' && needs.check-scope.outputs.tooling_only != 'true'
        id: release
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "short_hash=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          printf '{"forceFullComponentAudits":true}\n' > analysis.json

      - name: Upload Storybook artifact
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true' && (github.event_name == 'pull_request' || inputs.operation == 'release-check')
        uses: actions/upload-artifact@v7
        with:
          name: storybook-${{ steps.release.outputs.short_hash || steps.urls.outputs.short_hash }}
          path: apps/storybook/dist/
          retention-days: 30

      # pr-visual reads each theme's built source to learn which targets that
      # theme styles — a theme's component map is what defineTheme returns, not
      # a literal in its source. This job has already built them; shipping the
      # artifact keeps that job on a download instead of a second full build.
      #
      # core's dist ships with them because importing a built theme executes
      # `import {defineTheme} from '@astryxdesign/core/theme'`, which pnpm
      # resolves through the workspace link into packages/core/dist.
      #
      # Two paths, so the artifact is rooted at their common ancestor
      # (packages/) — the download below unpacks it there.
      - name: Upload built themes and core
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true' && (github.event_name == 'pull_request' || inputs.operation == 'release-check')
        uses: actions/upload-artifact@v7
        with:
          name: dists-${{ steps.release.outputs.short_hash || steps.urls.outputs.short_hash }}
          path: |
            packages/themes/*/dist/
            packages/core/dist/
          retention-days: 1

      - name: Analyze components
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true' && github.event_name == 'pull_request'
        run: |
          node .github/scripts/analyze-pr.js \
            --base origin/${{ github.base_ref }} \
            --head HEAD \
            --output analysis.json

      - name: Write PR comment metadata
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true' && github.event_name == 'pull_request'
        run: |
          # PR Comment reads this exact-run analysis. Storybook preview links
          # come from the exact-head Vercel deployment; the Sandbox artifact
          # remains on Pages until its separate migration.
          cat > pr-meta.json <<EOF
          {
            "prNumber": "${{ steps.urls.outputs.pr_number }}",
            "shortHash": "${{ steps.urls.outputs.short_hash }}",
            "headSha": "${{ github.event.pull_request.head.sha }}",
            "headRepository": "${{ github.event.pull_request.head.repo.full_name }}",
            "baseRepository": "${{ github.event.pull_request.base.repo.full_name }}",
            "runId": "${{ github.run_id }}",
            "runAttempt": "${{ github.run_attempt }}",
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Upload analysis artifact
        if: needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true' && (github.event_name == 'pull_request' || inputs.operation == 'release-check')
        uses: actions/upload-artifact@v7
        with:
          name: pr-analysis
          path: |
            analysis.json
            pr-meta.json
          retention-days: 1

  # Sandbox preview build — the single slowest piece of PR CI (~4min), run as
  # its own job so it overlaps build-storybook instead of serializing after it.
  # PR-only: merge_group runs never deploy previews, and docsite-only PRs skip
  # preview builds entirely.
  build-sandbox:
    needs: [check-scope]
    if: github.event_name == 'pull_request' && needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    outputs:
      short_hash: ${{ steps.urls.outputs.short_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup

      - name: Build core package
        run: pnpm build

      - name: Compute sandbox preview paths
        id: urls
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          COMMIT_HASH="${{ github.event.pull_request.head.sha }}"
          SHORT_HASH="${COMMIT_HASH:0:7}"
          REPO_NAME="${{ github.event.repository.name }}"

          {
            echo "short_hash=${SHORT_HASH}"
            echo "sandbox_base_path=/${REPO_NAME}/pr/${PR_NUMBER}/sandbox"
            echo "template_assets_base_path=/${REPO_NAME}/sandbox/template-assets"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/sandbox/.next/cache
          # No restore-keys fallback — see deploy.yml for the full rationale.
          # The Next.js module cache bakes in @astryxdesign/core's resolved export graph,
          # so a loose fallback can restore a cache built against a different
          # export shape and silently produce wrong builds (broke #2941's
          # post-merge deploy). A changed key yields a cold (safe) rebuild.
          #
          # Keyed by PR number so PRs never share a cache with main (deploy.yml)
          # or with other PRs: each PR builds with its own basePath
          # (SANDBOX_BASE_PATH=/<repo>/pr/<n>/sandbox vs /<repo>/sandbox on main),
          # and Next.js invalidates the webpack cache whenever the resolved config
          # changes — so a cache built under a different basePath always restores
          # as dead weight (download cost, zero reuse) and, because the shared key
          # "hit", the PR could never save a cache for its own basePath either.
          # Re-pushes to the same PR keep the same key and get real warm builds.
          # (This job only runs on pull_request events — see the job-level `if:`
          # above — so github.event.pull_request.number is always set here.)
          key: nextjs-sandbox-pr${{ github.event.pull_request.number }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/core/dist/**') }}

      - name: Build Sandbox
        run: pnpm -F @astryxdesign/sandbox build
        env:
          # Must match the deployed Pages path (<owner>.github.io/<repo>/pr/<n>/sandbox).
          # Built without the /<repo> prefix, the sandbox's root-absolute asset URLs
          # drop that segment and 404 — breaking all styles/JS on the preview.
          SANDBOX_BASE_PATH: ${{ steps.urls.outputs.sandbox_base_path }}
          SANDBOX_TEMPLATE_ASSETS_BASE_PATH: ${{ steps.urls.outputs.template_assets_base_path }}
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Remove shared assets from preview artifact
        run: rm -rf apps/sandbox/out/template-assets

      - name: Upload Sandbox artifact
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-${{ steps.urls.outputs.short_hash }}
          path: apps/sandbox/out/
          retention-days: 30

  # Join gate that keeps the historical `build` check name: anything keyed on
  # "build" being green (branch protection, tooling, habit) keeps working, and
  # it fails when either parallel build fails. build-sandbox is legitimately
  # skipped on docsite-only PRs; a skipped build-storybook (merge_group, or a
  # failed check-scope) skips this gate too — both match the old single-job
  # behavior.
  build:
    needs: [build-storybook, build-sandbox]
    if: ${{ github.event_name != 'workflow_dispatch' && !cancelled() && needs.build-storybook.result != 'skipped' }}
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Assert parallel builds succeeded
        run: |
          echo "build-storybook: ${{ needs.build-storybook.result }}"
          echo "build-sandbox:   ${{ needs.build-sandbox.result }}"
          [ "${{ needs.build-storybook.result }}" = "success" ] || exit 1
          case "${{ needs.build-sandbox.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac

  # CI keeps Storybook's static artifact for visual, accessibility, and RTL
  # checks. The exact-head Vercel deployment independently hosts both human
  # Storybook and Sandbox previews; no branch-backed preview is published.

  # Accessibility audit
  # Skipped when no components changed. Depends only on build-storybook, so it
  # starts as soon as the storybook artifact is up (~2min) instead of waiting
  # for the slower sandbox build.
  pr-a11y:
    needs: [build-storybook, check-components]
    if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check')) && needs.check-components.outputs.has_components == 'true'
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify evidence checkout
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      # Dependencies are installed later, together with the Playwright browser,
      # because the analysis artifact has to be downloaded first.
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Download analysis artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-analysis

      - name: Download Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: storybook-${{ needs.build-storybook.outputs.short_hash }}
          path: apps/storybook/dist

      - name: Install Playwright
        run: pnpm install --frozen-lockfile && npx playwright install chromium

      # Fails on axe violations not present in the checked-in baseline
      # (.github/a11y-baseline.json). See CONTRIBUTING.md "Accessibility
      # audits" for the baseline workflow.
      - name: Run accessibility audit
        run: |
          SCOPE_ARGS=()
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            COMPONENTS=$(node .github/scripts/a11y-pr-scope.mjs analysis.json)
            # An explicit empty filter means no changed components, never all
            # stories. Shared-surface full sweeps belong to release-check.
            SCOPE_ARGS=(--components "$COMPONENTS")
            echo "PR accessibility scope: ${COMPONENTS:-no changed components; fast browser guards still run}"
          fi
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output a11y-report.json \
            "${SCOPE_ARGS[@]}" \
            --baseline .github/a11y-baseline.json \
            --fail-on-new

      # if: always() so the report artifact (and the PR comment built from it)
      # still exists when the gate above fails.
      - name: Upload a11y artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: a11y-report.json
          retention-days: 1

      # A modal <dialog> hidden before close() blocks the whole page in Safari
      # 26.1 and leaves no trace (#4290). The ordering is produced by a CSS
      # transition, which jsdom does not run — so the unit suite cannot see it
      # and this Chromium probe is the guard. Runs after the upload above so an
      # a11y failure still publishes its report.
      - name: Run modal close visibility guard
        run: node .github/scripts/modal-close-visibility.js --storybook-dir apps/storybook/dist

      # A public component var can be documented, read, and emitted into the
      # theme CSS and still be unreachable — an inline write or an unlayered
      # declaration outranks `@layer astryx-theme` (#4530). jsdom resolves no
      # cascade, so the unit suites assert on the generated CSS text, which
      # proves emission and not effect. Chromium is where the promise is
      # checkable. The source-side wiring half lives in
      # packages/cli/foundation/discovery/theming-targets.test.mjs.
      - name: Run theme var reachability guard
        run: node .github/scripts/theme-var-reachability.js --storybook-dir apps/storybook/dist

      # A story play function is where geometry assertions live (they need
      # getBoundingClientRect, so jsdom is out), but nothing else observes the
      # result: Vitest never collects stories, and pr-visual loads stories
      # without awaiting `play` — and is soft while it earns trust. This guard
      # loads each listed story in Chromium and fails when its play assertions
      # throw. Hosted here with the sibling Chromium guards because pr-a11y is
      # the blocking job that runs whenever components change.
      - name: Run story play guard
        run: node .github/scripts/story-play-guard.js --storybook-dir apps/storybook/dist

      # The empty-state announcement is a live-region claim: what a screen
      # reader receives when a search dead-ends, and that the message element
      # stays presentational so `role="listbox"` keeps only option/group
      # children. jsdom proves the wiring; only a real engine shows the
      # accessibility tree that results, and this contract is cheap enough to
      # run on every PR rather than waiting for the release matrix. Its own
      # --output directory so a later audit run cannot clear it, and it cannot
      # clear theirs (Playwright wipes the default directory per run).
      - name: Run empty-state announcement contract
        run: |
          pnpm exec playwright test \
            packages/core/src/Selector/__tests__/EmptyStateAnnouncement.a11y.chromium.spec.ts \
            --project chromium \
            --output empty-state-announcement-output

      # The RichTextEditor "Markdown parity" stories render one Markdown
      # document with core Markdown and RichTextEditor and measure where each
      # block lands; geometry, the read/edit switch and the scroll anchor only
      # exist in a real engine. The spec proves the sandbox still works and
      # banks screenshots plus a geometry manifest of today's differences. It
      # asserts no parity. A pull request runs it only when it can change what
      # the sandbox shows: Markdown or a RichText component is in the PR scope,
      # the RichText package changed, or the sandbox's own stories or spec
      # changed. Release-check always runs it. Its own --output directory, with
      # the upload immediately after.
      - name: Run Markdown/RichText parity sandbox evidence
        id: markdown-parity
        if: ${{ !cancelled() }}
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          should_run=true
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            should_run=false
            COMPONENTS=$(node .github/scripts/a11y-pr-scope.mjs analysis.json)
            case ",${COMPONENTS}," in
              *,core/Markdown,* | *,richtext/*) should_run=true ;;
            esac
            if node -e "process.exit(require('./analysis.json').changedPackages?.includes('@astryxdesign/richtext') ? 0 : 1)"; then
              should_run=true
            fi
            # The sandbox's stories belong to no package, so compare file names
            # with the base. If the base cannot be fetched, run the evidence.
            if git fetch --quiet --depth=1 origin "$BASE_SHA"; then
              if git diff --name-only "$BASE_SHA" HEAD \
                | grep -qE '^(apps/storybook/stories/RichTextEditor\.(markdownParity|stories)|packages/richtext/src/__tests__/MarkdownParitySandbox)'; then
                should_run=true
              fi
            else
              should_run=true
            fi
          fi
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          if [ "$should_run" != true ]; then
            echo "Markdown, RichText, and the parity sandbox are not in PR scope; skipping parity evidence."
            exit 0
          fi
          pnpm exec playwright test \
            packages/richtext/src/__tests__/MarkdownParitySandbox.a11y.chromium.spec.ts \
            --project chromium \
            --output richtext-markdown-parity-output

      - name: Upload Markdown/RichText parity sandbox evidence
        if: ${{ !cancelled() && steps.markdown-parity.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: richtext-markdown-parity-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: test-results/richtext-markdown-parity/
          retention-days: 30
          if-no-files-found: warn

      # Outline owns real DOM focus through roving tabindex. Computed paint,
      # pointer modality, clipping, forced colors, and exact pixels require the
      # same real Chromium artifact this blocking accessibility lane already owns.
      - name: Run Outline focus indicator contract
        if: github.event_name == 'pull_request'
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          COMPONENTS=$(node .github/scripts/a11y-pr-scope.mjs analysis.json)
          case ",${COMPONENTS}," in
            *,core/Outline,*)
              pnpm exec playwright test \
                packages/core/src/Outline/OutlineFocus.a11y.chromium.spec.ts \
                --project chromium \
                --output outline-focus-output
              ;;
            *) echo "Outline not in PR scope; skipping focus evidence." ;;
          esac

      - name: Upload Outline focus evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: outline-focus-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: test-results/outline-focus-evidence/
          retention-days: 30
          if-no-files-found: ignore

      # The toggle-button contract's pressed state, keyboard and pointer round
      # trips, aborted press, focus, and unavailable state are accessibility-tree
      # and engine facts that jsdom cannot observe. Run the contract's own
      # fixture proof and the ToggleButton binding whenever the PR scope names
      # ToggleButton or the contract changes. Its own --output directory; the
      # JSON report is the head-bound record, uploaded immediately after.
      - name: Run ToggleButton accessibility contract
        id: toggle-button-contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: toggle-button-contract/report.json
        run: |
          should_run=false
          COMPONENTS=$(node .github/scripts/a11y-pr-scope.mjs analysis.json)
          case ",${COMPONENTS}," in
            *,core/ToggleButton,*) should_run=true ;;
          esac
          # The contract belongs to no package, so compare file names with the
          # base. If the base cannot be fetched, run the evidence.
          if git fetch --quiet --depth=1 origin "$BASE_SHA"; then
            if git diff --name-only "$BASE_SHA" HEAD \
              | grep -qE '^internal/a11y-spec/src/patterns/toggle-button'; then
              should_run=true
            fi
          else
            should_run=true
          fi
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          if [ "$should_run" != true ]; then
            echo "ToggleButton and its contract are not in PR scope; skipping toggle-button evidence."
            exit 0
          fi
          pnpm exec playwright test \
            internal/a11y-spec/src/patterns/toggle-button.chromium.spec.ts \
            packages/core/src/ToggleButton/__tests__/ToggleButton.a11y.chromium.spec.ts \
            --project chromium \
            --reporter list,json \
            --output toggle-button-contract-output

      - name: Upload ToggleButton accessibility contract evidence
        if: ${{ !cancelled() && steps.toggle-button-contract.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: toggle-button-contract-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: toggle-button-contract/
          retention-days: 30
          if-no-files-found: warn

      # The Schedule time grid owns scroll geometry — pinned header and gutter
      # alignment under classic scrollbars, inline scroll ownership, keyboard
      # reach and its focus ring — none of which exists in jsdom. Every
      # contract file under the Schedule tests directory runs here, in the
      # same real Chromium artifact, whenever the PR scope names Schedule.
      - name: Run Schedule time-grid contract
        if: github.event_name == 'pull_request'
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          COMPONENTS=$(node .github/scripts/a11y-pr-scope.mjs analysis.json)
          case ",${COMPONENTS}," in
            *,lab/Schedule,*)
              pnpm exec playwright test \
                packages/lab/src/Schedule/__tests__/ \
                --project chromium \
                --output schedule-time-grid-output
              ;;
            *) echo "Schedule not in PR scope; skipping time-grid evidence." ;;
          esac

      - name: Upload Schedule time-grid evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: schedule-time-grid-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: test-results/schedule-time-grid-evidence/
          retention-days: 30
          if-no-files-found: ignore

      # The heading-links module contract is broader than axe: exact fragments,
      # native sibling anchors, hover/focus/touch discovery, forced colors,
      # reduced motion, dark mode, and RTL geometry all need a real engine.
      # Keep it scoped to Markdown plugin changes and bind its receipt to the verified head.
      - name: Run heading-links module browser evidence
        id: markdown-heading-links
        if: github.event_name == 'pull_request'
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          COMPONENTS=$(node .github/scripts/a11y-pr-scope.mjs analysis.json)
          case ",${COMPONENTS}," in
            *,core/Markdown,*)
              echo 'should_run=true' >> "$GITHUB_OUTPUT"
              pnpm exec playwright test \
                packages/core/src/Markdown/plugins/headingLinks.a11y.chromium.spec.ts \
                --project chromium \
                --output markdown-heading-links-output
              ;;
            *)
              echo 'should_run=false' >> "$GITHUB_OUTPUT"
              echo "Markdown not in PR scope; skipping heading-link evidence."
              ;;
          esac

      - name: Upload heading-links module browser evidence
        if: always() && github.event_name == 'pull_request' && steps.markdown-heading-links.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: markdown-heading-links-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: test-results/markdown-heading-links/
          retention-days: 30
          if-no-files-found: error

      # ChatMessageBubble is nested under the shared Chat source directory, so
      # the generic stable-visual owner cannot select its dedicated fixture.
      # Run the component's bounded evidence matrix only when the PR scope names
      # it, and upload the receipted frames below.
      - name: Run ChatMessageBubble audit browser evidence
        if: github.event_name == 'pull_request'
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          COMPONENTS=$(node .github/scripts/a11y-pr-scope.mjs analysis.json)
          case ",${COMPONENTS}," in
            *,core/ChatMessageBubble,*)
              pnpm exec playwright test \
                packages/core/src/Chat/__tests__/ChatMessageBubble.a11y.chromium.spec.ts \
                --project chromium
              ;;
            *) echo "ChatMessageBubble not in PR scope; skipping audit evidence." ;;
          esac

      - name: Upload ChatMessageBubble audit evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: chat-message-bubble-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: test-results/chat-message-bubble-audit-evidence/
          retention-days: 30
          if-no-files-found: ignore

      # A component audit needs evidence for each state it scores. The generic
      # visual manifest does not include semantic-state or geometry sensors, so
      # this existing Chromium owner captures bounded, fail-closed receipts.
      - name: Run ChatMessageList audit browser evidence
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ChatMessageList:')
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output chat-message-list-a11y-report.json \
            --components ChatMessageList \
            --baseline .github/a11y-baseline.json \
            --fail-on-new
          pnpm exec playwright test \
            packages/core/src/Chat/__tests__/ChatMessageList.a11y.chromium.spec.ts \
            --project chromium

      - name: Upload ChatMessageList audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ChatMessageList:')
        uses: actions/upload-artifact@v7
        with:
          name: chat-message-list-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            chat-message-list-a11y-report.json
            test-results/chat-message-list-audit-evidence/
          retention-days: 30
          if-no-files-found: ignore

      # CollapsibleGroup's shared Collapsible story previously left the audit
      # owner with no routable browser fixture. Its dedicated matrix now emits
      # semantic-state, geometry, direction, theme, and viewport receipts.
      - name: Run CollapsibleGroup audit browser evidence
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] CollapsibleGroup:')
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output collapsible-group-a11y-report.json \
            --components CollapsibleGroup \
            --baseline .github/a11y-baseline.json \
            --fail-on-new
          pnpm exec playwright test \
            packages/core/src/Collapsible/__tests__/CollapsibleGroup.a11y.chromium.spec.ts \
            --project chromium

      - name: Upload CollapsibleGroup audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] CollapsibleGroup:')
        uses: actions/upload-artifact@v7
        with:
          name: collapsible-group-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            collapsible-group-a11y-report.json
            test-results/collapsible-group-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # Component-owned metadata fixtures retain exact-head browser receipts on
      # audit PRs, including failed pre-fix cases for before/after comparison.
      - name: Run ChatMessageMetadata audit browser evidence
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ChatMessageMetadata:')
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output chat-message-metadata-a11y-report.json \
            --components ChatMessageMetadata \
            --baseline .github/a11y-baseline.json \
            --fail-on-new
          pnpm exec playwright test \
            packages/core/src/Chat/__tests__/ChatMessageMetadata.a11y.chromium.spec.ts \
            --project chromium

      - name: Upload ChatMessageMetadata audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ChatMessageMetadata:')
        uses: actions/upload-artifact@v7
        with:
          name: chat-message-metadata-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            chat-message-metadata-a11y-report.json
            test-results/chat-message-metadata-audit-evidence/
          retention-days: 30
          if-no-files-found: ignore

      # ChatSendButton's component audit grades real interaction paint, disabled
      # stability, both sizes, and narrow coarse-pointer geometry. Keep those
      # receipts exact-head and bounded to its audit PR title.
      - name: Run ChatSendButton audit browser evidence
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ChatSendButton:')
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output chat-send-button-a11y-report.json \
            --components ChatSendButton \
            --baseline .github/a11y-baseline.json \
            --fail-on-new
          pnpm exec playwright test \
            packages/core/src/Chat/__tests__/ChatSendButton.a11y.chromium.spec.ts \
            --project chromium

      - name: Upload ChatSendButton audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ChatSendButton:')
        uses: actions/upload-artifact@v7
        with:
          name: chat-send-button-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            chat-send-button-a11y-report.json
            test-results/chat-send-button-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # ChatSystemMessage is noninteractive, but its status/separator semantics,
      # delegated paint, contrast, and narrow reflow still require exact-head
      # browser receipts rather than source-only claims.
      - name: Run ChatSystemMessage audit browser evidence
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ChatSystemMessage:')
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output chat-system-message-a11y-report.json \
            --components ChatSystemMessage \
            --baseline .github/a11y-baseline.json \
            --fail-on-new
          pnpm exec playwright test \
            packages/core/src/Chat/__tests__/ChatSystemMessage.a11y.chromium.spec.ts \
            --project chromium

      - name: Upload ChatSystemMessage audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ChatSystemMessage:')
        uses: actions/upload-artifact@v7
        with:
          name: chat-system-message-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            chat-system-message-a11y-report.json
            test-results/chat-system-message-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # ChatTokenizedText is noninteractive, but its literal matching, delegated
      # token paint, light/dark rendering, and narrow reflow require exact-head
      # browser receipts for the state matrix graded by its component audit.
      - name: Run ChatTokenizedText audit browser evidence
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ChatTokenizedText:')
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ASTRYX_AUDIT_BASELINE_HEAD: a7c6c7ecdf6b422df331124e8f6fc6d33cf1bd63
        run: |
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output chat-tokenized-text-a11y-report.json \
            --components ChatTokenizedText \
            --baseline .github/a11y-baseline.json \
            --fail-on-new
          pnpm exec playwright test \
            packages/core/src/Chat/__tests__/ChatTokenizedText.a11y.chromium.spec.ts \
            --project chromium

      - name: Upload ChatTokenizedText audit evidence
        if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[Component Audit] ChatTokenizedText:')
        uses: actions/upload-artifact@v7
        with:
          name: chat-tokenized-text-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            chat-tokenized-text-a11y-report.json
            test-results/chat-tokenized-text-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # The CheckboxList and CheckboxListItem component audits grade the same
      # option rows: interactive row paint, focus, busy, disabled, read-only,
      # status, narrow, forced-colors, and RTL states from exact-head Chromium
      # receipts. The shared checkbox contract also runs for its
      # CheckboxListItem bindings, with its own output directory so it cannot
      # clear the receipts. Each lane runs even when another fails, and the
      # step still runs after an earlier audit step fails, so a failing-before
      # head banks complete evidence.
      - name: Run CheckboxList audit browser evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (startsWith(github.event.pull_request.title, '[Component Audit] CheckboxList:') || startsWith(github.event.pull_request.title, '[Component Audit] CheckboxListItem:')) }}
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: checkbox-list-pattern-results.json
        run: |
          status=0
          node .github/scripts/accessibility-audit.js \
            --storybook-dir apps/storybook/dist \
            --output checkbox-list-a11y-report.json \
            --components CheckboxList,CheckboxListItem \
            --baseline .github/a11y-baseline.json \
            --fail-on-new || status=1
          pnpm exec playwright test \
            packages/core/src/CheckboxInput/__tests__/Checkbox.a11y.chromium.spec.ts \
            --project chromium \
            --grep 'CheckboxListItem \[' \
            --output checkbox-list-pattern-output \
            --reporter=list,json || status=1
          pnpm exec playwright test \
            packages/core/src/CheckboxList/__tests__/CheckboxList.a11y.chromium.spec.ts \
            --project chromium || status=1
          exit "$status"

      - name: Upload CheckboxList audit evidence
        if: always() && github.event_name == 'pull_request' && (startsWith(github.event.pull_request.title, '[Component Audit] CheckboxList:') || startsWith(github.event.pull_request.title, '[Component Audit] CheckboxListItem:'))
        uses: actions/upload-artifact@v7
        with:
          name: checkbox-list-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: |
            checkbox-list-a11y-report.json
            checkbox-list-pattern-results.json
            test-results/checkbox-list-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # Run the exhaustive contract/fixture matrix at release time. PRs retain
      # scoped axe validation and the fast interaction guards above; they must
      # not pay for every component's browser bindings on every change.
      - name: Run accessibility spec-test contracts
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'
        env:
          ASTRYX_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm test:a11y-contract

      - name: Upload pressed-state pixel evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'
        uses: actions/upload-artifact@v7
        with:
          name: pressed-state-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: test-results/pressed-state-evidence/
          retention-days: 30
          if-no-files-found: error

      # Component-audit browser evidence. A whole-component audit has to show
      # the states it graded, and the audit node cannot always run a browser —
      # so the frames and their sensor receipts are produced here, bound to the
      # same exact head as every other check in this job.
      - name: Upload component-audit browser evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'
        uses: actions/upload-artifact@v7
        with:
          name: component-audit-evidence-${{ needs.build-storybook.outputs.short_hash }}
          path: test-results/chat-layout-audit-evidence/
          retention-days: 30
          if-no-files-found: error

      # Baseline-free target/axis diagnostics are not a visual-regression lane.
      # Keep their existing report-only behavior with the other browser guards.
      - name: Check Probe theme reach
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'
        continue-on-error: true
        run: |
          node .github/scripts/visual-gate/gate.mjs reach \
            --storybook-dir apps/storybook/dist \
            --out .visual-reach

      - name: Upload Probe reach report
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'
        uses: actions/upload-artifact@v7
        with:
          name: visual-reach
          path: .visual-reach/reach.json
          retention-days: 30
          if-no-files-found: warn

  # Build package test owner. The plugin's production CSS partition is a Build
  # integration contract: source inspection cannot prove which declaration
  # paints after Vite emits the final bundle. The `test-build` name makes that
  # package ownership explicit; the historical `test` join above projects its
  # result. Until runtime:build has a specialized route, broad CI dispatches it.
  test-build:
    needs: [check-scope]
    if: github.event_name != 'workflow_dispatch' && needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Verify packed consumer dependency contract
        run: pnpm vitest run packages/build/src/packed-consumer.test.mjs --project node --maxWorkers=1

      - name: Install Playwright
        run: npx playwright install chromium

      # The guard imports the plugin's build artifact, the same one a consumer
      # installs.
      - name: Build the Vite plugin
        run: pnpm -F @astryxdesign/build build

      - name: Run Build CSS-layer cascade guard
        run: node .github/scripts/theme-layer-cascade.js

  # Guest token boundaries cross portals and the host light/dark cascade. This
  # requires a production browser render; source and jsdom checks cannot prove
  # which custom properties paint the portaled surfaces.
  fixture-contrast:
    needs: [check-scope]
    if: github.event_name != 'workflow_dispatch' && needs.check-scope.outputs.docsite_only != 'true' && needs.check-scope.outputs.spec_only != 'true' && needs.check-scope.outputs.tooling_only != 'true'
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Verify canonical setup compositions
        env:
          ASTRYX_CANONICAL_SETUP_BROWSER: '1'
        run: pnpm vitest run internal/vibe-tests/setup-test/setup-canonical.test.ts --project node --maxWorkers=1

      - name: Verify guest fixture contrast
        run: pnpm -F @astryxdesign/vibe-tests fixtures:contrast

  # Stable-package visual regression and explicit baseline capture share this
  # owner. Focused PRs compare the checked-in baseline; broad PRs use the full
  # canonical plan. Maintenance captures candidates on the same runner, and a
  # normal reviewed pull request updates the versioned baseline.
  # Audit and interaction fixtures stay with their existing browser checks.
  pr-visual:
    name: Stable visual regression
    needs: [build-storybook, check-components, maintenance-request]
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' &&
        needs.build-storybook.result == 'success' &&
        needs.check-components.result == 'success' &&
        needs.check-components.outputs.has_stable_visual == 'true') ||
       (github.event_name == 'workflow_dispatch' &&
        ((inputs.operation == 'release-check' &&
          needs.build-storybook.result == 'success' &&
          needs.check-components.result == 'success') ||
         (needs.maintenance-request.result == 'success' && inputs.operation == 'capture'))))
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Download analysis artifact
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: pr-analysis

      - name: Download Storybook artifact
        if: github.event_name == 'pull_request' || inputs.operation == 'release-check'
        uses: actions/download-artifact@v8
        with:
          name: storybook-${{ needs.build-storybook.outputs.short_hash }}
          path: apps/storybook/dist

      # If the optional theme artifact is missing, the gate builds the themes.
      - name: Download built themes and core
        if: github.event_name == 'pull_request' || inputs.operation == 'release-check'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: dists-${{ needs.build-storybook.outputs.short_hash }}
          path: packages

      - name: Install Playwright
        run: pnpm install --frozen-lockfile && npx playwright install chromium

      # Downloaded theme builds import Core's consumer-facing dist files.
      - name: Build Core dependency for theme inspection
        if: github.event_name == 'pull_request' || inputs.operation == 'release-check'
        run: pnpm -F @astryxdesign/core build

      - name: Build canonical maintenance Storybook
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'capture'
        run: pnpm build && pnpm -F @astryxdesign/storybook build

      # The reviewed baseline is versioned with the code so CI never depends on
      # mutable website storage. Baseline refreshes remain separate reviewable PRs.

      - name: Run the visual gate for the touched components
        id: visual
        if: github.event_name == 'pull_request'
        env:
          BROAD_STABLE_VISUAL: ${{ needs.check-components.outputs.broad_stable_visual }}
          ASTRYX_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ASTRYX_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # Component names are not globally unique; use their package identity.
          COMPONENTS=$(jq -r '. as $root | [(.newComponents + .modifiedComponents)[] | select($root.componentStats[.].package == "@astryxdesign/core")] | unique | join(",")' analysis.json)
          THEMES=$(jq -r '(.changedStableThemes // []) | join(",")' analysis.json)
          COMMAND=check
          if [ "$BROAD_STABLE_VISUAL" = 'true' ]; then
            COMMAND=release
            SCOPE_ARGS=()
          elif [ -n "$COMPONENTS" ] && [ -n "$THEMES" ]; then
            SCOPE_ARGS=(--tiers 'component,theme-matrix' --components "$COMPONENTS" --themes "$THEMES")
          elif [ -n "$COMPONENTS" ]; then
            SCOPE_ARGS=(--tiers component --components "$COMPONENTS" --no-scout)
          elif [ -n "$THEMES" ]; then
            SCOPE_ARGS=(--tiers theme-matrix --themes "$THEMES")
          else
            # Broad changes stay with this owner: the canonical full plan has
            # no focused-component review ceiling and no deferred backup gate.
            COMMAND=release
            SCOPE_ARGS=()
          fi

          echo "Stable Core components: ${COMPONENTS:-none}"
          echo "Stable themes: ${THEMES:-none}"
          set +e
          node .github/scripts/visual-gate/gate.mjs "$COMMAND" \
            --storybook-dir apps/storybook/dist \
            --baseline .github/visual-baseline \
            --out .visual-run \
            "${SCOPE_ARGS[@]}" \
            --summary-output visual-summary.md
          code=$?
          set -e
          # Exit 2 is a visual change for review; every other nonzero exit is
          # an infrastructure failure, not a successful evidence receipt.
          case "$code" in 0|2) ;; *) exit "$code" ;; esac
          STATUS=$(jq -er '.status' .visual-run/verdict.json)
          if [ "$STATUS" = 'skipped' ]; then
            # The focused budget refused before capture. The same owner now
            # captures its bounded canonical full plan rather than leaving a gap.
            set +e
            node .github/scripts/visual-gate/gate.mjs release \
              --storybook-dir apps/storybook/dist \
              --baseline .github/visual-baseline \
              --out .visual-run \
              --summary-output visual-summary.md
            code=$?
            set -e
            case "$code" in 0|2) ;; *) exit "$code" ;; esac
            STATUS=$(jq -er '.status' .visual-run/verdict.json)
          fi
          [ -f visual-summary.md ] && cat visual-summary.md >> "$GITHUB_STEP_SUMMARY"
          case "$STATUS" in
            pass|changed) ;;
            *) echo "Visual evidence is incomplete: $STATUS"; exit 1 ;;
          esac

      - name: Upload visual verdict and report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: visual-pr-report
          path: |
            .visual-run/verdict.json
            .visual-run/manifest.json
            .visual-run/shots/
            .visual-run/report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Run full release visual check
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'
        run: |
          set -eu
          set +e
          node .github/scripts/visual-gate/gate.mjs release \
            --storybook-dir apps/storybook/dist \
            --baseline .github/visual-baseline \
            --out .visual-run \
            --summary-output visual-summary.md
          code=$?
          set -e
          case "$code" in 0|2) ;; *) exit "$code" ;; esac
          STATUS=$(jq -er '.status' .visual-run/verdict.json)
          case "$STATUS" in
            pass|changed) ;;
            *) echo "Visual evidence is incomplete: $STATUS"; exit 1 ;;
          esac
          cat visual-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release visual verdict and report
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check'
        uses: actions/upload-artifact@v7
        with:
          name: visual-release-report
          path: |
            .visual-run/verdict.json
            .visual-run/manifest.json
            .visual-run/shots/
            .visual-run/report/
          retention-days: 14
          if-no-files-found: error

      - name: Capture canonical visual baseline
        id: maintenance-capture
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'capture'
        # A complete browser-refresh capture can be incomparable with the old
        # baseline. The next step requires full capture, not a clean comparison.
        continue-on-error: true
        run: |
          node .github/scripts/visual-gate/gate.mjs release \
            --storybook-dir apps/storybook/dist \
            --baseline .github/visual-baseline \
            --out .visual-run \
            --summary-output visual-summary.md

      - name: Validate canonical baseline capture
        id: maintenance-validation
        if: >-
          always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'capture' &&
          steps.maintenance-capture.outcome != 'skipped'
        env:
          CAPTURE_SHA: ${{ github.sha }}
          CAPTURE_RUN_ID: ${{ github.run_id }}
          CAPTURE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {validateVisualMaintenanceCapture} from './.github/scripts/visual-maintenance-source.mjs';
          validateVisualMaintenanceCapture({
            manifest: JSON.parse(fs.readFileSync('.visual-run/manifest.json', 'utf8')),
            verdict: JSON.parse(fs.readFileSync('.visual-run/verdict.json', 'utf8')),
            sha: process.env.CAPTURE_SHA,
            runId: process.env.CAPTURE_RUN_ID,
            runAttempt: process.env.CAPTURE_RUN_ATTEMPT,
          });
          NODE
          cat visual-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canonical baseline candidate
        if: always() && steps.maintenance-validation.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .visual-run/shots/
            .visual-run/manifest.json
            .visual-run/verdict.json
            .visual-run/report/
          retention-days: 14
          if-no-files-found: error

  # RTL semantic audit. Sibling to pr-a11y: same build-storybook artifact, same
  # analysis.json scoping, so ordinary PRs only pay for the components they
  # touched. A harness-only PR runs the fixed Chart/ChartLegend smoke scope so
  # routing and target changes prove themselves instead of skipping their own
  # check. A policy-sensitive full run spans ~2,000 stories and exceeded the
  # single-job budget, so CI partitions it by canonical package; each shard runs
  # four browser workers, and the stable pr-rtl join requires all five scope
  # manifests plus a report from every applicable package.
  # The scheduled full sweep also runs in rtl-weekly.yml.
  #
  # Three auto dimensions: D1 icon-mirror, D5 positional-mirror, and D6
  # contextual directional decorations. Curated D2/D3/D4/D7/D8/D9 add
  # behavior and geometry that need selectors. The applicability rollup treats unexplained all-N/A as a
  # coverage gap for both new and existing components.
  #
  # Audit findings remain SOFT while the stability window is observed: the audit
  # step may fail after writing a report. Missing/canceled/incomplete shards are
  # HARD failures, and the pr-rtl join cannot pass without every package scope
  # manifest and every applicable report.
  # To promote findings too, remove the audit step's continue-on-error.
  pr-rtl-shard:
    name: pr-rtl (${{ matrix.package }})
    needs: [build-storybook, check-components]
    if: >-
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check')) &&
      (needs.check-components.outputs.has_rtl_components == 'true' ||
       needs.check-components.outputs.has_rtl_harness == 'true' ||
       needs.check-components.outputs.force_full_component_audits == 'true')
    strategy:
      fail-fast: false
      matrix:
        package: [core, lab, charts, richtext, vega]
    runs-on: 4-core-ubuntu
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify RTL checkout
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Download analysis artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-analysis

      - name: Download Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: storybook-${{ needs.build-storybook.outputs.short_hash }}
          path: apps/storybook/dist

      - name: Install Playwright
        run: pnpm install --frozen-lockfile && npx playwright install chromium

      # A registry/classifier mutation runs the full audit from the PR checkout,
      # while eligibility itself came from trusted base policy. Scope resolution
      # is strict: malformed or missing analysis fails before the soft findings
      # step can run. An ordinary harness-only change uses the bounded routing
      # smoke scope.
      - name: Resolve RTL shard scope
        id: rtl-scope
        run: |
          node .github/scripts/rtl-shard-scope.mjs \
            --analysis analysis.json \
            --package "${{ matrix.package }}" \
            --force-full "${{ needs.check-components.outputs.force_full_component_audits }}" \
            --has-components "${{ needs.check-components.outputs.has_rtl_components }}" \
            --has-harness "${{ needs.check-components.outputs.has_rtl_harness }}" \
            --manifest rtl-shard-scope.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Run RTL audit
        id: rtl
        if: steps.rtl-scope.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          PACKAGE=${{ matrix.package }}
          COMPONENTS="${{ steps.rtl-scope.outputs.components }}"
          FILTER="${{ steps.rtl-scope.outputs.filter }}"
          FILTER_ARGS=()
          if [ -n "$FILTER" ]; then
            FILTER_ARGS=(--filter "$FILTER")
          fi
          echo "Auditing $PACKAGE components: $COMPONENTS"
          node apps/storybook/rtl-audit/rtl-audit.mjs \
            --storybook-dir apps/storybook/dist \
            --output rtl-audit-report.json \
            --packages "$PACKAGE" \
            --concurrency 4 \
            "${FILTER_ARGS[@]}"

      - name: Require completed RTL shard report
        if: always()
        run: |
          SCOPE_OUTCOME="${{ steps.rtl-scope.outcome }}"
          SHOULD_RUN="${{ steps.rtl-scope.outputs.should_run }}"
          AUDIT_OUTCOME="${{ steps.rtl.outcome }}"
          if [ "$SCOPE_OUTCOME" != "success" ]; then
            echo "RTL shard scope did not resolve successfully: $SCOPE_OUTCOME"
            exit 1
          fi
          if [ "$SHOULD_RUN" = "true" ]; then
            if [ "$AUDIT_OUTCOME" != "success" ] && [ "$AUDIT_OUTCOME" != "failure" ]; then
              echo "Applicable RTL audit did not run: $AUDIT_OUTCOME"
              exit 1
            fi
            node .github/scripts/rtl-report-completion.mjs \
              --report rtl-audit-report.json \
              --package "${{ matrix.package }}" \
              --filter "${{ steps.rtl-scope.outputs.filter }}"
          elif [ "$SHOULD_RUN" = "false" ]; then
            if [ "$AUDIT_OUTCOME" != "skipped" ]; then
              echo "Out-of-scope RTL audit unexpectedly ran: $AUDIT_OUTCOME"
              exit 1
            fi
          else
            echo "RTL shard scope produced no explicit should_run decision."
            exit 1
          fi

      - name: Write scorecard summary
        if: always() && steps.rtl-scope.outputs.should_run == 'true'
        run: |
          {
            echo "## RTL semantic audit"
            echo ""
            echo "Audit scope: **${{ steps.rtl-scope.outputs.components }}**. The scheduled unfiltered sweep also runs weekly — see \`rtl-weekly.yml\`."
            echo ""
            echo "Relationship-based (LTR vs RTL in the same run) — no golden screenshots. **Soft-gated** pending a stability window."
            echo ""
            if [ -f rtl-audit-report.json ]; then
              node -e '
                const r = JSON.parse(require("fs").readFileSync("rtl-audit-report.json"));
                const a = r.autoDiscovery;
                const known = new Set(r.knownNotRtl || []);
                const out = [];
                out.push("### Auto-discovery (D1 icon-mirror, one representative story per scoped component)");
                out.push("");
                out.push(`**${a.pass} pass · ${a.fail} not-RTL · ${a.na} N-A** (of ${a.total} scoped components). Surprises (not pre-labelled): **${a.surprises.length}**${a.surprises.length ? ": " + a.surprises.join(", ") : ""}.`);
                out.push("");
                const fails = a.results.filter(x => x.verdict === "fail" || x.verdict === "ERROR");
                if (fails.length) {
                  out.push("| Component | D1 | Label | Detail |");
                  out.push("|-----------|----|-------|--------|");
                  for (const c of fails) {
                    const label = known.has(c.component) ? "known-not-rtl" : "⚠️ surprise";
                    out.push(`| ${c.component} | ${c.verdict} | ${label} | ${(c.notes||[]).join("; ")} |`);
                  }
                } else {
                  out.push("_No not-RTL findings._");
                }
                out.push("");
                const passes = a.results.filter(x => x.verdict === "pass").map(x => x.component);
                out.push(`RTL-ready (D1 pass): ${passes.join(", ") || "—"}.`);
                out.push("");
                const pm = r.positionalMirror;
                if (pm) {
                  out.push("### Positional-mirror (D5, all scoped stories)");
                  out.push("");
                  out.push("Catches a logical anchor (insetInlineStart/End) paired with an UNFLIPPED physical transform (translate/translateX) → element lands on the wrong side in RTL. Lint can\u2019t see this (each prop is individually fine). Tolerance " + pm.tolerancePx + "px, degenerate-parent guard (<8px) applied.");
                  out.push("");
                  out.push(`**${pm.pass} pass · ${pm.fail} FAIL · ${pm.na} N-A** (of ${pm.total} scoped stories scanned).`);
                  out.push("");
                  const pmFails = pm.results.filter(x => x.verdict === "fail" || x.verdict === "ERROR");
                  if (pmFails.length) {
                    out.push("| Story | Element | LTR relCenterX | RTL relCenterX | \u0394 (px) |");
                    out.push("|-------|---------|----------------|----------------|--------|");
                    for (const c of pmFails) {
                      for (const f of (c.fails || [])) {
                        out.push(`| ${c.storyId} | \`${f.cls || f.tag}\` | ${f.ltrRelCenterX} | ${f.rtlRelCenterX} (exp ~${f.expectedRtlCenterX}) | ${f.delta} |`);
                      }
                      if (!(c.fails || []).length) out.push(`| ${c.storyId} | (error) | — | — | ${(c.notes||[]).join("; ")} |`);
                    }
                    out.push("");
                  } else {
                    out.push("_No positional-mirror FAILs._");
                    out.push("");
                  }
                }
                const decorations = r.directionalDecorations;
                if (decorations) {
                  out.push("### Contextual directional decorations (D6, all stories)");
                  out.push("");
                  out.push(`**${decorations.pass} pass · ${decorations.fail} FAIL · ${decorations.na} N-A** (of ${decorations.total} stories scanned).`);
                  out.push("");
                  const decorationFails = decorations.results.filter(x => x.verdict === "fail" || x.verdict === "ERROR");
                  if (decorationFails.length) {
                    out.push("| Story | D6 | Detail |");
                    out.push("|-------|----|--------|");
                    for (const c of decorationFails) out.push(`| ${c.storyId} | ${c.verdict} | ${(c.notes||[]).join("; ")} |`);
                  } else {
                    out.push("_No directional-decoration FAILs._");
                  }
                  out.push("");
                }
                const coverage = r.coverage;
                if (coverage) {
                  out.push("### Applicability coverage");
                  out.push("");
                  out.push(`**${coverage.measured} measured · ${coverage.verifiedNa} verified N-A · ${coverage.gaps} coverage gap · ${coverage.staleVerifiedNa} stale verified N-A.**`);
                  out.push("");
                  const gaps = coverage.results.filter(x => x.status === "coverage-gap" || x.status === "stale-verified-na");
                  if (gaps.length) {
                    out.push("| Component | Status | Detail |");
                    out.push("|-----------|--------|--------|");
                    for (const c of gaps) out.push(`| ${c.component} | ${c.status} | ${c.note || c.reason || "unexplained all-N/A result"} |`);
                    out.push("");
                  }
                }
                out.push("### Curated precision (D2 order / D3 behavior / D4 overlay)");
                out.push("");
                out.push("| Component | Rollup | Dimensions |");
                out.push("|-----------|--------|------------|");
                for (const c of r.curated.results) {
                  const dims = Object.entries(c.dims).map(([k,v]) => k+":"+v).join(", ") || "—";
                  out.push(`| ${c.component} | ${c.rollup} | ${dims} |`);
                }
                console.log(out.join("\n"));
              '
            else
              echo "_No report produced — audit errored before writing output._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RTL shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtl-audit-report-${{ matrix.package }}
          path: |
            rtl-shard-scope.json
            rtl-audit-report.json
          if-no-files-found: error
          retention-days: 1

  # Stable required context joining the five package shards above.
  pr-rtl:
    needs: [check-scope, check-components, pr-rtl-shard]
    if: ${{ always() && !cancelled() && ((github.event_name == 'pull_request' && needs.check-scope.outputs.spec_only != 'true') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check')) }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Download applicable RTL shard reports
        if: ${{ needs.check-components.result == 'success' && (needs.check-components.outputs.has_rtl_components == 'true' || needs.check-components.outputs.has_rtl_harness == 'true' || needs.check-components.outputs.force_full_component_audits == 'true') }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: rtl-audit-report-*
          path: rtl-shard-reports

      - name: Require every applicable RTL shard
        if: always()
        run: |
          node .github/scripts/rtl-join.mjs \
            --check-components "${{ needs.check-components.result }}" \
            --shards "${{ needs.pr-rtl-shard.result }}" \
            --should-run "${{ needs.check-components.outputs.has_rtl_components == 'true' || needs.check-components.outputs.has_rtl_harness == 'true' || needs.check-components.outputs.force_full_component_audits == 'true' }}" \
            --force-full "${{ needs.check-components.outputs.force_full_component_audits }}" \
            --reports-dir rtl-shard-reports

  # Release-time projection only: the existing owners above do all measurement.
  # A skipped owner or main drift must never look like passing release evidence.
  release-check:
    needs:
      [
        check-scope,
        check-components,
        build-storybook,
        pr-visual,
        pr-a11y,
        pr-rtl,
      ]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'release-check' }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Require complete exact-head release branch checks
        uses: actions/github-script@v9
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          RELEASE_BRANCH: ${{ inputs['release-branch'] }}
          EXPECTED_HEAD: ${{ inputs['expected-head'] }}
          PLAN_DIGEST: ${{ needs.check-scope.outputs.release_plan_digest }}
        with:
          script: |
            const needs = JSON.parse(process.env.RELEASE_NEEDS);
            for (const name of ['check-scope', 'check-components', 'build-storybook', 'pr-visual', 'pr-a11y', 'pr-rtl']) {
              if (needs[name]?.result !== 'success') {
                throw new Error(`Required release job ${name} did not succeed: ${needs[name]?.result}`);
              }
            }
            const branch = process.env.RELEASE_BRANCH;
            const expectedHead = process.env.EXPECTED_HEAD;
            if (context.ref !== `refs/heads/${branch}`) {
              throw new Error('Release checks must run from the marked release branch.');
            }
            if (context.sha !== expectedHead) {
              throw new Error('Checked-out release commit does not match expected head.');
            }
            const {data} = await github.rest.git.getRef({...context.repo, ref: `heads/${branch}`});
            if (data.object.sha !== expectedHead) {
              throw new Error('Release branch moved during checks; dispatch release-check again for its new head.');
            }
            await core.summary
              .addHeading('Release checks complete')
              .addRaw(`Branch: ${branch}\n\n`)
              .addRaw(`Exact head: ${expectedHead}\n\n`)
              .addRaw(`Plan digest: ${process.env.PLAN_DIGEST}\n\n`)
              .addRaw('Canonical visual, accessibility, and RTL checks completed with full scope. Main movement is not release input. This receipt is reusable only for this exact branch, head, and plan digest; any cherry-pick requires a new run.')
              .write();
