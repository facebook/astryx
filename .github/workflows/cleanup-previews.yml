# Cleanup Preview Deployments — removes stale /pr/<number>/ previews and other
# leftovers from gh-pages.
#
# Runs on workflow_run after CI completes, NOT on pull_request. That matters:
# a pull_request workflow triggered by a fork gets a READ-ONLY token and can't
# push to gh-pages, so the cleanup push failed with a 403 for EVERY fork PR
# (see #4672). workflow_run runs from the base repo with the repo's own write
# token, so cleanup works for fork PRs too — one code path for every PR, no
# drift between a fork path and a same-repo path (mirrors deploy-preview.yml).
#
# The cleanup does not actually need the "closed" event: it reconciles the
# on-disk pr/ dirs against the live open-PR list (`gh pr list`) every run, so
# firing on any PR's CI completion (plus the daily cron) is sufficient to
# garbage-collect closed/merged previews.
#
# Safety: this NEVER checks out or runs PR-controlled code. It only checks out
# gh-pages and deletes stale paths. Do not add checkout of the PR head or
# execution of PR code here.

name: Cleanup Preview Deployments

on:
  schedule:
    - cron: '0 6 * * *' # Daily 6am UTC
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - log but do not delete'
        required: false
        default: false
        type: boolean

permissions: {}

# Serialize cleanup runs against each other so simultaneous runs don't race
# their gh-pages pushes. Deliberately NOT the "pages-deploy" group: joining it
# could cancel a PENDING main deploy (GitHub keeps only the newest pending run
# per group), leaving the site stale. Races against deploy.yml are handled by
# the push retry below instead.
concurrency:
  group: "cleanup-previews"
  cancel-in-progress: false

jobs:
  cleanup:
    # Only react to CI runs triggered by a pull request (matches
    # deploy-preview.yml); scheduled and manual runs have no workflow_run
    # payload and always proceed.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Cleanup stale deployments
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          # ---------------------------------------------------------------
          # gh-pages layout:
          #   /storybook/    — stable (managed by deploy.yml, never cleaned)
          #   /sandbox/      — stable (managed by deploy.yml, never cleaned)
          #   /pr/<number>/  — PR previews (cleaned when PR closes)
          #   /reports/      — vibe test reports (never cleaned)
          #   /visual-gate/  — visual baseline + gate reports (never cleaned
          #                    here; release-gate.yml prunes its own old runs,
          #                    and the baseline under visual-gate/baseline/ is
          #                    the reference the gate compares against — losing
          #                    it silently disarms visual regression testing)
          #   /assets/       — landing page CSS (never cleaned)
          #   /index.html    — landing page (never cleaned)
          #   /latest        — deploy hash pointer (never cleaned)
          #
          # Legacy: 7-char hex dirs from old deploy format are always deleted.
          # ---------------------------------------------------------------

          echo "Dry run: ${DRY_RUN}"
          echo ""

          DELETED=0
          # Every deleted path is recorded so the push-retry below can replay
          # the removals on top of a refreshed gh-pages tip.
          DELETED_PATHS=()

          # ----- Clean legacy hash directories -----
          # Old deploy format put previews at /<7-char-hex>/. These are all
          # stale now that PRs deploy to /pr/<number>/.
          mapfile -t HASH_DIRS < <(ls -d [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f] 2>/dev/null)
          if [ ${#HASH_DIRS[@]} -gt 0 ]; then
            echo "Found ${#HASH_DIRS[@]} legacy hash directories — removing all"
            for dir in "${HASH_DIRS[@]}"; do
              echo "  DELETE ${dir} (legacy)"
              if [ "$DRY_RUN" != "true" ]; then
                git rm -rf --quiet "$dir"
              fi
              DELETED_PATHS+=("$dir")
              DELETED=$((DELETED + 1))
            done
            echo ""
          fi

          # ----- Clean closed PR previews -----
          if [ -d "pr" ]; then
            mapfile -t PR_DIRS < <(ls pr/ 2>/dev/null)
            echo "Found ${#PR_DIRS[@]} PR preview(s)"

            # Get open PR numbers. --limit is REQUIRED: `gh pr list` defaults to
            # 30 results, so without it any still-open PR outside the newest 30
            # is absent from this list, mistaken for closed, and its preview
            # wrongly deleted. The repo routinely has >100 open PRs, so cap high.
            #
            # A failed/empty fetch is fatal to guard against: if OPEN_PRS is
            # empty, every preview looks "closed" and the whole pr/ tree gets
            # deleted. Only proceed when we have a confirmed non-empty list.
            if OPEN_PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number --jq '.[].number'); then
              OPEN_PR_COUNT=$(echo "$OPEN_PRS" | grep -c '[0-9]' || true)
            else
              OPEN_PR_COUNT=0
            fi

            if [ "$OPEN_PR_COUNT" -eq 0 ]; then
              echo "  Could not fetch open PRs (or none open) — skipping PR cleanup this run to avoid mass-deleting live previews"
              PR_DIRS=()
            fi

            for pr_num in "${PR_DIRS[@]}"; do
              if echo "$OPEN_PRS" | grep -qx "$pr_num"; then
                echo "  KEEP  pr/${pr_num} — open"
              else
                echo "  DELETE pr/${pr_num} — closed/merged"
                if [ "$DRY_RUN" != "true" ]; then
                  git rm -rf --quiet "pr/${pr_num}"
                fi
                DELETED_PATHS+=("pr/${pr_num}")
                DELETED=$((DELETED + 1))
              fi
            done
            echo ""
          fi

          # ----- Drop template-assets from previews -----
          # Every preview uses the one shared /sandbox/template-assets copy.
          # Sweep duplicate copies left by earlier deploys.
          if [ -d "pr" ]; then
            TA_PURGED=0
            for ta in pr/*/sandbox/template-assets; do
              [ -d "$ta" ] || continue
              echo "  DELETE ${ta} (duplicate preview copy)"
              if [ "$DRY_RUN" != "true" ]; then
                git rm -rf --quiet "$ta"
              fi
              DELETED_PATHS+=("$ta")
              TA_PURGED=$((TA_PURGED + 1))
              DELETED=$((DELETED + 1))
            done
            if [ "$TA_PURGED" -gt 0 ]; then
              echo "Purged template-assets from ${TA_PURGED} preview(s)"
              echo ""
            fi
          fi

          # ----- Clean stale root-level files -----
          # Leftovers from old Storybook-at-root deploy format
          ROOT_STALE=0
          for item in favicon.svg iframe.html index.json project.json \
                      nunito-sans-bold-italic.woff2 nunito-sans-bold.woff2 \
                      nunito-sans-italic.woff2 nunito-sans-regular.woff2 \
                      sb-addons sb-common-assets sb-manager; do
            if [ -e "$item" ]; then
              echo "  DELETE root/$item (stale)"
              if [ "$DRY_RUN" != "true" ]; then
                git rm -rf --quiet "$item"
              fi
              DELETED_PATHS+=("$item")
              ROOT_STALE=$((ROOT_STALE + 1))
              DELETED=$((DELETED + 1))
            fi
          done
          if [ "$ROOT_STALE" -gt 0 ]; then
            echo "Cleaned ${ROOT_STALE} stale root-level items"
            echo ""
          fi

          # ----- Clean old report screenshots -----
          # Screenshots are large (~30 per report). Purge them from reports
          # older than 30 days to control gh-pages size. The report HTML
          # (index.html) and previews are tiny — keep those forever.
          if [ -d "reports" ]; then
            SCREENSHOT_PURGED=0
            CUTOFF_DATE=$(date -d "30 days ago" +%s 2>/dev/null || date -v-30d +%s 2>/dev/null || echo "0")
            if [ "$CUTOFF_DATE" != "0" ]; then
              for report_dir in reports/*/; do
                screenshots_dir="${report_dir}screenshots"
                if [ -d "$screenshots_dir" ]; then
                  # Use the git commit date for the screenshots directory
                  COMMIT_DATE=$(git log -1 --format="%ct" -- "$screenshots_dir" 2>/dev/null || echo "0")
                  if [ "$COMMIT_DATE" != "0" ] && [ "$COMMIT_DATE" -lt "$CUTOFF_DATE" ]; then
                    REPORT_NAME=$(basename "$report_dir")
                    PNG_COUNT=$(find "$screenshots_dir" -name '*.png' 2>/dev/null | wc -l)
                    echo "  DELETE ${screenshots_dir} — ${PNG_COUNT} screenshots older than 30 days"
                    if [ "$DRY_RUN" != "true" ]; then
                      git rm -rf --quiet "$screenshots_dir"
                    fi
                    DELETED_PATHS+=("$screenshots_dir")
                    SCREENSHOT_PURGED=$((SCREENSHOT_PURGED + 1))
                    DELETED=$((DELETED + 1))
                  fi
                fi
              done
              if [ "$SCREENSHOT_PURGED" -gt 0 ]; then
                echo "Purged screenshots from ${SCREENSHOT_PURGED} old reports"
                echo ""
              fi
            fi
          fi

          # ----- Summary -----
          echo "Summary: ${DELETED} items deleted"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — no changes committed"
            exit 0
          fi

          if [ "$DELETED" -eq 0 ]; then
            echo "Nothing to clean up"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Push with retry. gh-pages has concurrent writers — most notably
          # deploy.yml, which force-orphan pushes on every main push, i.e.
          # exactly when a merged PR also fires this workflow — so a plain
          # push loses that race with "[rejected] (fetch first)". Because
          # force_orphan rewrites history, a rebase can't recover; instead
          # reset to the fresh remote tip and replay the recorded deletions
          # on top of it. deploy.yml preserves pr/ and reports/ across
          # deploys, so the stale paths are still there to delete.
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if [ "$attempt" -gt 1 ]; then
              echo "Push rejected (concurrent gh-pages update) — retrying in $((attempt * 2))s"
              sleep $((attempt * 2))
              git fetch --depth=1 origin gh-pages
              git reset --hard FETCH_HEAD
              git rm -r -f -q --ignore-unmatch -- "${DELETED_PATHS[@]}"
              if git diff --cached --quiet; then
                echo "Stale paths already removed upstream — nothing left to push"
                exit 0
              fi
            fi

            git commit -m "chore: cleanup ${DELETED} stale deployments"
            PUSH_OUT=$(git push origin gh-pages 2>&1) && {
              echo "Pushed cleanup commit"
              exit 0
            }
            echo "$PUSH_OUT"

            # A 403/permission denial is not a race — retrying can never fix it
            # (this is exactly what broke fork PRs before the workflow_run
            # migration). Fail fast with the real cause instead of burning all
            # attempts behind a misleading "concurrent update" message.
            if echo "$PUSH_OUT" | grep -qiE 'denied|403|permission|not authorized'; then
              echo "::error::Push to gh-pages denied (403/permissions) — not a race, aborting. Ensure this job runs with the base-repo write token (workflow_run), not a fork's read-only token."
              exit 1
            fi
          done

          echo "::error::Failed to push cleanup after ${MAX_ATTEMPTS} attempts"
          exit 1
