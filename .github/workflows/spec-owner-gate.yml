# Current knowledge records are consequential to future reviewers. Creating,
# changing, or archiving one waits for owner approval. ENGOWNERS may approve
# every record kind. Current design and theme records, component/module
# Design-decision-only changes, and normative design assets also accept
# DESIGNOWNERS. Mixed DD plus other component/module spec edits require both
# design and engineering. Other mixed PRs keep every applicable owner-group
# requirement. Pure spec-record PRs
# skip heavy CI only when every changed path is recognized; draft-only records
# can auto-merge after validation, while current records also need approval on
# the exact current head. Stacked PRs (based on another PR's branch) are gated
# against their current base too; pull_request_target always runs this file and
# the checkout from the default branch, and a base change reconciles again.
# Commit statuses are shared by every PR with the same head, so the required
# "spec-owner-approval" context is published only for a PR the default branch's
# protection governs; any other PR gets "spec-owner-approval/stacked-pr-<n>".
name: Spec owner gate

on:
  # No base-branch filter; `edited` is admitted only for base changes (see the
  # reconcile job's condition).
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        auto_merge_enabled,
        edited,
      ]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to reconcile
        required: true
        type: string
      backfill:
        description: >-
          Publish the gate status only. Use this when backfilling heads that
          predate the required check, so a reconcile cannot also enable
          auto-merge on a pull request nobody asked to land.
        required: false
        default: false
        type: boolean

permissions: {}

env:
  REVIEW_LABEL: needs:spec-owner-review
  AUTO_MERGE_LABEL: spec-auto-merge

jobs:
  reconcile:
    # Fork review events have read-only tokens. Same-repo reviews reconcile
    # automatically; fork approvals use the trusted issue_comment command path.
    # The comment filter admits any owner-command shape, including one missing
    # the head SHA, so the reconciler answers it instead of ignoring it. A
    # title/body edit changes nothing the gate reads; a base change does. A
    # dispatch runs the workflow file from the selected ref, so only the default
    # branch's copy may publish the gate.
    if: >-
      (github.event_name != 'pull_request_review' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request != null &&
        (startsWith(github.event.comment.body, '/approve-spec') ||
         startsWith(github.event.comment.body, '/revoke-spec')))) &&
      (github.event.action != 'edited' ||
       github.event.changes.base != null) &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      # Every privileged event checks out the trusted default branch. Never
      # execute the PR merge ref or PR-controlled helpers with write permissions.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Reconcile owner gate
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const path = require('node:path');
            const {reconcileSpecOwnerGate} = require(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/spec-owner-reconcile.cjs',
            ));
            await reconcileSpecOwnerGate({github, context, core});
