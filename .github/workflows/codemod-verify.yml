# Codemod verification — ensures codemods can reproduce callsite changes
#
# When a PR adds/modifies codemods AND touches consumer code (apps/, stories),
# this workflow:
# 1. Reverts the consumer code changes to the base branch state
# 2. Runs the codemods from source against that reverted code
# 3. Verifies the codemod output matches the PR's committed changes
#
# This enforces the rule: "never manually update callsites — always use the codemod"
# If the codemod can't reproduce the changes, either the codemod is incomplete
# or callsites were hand-edited.
name: Codemod Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: ["main"]
    paths:
      - "packages/cli/assets/codemods/**"

permissions: {}

concurrency:
  # A label other than ci:run starts a run that skips every job; its own
  # group keeps it from cancelling a real run (spec:AST-030 FR17).
  group: "codemod-verify-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:run' && '-other-label' || '' }}"
  cancel-in-progress: true

jobs:
  verify-codemods:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft && (github.event.action != 'labeled' || github.event.label.name == 'ci:run') && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) || contains(github.event.pull_request.labels.*.name, 'ci:run')))
    runs-on: 2-core-ubuntu-arm
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Verify codemod reproduces callsite changes
        id: verify
        run: node .github/scripts/codemod-verify.mjs
